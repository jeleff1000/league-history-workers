name: Build Fleaflicker team-signal bridge targets

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: The one approved research cache key; this workflow cannot write it.
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pytest==8.3.5
      - name: Test cache-native target builder
        run: python -m pytest -q tests/research_cohorts/test_build_fleaflicker_team_signal_targets.py
      - name: Record immutable cache pre-state
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/corpus_snapshot.duckdb > corpus_before.sha256
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          Path('prestate.json').write_text(json.dumps({
              'player_schema': [r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()],
              'player_rows': int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
          }, indent=2)+'\n')
          con.close()
          PY
      - name: Materialize exact current targets without cache mutation
        run: |
          python scripts/research_cohorts/build_fleaflicker_team_signal_targets.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out out/fleaflicker_team_signal_targets.parquet \
            --report out/fleaflicker_team_signal_targets.json
      - name: Fail if any cache or lineage mutation occurred
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/corpus_snapshot.duckdb > corpus_after.sha256
          sha256sum research_public_lake/ops_cache.duckdb > ops_after.sha256
          diff -u corpus_before.sha256 corpus_after.sha256
          diff -u ops_before.sha256 ops_after.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          before=json.loads(Path('prestate.json').read_text())
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          after={
              'player_schema': [r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()],
              'player_rows': int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
          }
          con.close()
          if after != before:
              raise SystemExit(f'cache changed during read-only target build: {after} != {before}')
          report=json.loads(Path('out/fleaflicker_team_signal_targets.json').read_text())
          if report.get('cache_mutated') or report.get('new_lineage') or not report.get('read_only'):
              raise SystemExit(f'unsafe target report: {report}')
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-fleaflicker-team-signal-targets-${{ github.run_id }}
          path: |
            out/fleaflicker_team_signal_targets.parquet
            out/fleaflicker_team_signal_targets.json
            prestate.json
            corpus_before.sha256
            corpus_after.sha256
            ops_before.sha256
            ops_after.sha256
          if-no-files-found: error
          retention-days: 30
