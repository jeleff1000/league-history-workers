name: MFL Promote Three Campaign Runs

on:
  workflow_dispatch:
    inputs:
      prior_index_key:
        description: Exact current canonical MFL index cache key
        required: true
        type: string
      output_suffix:
        description: Immutable successor suffix for the one canonical MFL cache line
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download campaign 31927416662 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31927416662
          pattern: mfl-register-batch-*
          path: receipts/run-31927416662
          merge-multiple: false
      - name: Download campaign 31927415400 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31927415400
          pattern: mfl-register-batch-*
          path: receipts/run-31927415400
          merge-multiple: false
      - name: Download campaign 31927414796 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31927414796
          pattern: mfl-register-batch-*
          path: receipts/run-31927414796
          merge-multiple: false
      - name: Checkout canonical merger
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: codex/mfl-gates
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fantasy_football_data_scripts/multi_league/core/canonical_player.py
            /scripts/extraplatform_corpus/merge_mfl_chunk.py
            /scripts/extraplatform_corpus/merge_mfl_saved_chunk.py
            /scripts/research_cohorts/build_mfl_research_overlay.py
      - name: Restore current canonical MFL index
        uses: actions/cache/restore@v5
        with:
          path: index_state
          key: ${{ inputs.prior_index_key }}
          fail-on-cache-miss: true
      - name: Set up Python and DuckDB
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install DuckDB
        run: python -m pip install duckdb
      - name: Build expected manifest from successful campaign receipts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for receipt_path in sorted(Path('receipts').rglob('receipt.json')):
              receipt = json.loads(receipt_path.read_text())
              rows.append({
                  'season': int(receipt['season']),
                  'league_id': str(receipt['league_id']),
                  'db_name': str(receipt['db_name']),
                  'lineage_id': str(receipt.get('lineage_id', '')),
              })
          for batch_path in sorted(Path('receipts').rglob('batch_receipt.json')):
              batch = json.loads(batch_path.read_text())
              for failure in batch.get('failures', []):
                  rows.append({
                      'season': int(failure['season']),
                      'league_id': str(failure['league_id']),
                  })
          keys = [(int(row['season']), str(row['league_id'])) for row in rows]
          if len(keys) != len(set(keys)):
              raise SystemExit('duplicate league-year key across the three campaign runs')
          Path('expected.json').write_text(json.dumps({'rows': rows}, indent=2, sort_keys=True))
          print(json.dumps({'expected_rows': len(rows), 'successful_receipts': sum(1 for p in Path('receipts').rglob('receipt.json'))}))
          PY
      - name: Build canonical source chunk from all three runs
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
        run: |
          printf '{}' > empty_prior_index.json
          python code/scripts/extraplatform_corpus/merge_mfl_chunk.py \
            --receipts receipts \
            --expected expected.json \
            --prior-index empty_prior_index.json \
            --output-db source_chunk.duckdb \
            --output-index source_index.json \
            --proof source_proof.json \
            --chunk-key "mfl-source-three-campaigns-${{ inputs.output_suffix }}"
      - name: Append source chunk to canonical MFL cache
        run: |
          python code/scripts/extraplatform_corpus/merge_mfl_saved_chunk.py \
            --source-db source_chunk.duckdb \
            --source-index source_index.json \
            --prior-index index_state/mfl_register_all_runs.json \
            --output-db mfl_register_chunk.duckdb \
            --output-index mfl_register_all_runs.json \
            --proof cache_append_proof.json \
            --output-key "mfl-registered-2004-2018-v2-chunk-${{ inputs.output_suffix }}"
          python - <<'PY'
          import json
          p=json.load(open('cache_append_proof.json'))
          required={'schema_unchanged': True, 'prior_rows_preserved': True, 'new_lineage': False, 'duplicate_league_year_keys': False}
          for key,value in required.items():
              if p.get(key) != value: raise SystemExit(f'{key} proof failed')
          if p.get('added_league_count', 0) <= 0: raise SystemExit('no new league-years were added')
          print(json.dumps(p, sort_keys=True))
          PY
      - name: Build exact research overlay
        run: |
          python code/scripts/research_cohorts/build_mfl_research_overlay.py \
            --chunk mfl_register_chunk.duckdb \
            --output mfl_research_overlay.duckdb
      - name: Save the single canonical MFL checkpoint
        uses: actions/cache/save@v5
        with:
          path: |
            mfl_register_chunk.duckdb
            cache_append_proof.json
          key: mfl-registered-2004-2018-v2-chunk-${{ inputs.output_suffix }}
      - name: Save canonical MFL index
        uses: actions/cache/save@v5
        with:
          path: mfl_register_all_runs.json
          key: mfl-registered-2004-2018-v2-index-${{ inputs.output_suffix }}
      - name: Save canonical research overlay
        uses: actions/cache/save@v5
        with:
          path: mfl_research_overlay.duckdb
          key: mfl-registered-2004-2018-v2-research-overlay-${{ inputs.output_suffix }}
      - name: Upload promotion proof
        uses: actions/upload-artifact@v4
        with:
          name: mfl-three-campaign-promotion-proof-${{ github.run_id }}
          retention-days: 90
          path: |
            source_proof.json
            cache_append_proof.json
            mfl_register_all_runs.json
