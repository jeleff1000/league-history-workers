name: Promote Outcomes After Championship Repair

on:
  workflow_dispatch:
    inputs:
      outcome_applied_run_id:
        description: Successful full outcome-applied snapshot
        required: true
        default: "31108438350"
      base_cache_key:
        description: Repaired championship cache to use as parent
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v1
      output_cache_key:
        description: New canonical cache containing championship and outcomes
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-outcomes-v1

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Fail-fast verify outcome artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="research-outcome-applied-lake-${{ inputs.outcome_applied_run_id }}"
          row=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ inputs.outcome_applied_run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$name\") | [.expired,.size_in_bytes] | @tsv")
          test -n "$row"
          test "$(cut -f1 <<<"$row")" = false
          test "$(cut -f2 <<<"$row")" -gt 1000000000
          echo "outcome artifact PASS: $(cut -f2 <<<"$row") bytes"
      - name: Download prior outcome snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p outcome_base
          gh run download '${{ inputs.outcome_applied_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-outcome-applied-lake-${{ inputs.outcome_applied_run_id }}' \
            --dir outcome_base
          find outcome_base -name corpus_snapshot.duckdb -type f -size +1000000000c | head -1 > outcome_path.txt
          test -s outcome_path.txt
      - name: Extract exact outcome diff and merge
        run: |
          set -euo pipefail
          python - "$(cat outcome_path.txt)" <<'PY'
          import duckdb, json, os, sys
          from pathlib import Path
          old_path = sys.argv[1]
          parent_path = Path("research_public_lake/corpus_snapshot.duckdb").resolve()
          out = duckdb.connect("outcome_overlay.duckdb")
          out.execute("create schema public")
          parent = str(parent_path).replace("'", "''")
          old = str(Path(old_path).resolve()).replace("'", "''")
          out.execute(f"attach '{parent}' as parent (read_only)")
          out.execute(f"attach '{old}' as old (read_only)")
          out.execute("""
            create table public.outcome_targets as
            select o.db_name, cast(o.year as integer) as year,
                   cast(o.week as integer) as week, o.NFL_player_id,
                   cast(o.win as integer) as win, cast(o.team_points as double) as team_points
            from old.public.player_fantasy o
            join parent.public.player_fantasy b
              on b.db_name=o.db_name and b.year=o.year and b.week=o.week
             and b.NFL_player_id=o.NFL_player_id
            where (b.win is null or b.team_points is null)
              and (o.win is not null or o.team_points is not null)
          """)
          count = out.execute("select count(*) from public.outcome_targets").fetchone()[0]
          keys = out.execute("select count(*) from (select distinct db_name,year,week,NFL_player_id from public.outcome_targets)").fetchone()[0]
          print({"outcome_diff_rows": count, "distinct_keys": keys})
          if count != 1145460 or keys != 1145460:
              raise SystemExit(f"unexpected outcome diff: rows={count}, keys={keys}")
          out.close()
          empty = duckdb.connect("empty_matchups.duckdb")
          empty.execute("create schema public")
          empty.execute(f"attach '{parent}' as parent (read_only)")
          empty.execute("create table public.source_matchup_rescue as select * from parent.public.matchup where 1=0")
          empty.close()
          os.remove(old_path)
          PY
          python code/scripts/research_cohorts/merge_research_sidecars.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out merged_corpus_snapshot.duckdb \
            --outcomes outcome_overlay.duckdb \
            --matchups empty_matchups.duckdb
          mv merged_corpus_snapshot.duckdb research_public_lake/corpus_snapshot.duckdb
      - name: Validate outcome promotion and write lineage
        run: |
          set -euo pipefail
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
          python - <<'PY'
          import duckdb, json
          c=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          o=duckdb.connect('outcome_overlay.duckdb', read_only=True)
          missing=c.execute("""
            select count(*) from outcome_overlay.public.outcome_targets t
            join public.player_fantasy p using (db_name,year,week,NFL_player_id)
            where p.win is null or p.team_points is null
          """).fetchone()[0]
          if missing:
              raise SystemExit(f"outcome promotion left {missing} target fields unresolved")
          result={"outcome_targets":o.execute('select count(*) from public.outcome_targets').fetchone()[0],"remaining_target_rows":missing}
          print(result)
          with open('lineage_manifest.json','w') as f:
              json.dump({"parent_cache":"${{ inputs.base_cache_key }}","layers":{"championship_signals":True,"outcomes":True},"outcome_target_rows":result["outcome_targets"]},f,indent=2)
          PY
      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: ${{ inputs.output_cache_key }}
      - uses: actions/upload-artifact@v4
        with:
          name: research-championship-outcomes-manifest-${{ github.run_id }}
          path: |
            outcome_overlay.duckdb
            lineage_manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
