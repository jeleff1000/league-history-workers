name: Validate captured MFL source-team player bridge

on:
  workflow_dispatch:
    inputs:
      shard:
        description: Captured successful roster-bridge shard to validate against the approved cache.
        required: true
        default: '4'

permissions:
  actions: read
  contents: read

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
  SOURCE_RUN_ID: '31643933065'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pandas==2.2.3 pyarrow==15.0.2
      - name: Record immutable cache state
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          result={
            'schema': con.execute('DESCRIBE public.player_fantasy').fetchall(),
            'rows': int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
          }
          con.close()
          Path('cache_before.json').write_text(json.dumps(result, indent=2)+'\n')
          PY
      - name: Download an already captured source shard; do not call an API
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ inputs.shard }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="mfl-source-only-roster-bridge-${SHARD}-${SOURCE_RUN_ID}"
          mkdir -p captured out candidate_input
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir captured
          membership=$(find captured -name memberships.parquet -print -quit)
          crosswalk=$(find captured -name crosswalk.parquet -print -quit)
          signals=$(find captured -name shard_source_signals.parquet -print -quit)
          test -s "$membership" && test -s "$crosswalk" && test -s "$signals"
          echo "MEMBERSHIPS=$membership" >> "$GITHUB_ENV"
          echo "CROSSWALK=$crosswalk" >> "$GITHUB_ENV"
          echo "SIGNALS=$signals" >> "$GITHUB_ENV"
      - name: Build source-proven bridge and audit candidate cache fills
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_cohorts/build_mfl_source_team_player_bridge.py \
            --memberships "$MEMBERSHIPS" --crosswalk "$CROSSWALK" --team-signals "$SIGNALS" \
            --out out/source_team_player_bridge.parquet --report out/source_team_player_bridge_report.json
          cp "$SIGNALS" candidate_input/team_signals.parquet
          cp out/source_team_player_bridge.parquet candidate_input/player_bridge.parquet
          python scripts/research_cohorts/audit_team_signal_candidates.py \
            --base research_public_lake/corpus_snapshot.duckdb --candidates candidate_input --out out/candidate
      - name: Fail if anything altered either cache file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          before=json.loads(Path('cache_before.json').read_text())
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          assert con.execute('DESCRIBE public.player_fantasy').fetchall()==[tuple(row) for row in before['schema']]
          assert int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0])==before['rows']
          con.close()
          digest=hashlib.sha256()
          with Path('research_public_lake/ops_cache.duckdb').open('rb') as f:
              for block in iter(lambda:f.read(1024*1024), b''): digest.update(block)
          assert digest.hexdigest()==Path('ops_before.sha256').read_text().split()[0]
          bridge=json.loads(Path('out/source_team_player_bridge_report.json').read_text())
          candidate=json.loads(Path('out/candidate/team_signal_candidate_report.json').read_text())
          assert bridge['cache_mutated'] is False and bridge['new_lineage'] is False
          assert candidate['cache_mutated'] is False and candidate['new_lineage'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mfl-source-team-bridge-validation-${{ inputs.shard }}-${{ github.run_id }}
          path: |
            out/
            cache_before.json
            ops_before.sha256
          retention-days: 90
          compression-level: 0
