name: Finalize one completed research artifact audit

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    outputs:
      summary: ${{ steps.expose.outputs.summary }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v5
        with:
          repository: ${{ github.repository }}
          run-id: 31319638678
          github-token: ${{ github.token }}
          pattern: research-artifact-audit-31319638678-[0-9]*
          path: audit_parts
          merge-multiple: false
      - name: Consolidate and validate all artifact inspectors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          paths = sorted(Path('audit_parts').rglob('artifact_audit.json'))
          print(f'downloaded_inspector_json_files={len(paths)}')
          parts = [json.loads(path.read_text()) for path in paths]
          if not parts:
              raise SystemExit('no inspector artifacts downloaded')
          manifest_count = parts[0]['manifest_artifacts']
          records = [record for part in parts for record in part['results']]
          ids = [record['artifact_id'] for record in records]
          errors = [record for record in records if record.get('status') != 'inspected']
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          report = {'source_run_id': 31319638678, 'manifest_artifacts': manifest_count, 'inspected_records': len(records), 'inspection_errors': len(errors), 'duplicate_artifact_ids': duplicates, 'complete': len(records) == manifest_count and not errors and not duplicates, 'records': sorted(records, key=lambda item: (item['artifact_id'], item.get('artifact','')))}
          Path('artifact_audit_complete.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\\n')
          with Path('artifact_checklist.csv').open('w', newline='', encoding='utf-8') as handle:
              fields = ['artifact_id','artifact','workflow_run_id','created_at','artifact_status','file','file_type','kind','rows','column_count','columns','missing_canonical','forbidden_columns']
              writer = csv.DictWriter(handle, fieldnames=fields); writer.writeheader()
              for record in report['records']:
                  for file_record in record.get('files') or [{}]:
                      writer.writerow({'artifact_id':record.get('artifact_id'),'artifact':record.get('artifact'),'workflow_run_id':record.get('workflow_run_id'),'created_at':record.get('created_at'),'artifact_status':record.get('status'),'file':file_record.get('file'),'file_type':file_record.get('type'),'kind':file_record.get('kind'),'rows':file_record.get('rows'),'column_count':file_record.get('column_count'),'columns':json.dumps(file_record.get('columns',[]),separators=(',',':')),'missing_canonical':json.dumps(file_record.get('missing_canonical',[]),separators=(',',':')),'forbidden_columns':json.dumps(file_record.get('forbidden_columns',[]),separators=(',',':'))})
          print(json.dumps({'source_run_id':report['source_run_id'],'manifest_artifacts':report['manifest_artifacts'],'inspected_json_files':len(parts),'inspected_records':report['inspected_records'],'inspection_errors':report['inspection_errors'],'duplicate_count':len(duplicates),'complete':report['complete']}))
          print('complete_gate=' + str(report['complete']).lower())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-artifact-audit-complete-31319638678
          path: |
            artifact_audit_complete.json
            artifact_checklist.csv
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - id: expose
        name: Expose audit counts
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('artifact_audit_complete.json').read_text())
          summary=f"{report['manifest_artifacts']}-{report['inspected_records']}-{report['inspection_errors']}-{len(report['duplicate_artifact_ids'])}"
          print(summary)
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write('summary=' + summary + '\\n')
          PY

  verify:
    name: Verify audit (${{ needs.aggregate.outputs.summary }})
    needs: aggregate
    if: ${{ needs.aggregate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-audit-complete-31319638678
          path: completed
      - name: Verify completeness gate from uploaded evidence
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('completed/artifact_audit_complete.json').read_text())
          print(json.dumps({k:report[k] for k in ('source_run_id','manifest_artifacts','inspected_records','inspection_errors','complete')}))
          if report['manifest_artifacts'] != report['inspected_records']:
              raise SystemExit('record-count gate failed')
          if report['inspection_errors']:
              raise SystemExit('inspection-error gate failed')
          if report['duplicate_artifact_ids']:
              raise SystemExit('duplicate-id gate failed')
      - name: Check record count equality
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('completed/artifact_audit_complete.json').read_text())
          print(f"manifest={r['manifest_artifacts']} records={r['inspected_records']}")
          raise SystemExit(0 if r['manifest_artifacts']==r['inspected_records'] else 1)
          PY
      - name: Check inspection errors
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('completed/artifact_audit_complete.json').read_text())
          print(f"inspection_errors={r['inspection_errors']}")
          raise SystemExit(0 if r['inspection_errors']==0 else 1)
          PY
      - name: Check duplicate IDs
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('completed/artifact_audit_complete.json').read_text())
          print(f"duplicate_ids={len(r['duplicate_artifact_ids'])}")
          raise SystemExit(0 if not r['duplicate_artifact_ids'] else 1)
          PY
      - name: Enforce complete audit
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('completed/artifact_audit_complete.json').read_text())
          if r['manifest_artifacts'] != r['inspected_records'] or r['inspection_errors'] != 0 or r['duplicate_artifact_ids']:
              raise SystemExit('artifact audit incomplete')
          print('verified_complete=true')
          PY
