name: MFL Candidate Probe (1993-2025)

on:
  workflow_dispatch:
    inputs:
      candidate_path:
        description: 'Candidate pool in the private pipeline checkout'
        required: false
        type: string
        default: corpus_seed/mfl_candidate_pool_1993_2025.json
      yahoo_oauth_ref:
        required: false
        type: string
        default: codex/mfl-gates
      years:
        description: 'JSON array of seasons to probe'
        required: false
        type: string
        default: '[1993,1994,1995,1996,1997,1998,1999,2000,2001,2002,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]'
      max_valid:
        description: 'Number of valid scheduled candidates to retain per season'
        required: false
        type: string
        default: '10'
      shards:
        description: 'JSON array of candidate-pool shard numbers'
        required: false
        type: string
        default: '[0]'
      shard_count:
        description: 'Total candidate-pool shards'
        required: false
        type: string
        default: '1'
      allow_partial:
        description: 'Upload partial shard results without requiring max_valid'
        required: false
        type: string
        default: 'false'

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        year: ${{ fromJSON(inputs.years) }}
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      CORPUS_MODE: '1'
      MFL_RATE_LIMIT_PER_MIN: '12'
      PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
    steps:
      - name: Checkout private pipeline and candidate pool
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.yahoo_oauth_ref }}
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /corpus_seed/
            /fantasy_football_data_scripts/
            /requirements.txt
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: pip install -r code/requirements.txt
      - name: Probe candidate IDs against MFL
        env:
          YEAR: ${{ matrix.year }}
          CANDIDATE_PATH: code/${{ inputs.candidate_path }}
          MAX_VALID: ${{ inputs.max_valid }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from multi_league.data_fetchers.mfl.mfl_api_client import MFLAPIClient, MFLAPIError, MFLAPIConfig
          year = int(os.environ['YEAR'])
          rows = json.load(open(os.environ['CANDIDATE_PATH'], encoding='utf-8'))['leagues']
          all_candidates = [r for r in rows if int(r['season']) == year]
          shard = int(os.environ['SHARD'])
          shard_count = int(os.environ['SHARD_COUNT'])
          candidates = [r for i, r in enumerate(all_candidates) if i % shard_count == shard]
          client = MFLAPIClient(MFLAPIConfig(rate_limit_per_min=12))
          valid = []
          for r in candidates:
              if len(valid) >= int(os.environ['MAX_VALID']):
                  break
              lid = str(r['league_id'])
              try:
                  payload = client.fetch_league(lid, year)
                  schedule = client.fetch_schedule(lid, year)
                  weeks = (schedule or {}).get('weeklySchedule', [])
                  if isinstance(weeks, dict):
                      weeks = [weeks]
                  has_matchups = any(
                      isinstance(w, dict) and w.get('matchup')
                      for w in weeks
                  )
                  # The schedule endpoint alone is not enough for ancient MFL:
                  # some archived leagues advertise a schedule but weeklyResults
                  # contains only flat franchise totals. Require actual matchup
                  # pairs, player payloads, and at least one explicit playoff game
                  # before admitting a candidate to the full-register manifest.
                  weekly_blocks = []
                  last_regular_week = None
                  try:
                      last_regular_week = int(payload.get('lastRegularSeasonWeek'))
                  except (TypeError, ValueError):
                      pass
                  week_numbers = []
                  for w in weeks:
                      if isinstance(w, dict):
                          try:
                              week_numbers.append(int(w.get('week')))
                          except (TypeError, ValueError):
                              pass
                  # Two evidence weeks are enough for admission and keep the
                  # probe within MFL's old-season throttle: opening week proves
                  # H2H/player payloads, final scheduled week proves postseason
                  # payloads when the league exposes a boundary.
                  check_weeks = set(week_numbers[:1] + week_numbers[-1:])
                  for week in sorted(check_weeks):
                      if week not in week_numbers:
                          continue
                      weekly = client.fetch_weekly_results(lid, year, week) or {}
                      weekly_blocks.append(weekly)
                  has_pair = False
                  has_players = False
                  has_playoff = False
                  for weekly in weekly_blocks:
                      matchups = weekly.get('matchup') or []
                      if isinstance(matchups, dict):
                          matchups = [matchups]
                      for matchup in matchups:
                          if not isinstance(matchup, dict):
                              continue
                          sides = matchup.get('franchise') or []
                          if isinstance(sides, dict):
                              sides = [sides]
                          if len(sides) == 2:
                              has_pair = True
                              has_players = has_players or any(
                                  isinstance(side, dict) and side.get('player')
                                  for side in sides
                              )
                          if str(matchup.get('regularSeason')).strip() == '0' or (
                              last_regular_week is not None and week > last_regular_week
                          ):
                              has_playoff = True
                      flat = weekly.get('franchise') or []
                      if isinstance(flat, dict):
                          flat = [flat]
                      has_players = has_players or any(
                          isinstance(franchise, dict) and franchise.get('player')
                          for franchise in flat
                      )
                  if payload and isinstance(payload, dict) and has_matchups and has_pair and has_players and has_playoff:
                      valid.append(r)
                      print(f"[VALID-YTD-H2H-PLAYOFF] {year}:{lid}", flush=True)
                  else:
                      print(f"[INVALID] {year}:{lid} missing schedule/YTD pair/player/playoff signal", flush=True)
              except Exception as exc:
                  print(f"[INVALID] {year}:{lid} {exc}", flush=True)
          if len(valid) < int(os.environ['MAX_VALID']) and os.environ['ALLOW_PARTIAL'].lower() not in {'1','true','yes'}:
              raise SystemExit(f"{year} has only {len(valid)} valid candidates")
          json.dump({'schema_version':'mfl_candidate_probe_v3_ytd_h2h_playoff','season':year,'shard':shard,'valid_leagues':valid}, open(f'valid_{year}_{shard}.json','w'), indent=2, sort_keys=True)
          PY
      - name: Upload valid candidate probe
        uses: actions/upload-artifact@v4
        with:
          name: mfl-valid-candidates-${{ matrix.year }}-${{ matrix.shard }}
          retention-days: 30
          path: valid_${{ matrix.year }}_${{ matrix.shard }}.json
