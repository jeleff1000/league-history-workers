name: Research matchup cache schema read

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read

jobs:
  describe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Describe cache source and CMC population
        run: |
          python - <<'PY'
          import duckdb, json
          c=duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          for name in (
              'lake.public.player_fantasy',
              'lake.public.matchup',
              'ops.nfl_historical.nfl_player_stats_all',
          ):
              cols=c.execute(f'DESCRIBE {name}').fetchall()
              print(f'DESCRIBE {name}=' + json.dumps(cols))
          print('ops_bye_tables=' + json.dumps(c.execute("""
              SELECT table_schema, table_name
              FROM information_schema.tables
              WHERE table_catalog='ops' AND lower(table_name) LIKE '%bye%'
              ORDER BY 1,2
          """).fetchall()))
          print('cmc_player_fantasy_weeks=' + json.dumps(c.execute("""
              SELECT CAST(week AS INTEGER) AS week,
                     COUNT(*) AS source_rows,
                     COUNT(DISTINCT db_name) AS leagues,
                     COUNT(*) FILTER (WHERE is_rostered IS NULL) AS null_roster_rows,
                     COUNT(*) FILTER (WHERE CAST(is_rostered AS INTEGER)=1) AS rostered_rows,
                     COUNT(*) FILTER (WHERE CAST(is_started AS INTEGER)=1) AS started_rows
              FROM lake.public.player_fantasy
              WHERE CAST(NFL_player_id AS VARCHAR)='00-0033280'
                AND CAST(year AS INTEGER)=2025
              GROUP BY 1 ORDER BY 1
          """).fetchall()))
          print('cmc_ops_weeks=' + json.dumps(c.execute("""
              SELECT CAST(week AS INTEGER) AS week, CAST(season_type AS VARCHAR) AS season_type,
                     COUNT(*) AS source_rows
              FROM ops.nfl_historical.nfl_player_stats_all
              WHERE CAST(NFL_player_id AS VARCHAR)='00-0033280'
                AND CAST(year AS INTEGER)=2025
              GROUP BY 1,2 ORDER BY 1,2
          """).fetchall()))
          PY
