name: Seed Public Research Lake

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private release containing public-only numbered tar parts
        required: true
        default: research-public-lake-v2-20260730
      cache_key:
        description: Immutable cache key consumed by research shard jobs
        required: true
        default: research-public-lake-v3-Linux-20260730

permissions:
  actions: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download public-only lake bundle
        run: |
          gh release download "${{ inputs.release_tag }}" --repo jeleff1000/yahoo_oauth \
            --pattern 'research-public-lake.tar.part-*'
          gh release download "${{ inputs.release_tag }}" --repo jeleff1000/yahoo_oauth \
            --pattern 'ops_cache.duckdb'
          mkdir -p research_public_lake
          cat research-public-lake.tar.part-* | \
            tar -xf - -C research_public_lake
          mv ops_cache.duckdb research_public_lake/ops_cache.duckdb
      - name: Fail-closed privacy and schema validation
        run: |
          python -m pip install duckdb==1.5.1
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
      - name: Save immutable public lake cache
        uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
