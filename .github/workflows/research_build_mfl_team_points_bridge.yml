name: Build read-only MFL team-points bridge candidate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
  SOURCE_RUN_ID: '31192594062'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Capture immutable-cache prestate
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          c=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          Path('prestate.json').write_text(json.dumps({
            'schema':[r[0] for r in c.execute('DESCRIBE public.player_fantasy').fetchall()],
            'player_rows':int(c.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
          }, indent=2)+'\n')
          c.close()
          PY
      - name: Download the retained direct MFL classification artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          for shard in $(seq 0 14); do
            name="mfl-player-outcome-classification-${shard}-${SOURCE_RUN_ID}"
            mkdir -p "sources/${shard}"
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "sources/${shard}"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          entries=[]
          artifact_ids={
            0:9004815467, 1:9006118944, 2:9005761481, 3:9007476012,
            4:9007017190, 5:9007391861, 6:9007639810, 7:9006417376,
            8:9005685804, 9:9005591893, 10:9007393289, 11:9006773660,
            12:9007511852, 13:9005697100, 14:9004892405,
          }
          for path in sorted(Path('sources').rglob('mfl_outcome_classification_*.parquet')):
              shard = int(path.stem.rsplit('_', 1)[1])
              entries.append({'artifact_id': artifact_ids[shard], 'path': str(path.resolve())})
          if len(entries) != 15:
              raise SystemExit(f'expected 15 source artifacts, found {len(entries)}')
          Path('source_manifest.json').write_text(json.dumps(entries, indent=2)+'\n')
          PY
      - name: Build team-points-only null-fill candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_cohorts/build_team_points_player_bridge_null_fill.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --manifest source_manifest.json \
            --out mfl_team_points_bridge_delta.parquet \
            --report mfl_team_points_bridge_report.json
      - name: Fail fast on any cache mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          before=json.loads(Path('prestate.json').read_text())
          report=json.loads(Path('mfl_team_points_bridge_report.json').read_text())
          if report.get('cache_mutated') is not False or report.get('new_lineage') is not False or report.get('canonical_schema_unchanged') is not True:
              raise SystemExit(f'candidate mutation invariant failed: {report}')
          c=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          if [r[0] for r in c.execute('DESCRIBE public.player_fantasy').fetchall()] != before['schema']:
              raise SystemExit('player schema changed')
          if int(c.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]) != before['player_rows']:
              raise SystemExit('player row count changed')
          c.close()
          h=hashlib.sha256()
          with open('research_public_lake/ops_cache.duckdb','rb') as f:
              for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
          if h.hexdigest() != Path('ops_before.sha256').read_text().split()[0]:
              raise SystemExit('ops cache changed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mfl-team-points-bridge-candidate-${{ github.run_id }}
          path: |
            prestate.json
            ops_before.sha256
            source_manifest.json
            mfl_team_points_bridge_delta.parquet
            mfl_team_points_bridge_report.json
          retention-days: 90
          compression-level: 6
