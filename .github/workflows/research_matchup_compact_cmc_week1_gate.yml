name: Research matchup compact CMC cache gates

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read

jobs:
  cache_only_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Print cache-only cohort and active-bye contract
        run: |
          python - <<'PY'
          import duckdb, json
          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          def emit(name, sql):
              print(name + '=' + json.dumps(c.execute(sql).fetchall(), default=str))
          emit('player_fantasy_cohort_contract', """
            SELECT column_name, data_type
            FROM information_schema.columns
            WHERE table_catalog='lake' AND table_schema='public' AND table_name='player_fantasy'
              AND (column_name LIKE 'cohort\\_%' ESCAPE '\\' OR column_name IN ('position','is_rostered','is_started','win','champion','is_playoffs','made_playoffs','clutch_equity'))
            ORDER BY ordinal_position
          """)
          emit('ops_player_activity_contract', """
            SELECT column_name, data_type
            FROM information_schema.columns
            WHERE table_catalog='ops' AND table_schema='nfl_historical' AND table_name='nfl_player_stats_all'
              AND (lower(column_name) LIKE '%team%' OR lower(column_name) LIKE '%snap%' OR column_name IN ('NFL_player_id','year','week','position','season_type'))
            ORDER BY ordinal_position
          """)
          emit('ops_bye_contract', """
            SELECT table_schema, table_name, column_name, data_type
            FROM information_schema.columns
            WHERE table_catalog='ops'
              AND (lower(table_name) LIKE '%bye%' OR lower(column_name) LIKE '%bye%')
            ORDER BY table_schema, table_name, ordinal_position
          """)
          emit('ops_table_catalog', """
            SELECT table_schema, table_name
            FROM information_schema.tables
            WHERE table_catalog='ops'
            ORDER BY table_schema, table_name
          """)
          emit('lake_bye_or_schedule_contract', """
            SELECT table_schema, table_name, column_name, data_type
            FROM information_schema.columns
            WHERE table_catalog='lake'
              AND (lower(table_name) LIKE '%bye%' OR lower(table_name) LIKE '%schedule%'
                   OR lower(column_name) LIKE '%bye%')
            ORDER BY table_schema, table_name, ordinal_position
          """)
          fanout_columns = ", ".join(
              f"cohort_{dimension}_{slot}"
              for slot in range(1, 13)
              for dimension in ('teams', 'roster', 'scoring', 'pass_td', 'playoff_teams', 'dynasty', 'best_ball', 'position_eligible')
          )
          emit('cmc_week1_fanout_sample',
               "SELECT " + fanout_columns + " FROM lake.public.player_fantasy "
               "WHERE NFL_player_id='00-0033280' AND year=2025 AND week=1 LIMIT 1")
          PY
      - name: Run tested compact outer-row primitive against cache
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_weekly_outer_rows

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          materialize_weekly_outer_rows(
              c,
              source_table='lake.public.player_fantasy',
              output_table='cmc_week1_outer',
              year=2025,
              week=1,
              player_id='00-0033280',
          )
          rows = c.execute("""
            SELECT o.NFL_player_id, o.year, o.week, o.position,
              cell.cohort_key, cell.rostered_leagues, cell.started_leagues,
              cell.eligible_leagues, cell.valid_started_outcomes,
              cell.win_equivalent, cell.roster_rate_pct, cell.start_rate_pct,
              cell.win_rate_pct, cell.expected_starts, cell.expected_wins,
              cell.expected_losses, cell.clutch_weekly_average
            FROM cmc_week1_outer o, UNNEST(o.cohort_cells) AS u(cell)
          """).fetchall()
          assert len(rows) == 1, rows
          columns = [d[0] for d in c.description]
          row = dict(zip(columns, rows[0]))
          expected = {
              'NFL_player_id': '00-0033280', 'year': 2025, 'week': 1,
              'position': 'RB', 'cohort_key': 'ALL',
              'rostered_leagues': 9768, 'started_leagues': 9600,
              'eligible_leagues': 9838, 'valid_started_outcomes': 9578,
              'win_equivalent': 6019.0,
          }
          for key, value in expected.items():
              assert row[key] == value, (key, row, expected)
          floats = {
              'roster_rate_pct': 99.28847326692417,
              'start_rate_pct': 97.58080910754218,
              'win_rate_pct': 62.841929421591146,
              'expected_starts': 0.9758080910754219,
              'expected_wins': 0.6132166318837924,
          }
          for key, value in floats.items():
              assert abs(row[key] - value) < 1e-9, (key, row, floats)
          print('cmc_2025_week1_compact_outer=' + json.dumps(row, default=str))
          PY
      - name: Fail fast on all real CMC 2025 player weeks
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_weekly_outer_rows

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          raw_source_weeks = c.execute("""
            SELECT CAST(week AS INTEGER), COUNT(*)::BIGINT
            FROM lake.public.player_fantasy
            WHERE NFL_player_id='00-0033280' AND CAST(year AS INTEGER)=2025
            GROUP BY 1 ORDER BY 1
          """).fetchall()
          assert sum(count for _, count in raw_source_weeks) == 167625, raw_source_weeks
          c.execute("""
            CREATE TEMP TABLE cached_regular_player_weeks AS
            SELECT DISTINCT
              CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
              CAST(year AS INTEGER) AS year,
              CAST(week AS INTEGER) AS week
            FROM ops.nfl_historical.nfl_player_stats_all
            WHERE CAST(year AS INTEGER)=2025
              AND COALESCE(season_type, 'REG')='REG'
              AND NFL_player_id IS NOT NULL AND week IS NOT NULL
          """)
          source_weeks = c.execute("""
            SELECT week
            FROM cached_regular_player_weeks
            WHERE NFL_player_id='00-0033280'
            ORDER BY week
          """).fetchall()
          expected_weeks = list(range(1, 14)) + list(range(15, 19))
          assert [week for (week,) in source_weeks] == expected_weeks, source_weeks
          materialize_weekly_outer_rows(
              c,
              source_table='lake.public.player_fantasy',
              valid_player_weeks_table='cached_regular_player_weeks',
              output_table='cmc_2025_outer',
              year=2025,
              week=None,
              player_id='00-0033280',
          )
          outer_rows = c.execute("""
            SELECT NFL_player_id, year, week, position, array_length(cohort_cells)
            FROM cmc_2025_outer ORDER BY week
          """).fetchall()
          assert len(outer_rows) == 17, outer_rows
          assert [(row[0], row[1], row[2], row[3]) for row in outer_rows] == [
              ('00-0033280', 2025, week, 'RB') for week in expected_weeks
          ], outer_rows
          assert all(cell_count == 1 for *_, cell_count in outer_rows), outer_rows
          print('cmc_2025_compact_outer=' + json.dumps({
              'raw_source_week_counts': raw_source_weeks,
              'cached_regular_weeks': source_weeks,
              'outer_rows': outer_rows,
          }, default=str))
          PY
