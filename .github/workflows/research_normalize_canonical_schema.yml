name: Normalize canonical research schema in place

on:
  workflow_dispatch:
    inputs:
      base_cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      canonical_cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read
  actions: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Materialize one canonical player schema
        run: |
          python code/scripts/research_cohorts/normalize_canonical_research_schema.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out research_public_lake/corpus_snapshot.normalized.duckdb
          mv -f research_public_lake/corpus_snapshot.normalized.duckdb research_public_lake/corpus_snapshot.duckdb
      - name: Fail-fast canonical schema gate
        run: |
          python - <<'PY'
          import duckdb
          c=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          p={r[0] for r in c.execute('DESCRIBE public.player_fantasy').fetchall()}
          forbidden={'is_playoffs_bf','made_po_bf','made_po'} & p
          required={'is_playoffs','made_playoffs'} - p
          platform_null=c.execute("SELECT COUNT(*) FROM public.player_fantasy WHERE platform IS NULL OR TRIM(CAST(platform AS VARCHAR))=''").fetchone()[0]
          if forbidden or required or platform_null: raise SystemExit(f'bad canonical schema forbidden={forbidden} missing={required} platform_null={platform_null}')
          print({'player_columns':len(p),'player_rows':c.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0],'platform_null':platform_null})
          PY
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
      - name: Save validated canonical cache generation
        uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: ${{ inputs.canonical_cache_key }}
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-schema-manifest-${{ github.run_id }}
          path: research_public_lake/corpus_snapshot.duckdb
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
