name: Apply materialized cohort fan-out to canonical cache

on:
  workflow_dispatch:
    inputs:
      settings_audit_run_id:
        required: true
        default: '31446334849'
      confirm:
        required: true
        default: APPLY_MATERIALIZED_COHORT_FANOUT

permissions:
  contents: read
  actions: write

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

concurrency:
  group: canonical-research-cache-replacement
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ inputs.confirm == 'APPLY_MATERIALIZED_COHORT_FANOUT' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download already-promoted settings delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir settings_audit
          gh run download '${{ inputs.settings_audit_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-settings-dimension-audit-${{ inputs.settings_audit_run_id }}' \
            --dir settings_audit
          delta=$(find settings_audit -name settings_promotable_delta.parquet -print -quit)
          test -s "$delta"
          echo "SETTINGS_DELTA=$delta" >> "$GITHUB_ENV"
      - name: Record fixed-cache pre-state
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          out={
            'player_schema':[r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()],
            'player_rows':int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
            'settings_schema':[r[0] for r in con.execute('DESCRIBE public.league_settings').fetchall()],
            'settings_rows':int(con.execute('SELECT COUNT(*) FROM public.league_settings').fetchone()[0]),
          }
          Path('materialized_cohort_prestate.json').write_text(json.dumps(out, indent=2)+'\n')
          con.close()
          PY
      - name: Apply deterministic same-schema player fan-out
        run: |
          python scripts/research_cohorts/materialize_materialized_cohort_fanout.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --ops research_public_lake/ops_cache.duckdb \
            --settings-delta "$SETTINGS_DELTA" \
            --report materialized_cohort_apply_report.json
      - name: Fail fast before canonical cache replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          pre=json.loads(Path('materialized_cohort_prestate.json').read_text())
          report=json.loads(Path('materialized_cohort_apply_report.json').read_text())
          required={'working_copy_only':True,'canonical_cache_replaced':False,'new_lineage':False,
                    'schema_unchanged':True,'rows_unchanged':True,'ops_unchanged':True}
          for key, value in required.items():
              if report.get(key) != value:
                  raise SystemExit(f'fan-out invariant failed {key}={report.get(key)!r}')
          if any(int(v) != 0 for v in report['readback_remaining_mismatches'].values()):
              raise SystemExit(f'fan-out readback is not clean: {report["readback_remaining_mismatches"]}')
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          if [r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()] != pre['player_schema']:
              raise SystemExit('player schema changed')
          if int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]) != pre['player_rows']:
              raise SystemExit('player row count changed')
          if [r[0] for r in con.execute('DESCRIBE public.league_settings').fetchall()] != pre['settings_schema']:
              raise SystemExit('settings schema changed')
          if int(con.execute('SELECT COUNT(*) FROM public.league_settings').fetchone()[0]) != pre['settings_rows']:
              raise SystemExit('settings row count changed')
          con.close()
          digest=hashlib.sha256()
          with Path('research_public_lake/ops_cache.duckdb').open('rb') as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b''):
                  digest.update(block)
          digest=digest.hexdigest()
          if digest != Path('ops_before.sha256').read_text().split()[0]:
              raise SystemExit('ops cache changed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: materialized-cohort-fanout-apply-evidence-${{ github.run_id }}
          path: |
            materialized_cohort_prestate.json
            materialized_cohort_apply_report.json
            ops_before.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Replace only the existing canonical cache key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CANONICAL_CACHE_KEY}&ref=refs/heads/main" --jq '.actions_caches[].id')
          test "${#ids[@]}" -eq 1
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${ids[0]}"
      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
      - name: Assert exactly one canonical cache under the same key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CANONICAL_CACHE_KEY}&ref=refs/heads/main" --jq '.actions_caches[].id')
          test "${#ids[@]}" -eq 1
          echo "canonical_cache_key=${CANONICAL_CACHE_KEY} cache_id=${ids[0]}"
