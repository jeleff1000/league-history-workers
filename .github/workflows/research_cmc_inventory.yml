name: Research CMC Coverage Inventory

on:
  push:
    paths:
      - ".cmc_inventory_dispatch_once"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inventory CMC league coverage
        run: |
          python -m pip install duckdb==1.5.1
          python - <<'PY'
          import duckdb
          c=duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          print(c.execute("""
            SELECT CAST(week AS INTEGER) AS week,
                   COUNT(*) AS rows,
                   COUNT(DISTINCT db_name) AS leagues,
                   COUNT(DISTINCT db_name) FILTER (WHERE CAST(is_rostered AS INTEGER)=1) AS rostered_leagues,
                   COUNT(DISTINCT db_name) FILTER (WHERE CAST(is_started AS INTEGER)=1) AS started_leagues
            FROM lake.public.player_fantasy
            WHERE CAST(year AS INTEGER)=2025 AND NFL_player_id='00-0033280'
            GROUP BY 1 ORDER BY 1
          """).fetchall())
          print(c.execute("""
            SELECT COUNT(*), COUNT(DISTINCT db_name)
            FROM lake.public.player_fantasy
            WHERE CAST(year AS INTEGER)=2025 AND NFL_player_id='00-0033280'
          """).fetchone())
          PY
