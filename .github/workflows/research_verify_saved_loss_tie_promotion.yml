name: Verify saved exact loss-tie promotion

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
  PROMOTION_RUN: '31756570462'
  EXPECTED_MATCHED_ROWS: '13986'
  EXPECTED_UNIQUE_KEYS: '7955'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - name: Download exact prior-promotion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          gh run download "$PROMOTION_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "exact-loss-tie-single-promotion-evidence-$PROMOTION_RUN" --dir evidence
          test "$(find evidence -name prestate.json | wc -l)" -eq 1
          test "$(find evidence -name combined_delta.parquet | wc -l)" -eq 1
          test "$(find evidence -name apply_report.json | wc -l)" -eq 1
      - name: Independently restore and prove every promoted cell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json, os
          from pathlib import Path

          expected_rows=int(os.environ['EXPECTED_MATCHED_ROWS'])
          expected_keys=int(os.environ['EXPECTED_UNIQUE_KEYS'])
          prestate=json.loads(next(Path('evidence').rglob('prestate.json')).read_text())
          apply=json.loads(next(Path('evidence').rglob('apply_report.json')).read_text())
          expected_fields={'win':0,'loss':expected_rows,'tie':expected_rows,'team_points':0,
                           'is_playoffs':0,'champion':0,'final_playoff_seed':0,'made_playoffs':0}
          actual_fields={key:int(apply['improvements_by_field'].get(key,0)) for key in expected_fields}
          if actual_fields != expected_fields:
              raise SystemExit(json.dumps({'bad_apply_fields':actual_fields}, sort_keys=True))
          if (apply.get('schema_unchanged') is not True or apply.get('ops_untouched') is not True
                  or apply.get('new_lineage') is not False or int(apply.get('inserted_rows',-1)) != 0
                  or int(apply.get('matched_rows',-1)) != expected_rows):
              raise SystemExit(json.dumps({'bad_apply_invariant':apply}, sort_keys=True))

          delta=next(Path('evidence').rglob('combined_delta.parquet'))
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          dpath=str(delta.resolve()).replace("'", "''")
          con.execute(f"CREATE TEMP VIEW d AS SELECT * FROM read_parquet('{dpath}')")
          keys=int(con.execute('SELECT COUNT(*) FROM d').fetchone()[0])
          join='''d.db_name=p.db_name
              AND CAST(d.year AS INTEGER)=CAST(p.year AS INTEGER)
              AND CAST(d.week AS INTEGER)=CAST(p.week AS INTEGER)
              AND d.NFL_player_id IS NOT DISTINCT FROM p.NFL_player_id
              AND d.platform IS NOT DISTINCT FROM p.platform
              AND d.manager IS NOT DISTINCT FROM p.manager
              AND (p.team_key IS NULL OR d.team_key=p.team_key)
              AND (p.team_name IS NULL OR d.team_name=p.team_name)'''
          matched=int(con.execute(f'SELECT COUNT(*) FROM public.player_fantasy p JOIN d ON {join}').fetchone()[0])
          unmatched=int(con.execute(f'SELECT COUNT(*) FROM d WHERE NOT EXISTS (SELECT 1 FROM public.player_fantasy p WHERE {join})').fetchone()[0])
          loss_null=int(con.execute(f'SELECT COUNT(*) FROM public.player_fantasy p JOIN d ON {join} WHERE d.source_loss IS NOT NULL AND p.loss IS NULL').fetchone()[0])
          tie_null=int(con.execute(f'SELECT COUNT(*) FROM public.player_fantasy p JOIN d ON {join} WHERE d.source_tie IS NOT NULL AND p.tie IS NULL').fetchone()[0])
          loss_mismatch=int(con.execute(f'SELECT COUNT(*) FROM public.player_fantasy p JOIN d ON {join} WHERE d.source_loss IS NOT NULL AND p.loss IS DISTINCT FROM d.source_loss').fetchone()[0])
          tie_mismatch=int(con.execute(f'SELECT COUNT(*) FROM public.player_fantasy p JOIN d ON {join} WHERE d.source_tie IS NOT NULL AND p.tie IS DISTINCT FROM d.source_tie').fetchone()[0])
          schema=[r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()]
          rows=int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0])
          con.close()
          digest=hashlib.sha256()
          with Path('research_public_lake/ops_cache.duckdb').open('rb') as handle:
              for block in iter(lambda:handle.read(1024*1024),b''):
                  digest.update(block)
          receipt={
              'promotion_run':os.environ['PROMOTION_RUN'],
              'candidate_unique_keys':keys,
              'matched_player_rows':matched,
              'unmatched_candidate_keys':unmatched,
              'loss_remaining_null_source_cells':loss_null,
              'tie_remaining_null_source_cells':tie_null,
              'loss_source_value_mismatches':loss_mismatch,
              'tie_source_value_mismatches':tie_mismatch,
              'schema_unchanged':schema == prestate['schema'],
              'player_rows_unchanged':rows == prestate['player_rows'],
              'ops_unchanged':digest.hexdigest() == next(Path('evidence').rglob('ops_before.sha256')).read_text().split()[0],
              'fresh_restore':True,
              'new_lineage':False,
          }
          if not (keys == expected_keys and matched == expected_rows and unmatched == 0
                  and loss_null == 0 and tie_null == 0 and loss_mismatch == 0 and tie_mismatch == 0
                  and receipt['schema_unchanged'] and receipt['player_rows_unchanged'] and receipt['ops_unchanged']):
              raise SystemExit(json.dumps(receipt, sort_keys=True))
          Path('saved_loss_tie_promotion_readback.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Verify exactly one approved cache object remains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=$CANONICAL_CACHE_KEY&ref=refs/heads/main" --jq '.actions_caches[].id')
          test "${#ids[@]}" -eq 1
          printf '%s\n' "${ids[0]}" > canonical_cache_id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: saved-loss-tie-promotion-readback-${{ github.run_id }}
          path: |
            saved_loss_tie_promotion_readback.json
            canonical_cache_id.txt
          retention-days: 90
