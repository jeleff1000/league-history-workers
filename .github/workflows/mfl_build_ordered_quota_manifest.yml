name: MFL Build ordered quota manifest

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  MFL_CHUNK_KEY: mfl-registered-2004-2018-v2-chunk-recover-mass-remaining-v31-r9-20260816-1
  REGISTRY_PATH: code/derived/mfl_register/mfl_register_all_runs.json

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout registry source
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /derived/mfl_register/mfl_register_all_runs.json

      - name: Restore live MFL cache read-only
        uses: actions/cache/restore@v5
        with:
          path: live_cache
          key: ${{ env.MFL_CHUNK_KEY }}
          restore-keys: |
            mfl-registered-2004-2018-v2-chunk-recover-mass-remaining-v31-r9-20260816-
          fail-on-cache-miss: false

      - name: Require restored live cache
        run: |
          set -euo pipefail
          find live_cache -type f -maxdepth 4 -print
          test -n "$(find live_cache -type f -name '*.duckdb' -print -quit)"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: python -m pip install duckdb==1.5.1

      - name: Validate live IDs and build ordered manifest
        env:
          REGISTRY_PATH: ${{ env.REGISTRY_PATH }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          import duckdb

          registry_path = Path(os.environ["REGISTRY_PATH"])
          registry = json.loads(registry_path.read_text(encoding="utf-8"))

          discovered = defaultdict(set)
          for row in registry["observations"]:
              year = int(row["season"])
              if 2000 <= year <= 2018:
                  discovered[year].add(str(row["league_id"]).zfill(5))

          db_path = next(Path("live_cache").rglob("*.duckdb"), None)
          if db_path is None:
              raise SystemExit("live cache did not contain a DuckDB file")

          con = duckdb.connect(str(db_path), read_only=True)
          tables = [r[0] for r in con.execute("SHOW TABLES").fetchall()]
          candidates = []
          for table in tables:
              cols = {r[1] for r in con.execute(f'PRAGMA table_info("{table}")').fetchall()}
              if {"db_name", "year"}.issubset(cols):
                  candidates.append(table)
          if not candidates:
              raise SystemExit(f"live cache has no table with db_name/year; tables={tables}")
          table = "league_settings" if "league_settings" in candidates else candidates[0]
          live = defaultdict(set)
          for year, db_name in con.execute(
              f'SELECT DISTINCT CAST(year AS INTEGER), CAST(db_name AS VARCHAR) FROM "{table}" WHERE year BETWEEN 2000 AND 2018'
          ).fetchall():
              live[int(year)].add(str(db_name).zfill(5))
          con.close()

          fetched = {2000: 0, 2001: 0, 2002: 0, 2003: 0, 2004: 4780, 2005: 935,
                     2006: 7719, 2007: 2136, 2008: 2195, 2009: 2133, 2010: 2155,
                     2011: 2170, 2012: 1801, 2013: 1288, 2014: 865, 2015: 836,
                     2016: 9114, 2017: 468, 2018: 773}

          # The supplied 2000 total is the intentional first-stage floor.
          stage_targets = [
              (1, 2000, 2000, list(range(2000, 2019))),
              (2, 5000, 5000, list(range(2002, 2019))),
              (3, 10000, 10000, list(range(2003, 2019))),
          ]
          current = {year: len(live[year]) for year in range(2000, 2019)}
          # Preserve the known fetched scoreboard where the protected cache does
          # not cover 2000-2003; the live cache remains authoritative whenever it
          # has rows for a year.
          for year in range(2000, 2019):
              if current[year] == 0:
                  current[year] = fetched[year]

          rows = []
          used = defaultdict(set)
          for stage, target, _, years in stage_targets:
              for year in years:
                  already = current[year] + len(used[year])
                  need = max(0, target - already)
                  available = sorted(discovered[year] - live[year] - used[year], key=lambda x: (int(x), x))
                  selected = available[:need]
                  used[year].update(selected)
                  for ordinal, league_id in enumerate(selected, 1):
                      rows.append({
                          "stage": stage,
                          "target_per_year": target,
                          "year_order": year,
                          "year_ordinal": ordinal,
                          "season": year,
                          "league_id": league_id,
                          "source": "registry_minus_live_cache",
                      })

          out = Path("mfl_ordered_quota_manifest.csv")
          with out.open("w", newline="", encoding="utf-8") as fh:
              writer = csv.DictWriter(fh, fieldnames=list(rows[0]) if rows else ["stage", "target_per_year", "year_order", "year_ordinal", "season", "league_id", "source"])
              writer.writeheader()
              writer.writerows(rows)

          scoreboard = []
          for year in range(2000, 2019):
              scoreboard.append({
                  "year": year,
                  "live_cache_ids": len(live[year]),
                  "effective_current": current[year],
                  "registry_discovered_ids": len(discovered[year]),
                  "stage1_needed": max(0, 2000 - current[year]),
                  "stage2_needed_after_stage1": max(0, 5000 - max(current[year], 2000)),
                  "stage3_needed_after_stage2": max(0, 10000 - max(current[year], 5000)),
              })
          Path("mfl_quota_validation.json").write_text(json.dumps({
              "live_cache_key": os.environ["MFL_CHUNK_KEY"],
              "live_table_used": table,
              "discovered_registry": str(registry_path),
              "rows_in_manifest": len(rows),
              "scoreboard": scoreboard,
          }, indent=2) + "\n", encoding="utf-8")
          print(f"live table: {table}")
          print(f"manifest rows: {len(rows)}")
          for item in scoreboard:
              print(item)
          PY

      - name: Upload validated manifest
        uses: actions/upload-artifact@v4
        with:
          name: mfl-ordered-quota-manifest-${{ github.run_id }}
          retention-days: 180
          path: |
            mfl_ordered_quota_manifest.csv
            mfl_quota_validation.json
