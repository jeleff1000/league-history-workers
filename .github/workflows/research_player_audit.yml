name: Research player row audit

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical
      player:
        required: true
        default: Jeff Wilkins
      year:
        required: true
        default: "2003"
      nfl_id:
        required: true
        default: "00-0017693"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pandas==2.2.3
      - name: Query research lake
        env:
          PLAYER: ${{ inputs.player }}
          YEAR: ${{ inputs.year }}
          NFL_ID: ${{ inputs.nfl_id }}
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          import duckdb
          con = duckdb.connect()
          con.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          status_counts = con.execute("SELECT is_rostered, COUNT(*) AS rows FROM lake.public.player_fantasy GROUP BY is_rostered ORDER BY is_rostered").fetchall()
          print('global_is_rostered_counts=', status_counts)
          explicit_zero_columns = [r[0] for r in con.execute('DESCRIBE lake.public.player_fantasy').fetchall()]
          explicit_zero_query = 'SELECT * FROM lake.public.player_fantasy WHERE is_rostered = 0 LIMIT 5'
          explicit_zero_rows = con.execute(explicit_zero_query).fetchall()
          print('global_explicit_zero_sample_count=', len(explicit_zero_rows))
          for values in explicit_zero_rows:
              print('global_explicit_zero', {k: v for k, v in zip(explicit_zero_columns, values) if v is not None})
          available = {r[0] for r in con.execute("DESCRIBE lake.public.player_fantasy").fetchall()}
          wanted = ['db_name','league_id','year','week','player','NFL_player_id','platform','manager','manager_guid','franchise_id','team_key','team_name','opponent','fantasy_position','is_started','is_rostered','is_bye_week','win','loss','tie','team_points','opponent_points','margin','fantasy_points','clutch_equity','is_playoffs','is_playoffs_bf','has_po_signal','is_championship','championship','champion','playoff_round','playoff_seed','final_playoff_seed','team_made_playoffs']
          selected = [c for c in wanted if c in available]
          q = 'SELECT ' + ', '.join('"'+c+'"' for c in selected) + ' FROM lake.public.player_fantasy WHERE year = ? AND (lower(player) = lower(?) OR NFL_player_id = ?) ORDER BY db_name, week, manager'
          rows = con.execute(q, [int(os.environ['YEAR']), os.environ['PLAYER'], os.environ['NFL_ID']]).fetchdf().to_dict('records')
          for label, subset in (
              ('null_roster', [r for r in rows if r.get('is_rostered') is None]),
              ('zero_roster', [r for r in rows if r.get('is_rostered') == 0]),
          ):
              print(label, 'sample_count=', len(subset[:5]))
              for row in subset[:5]:
                  print(label, {k: v for k, v in row.items() if v is not None})
          # Literal SELECT * on a few null-status rows, to detect whether the
          # flag is missing while the rest of the team/league record survives.
          all_columns = [r[0] for r in con.execute('DESCRIBE lake.public.player_fantasy').fetchall()]
          null_query = 'SELECT * FROM lake.public.player_fantasy WHERE year = ? AND (lower(player) = lower(?) OR NFL_player_id = ?) AND is_rostered IS NULL ORDER BY db_name, week, manager LIMIT 5'
          null_rows = con.execute(null_query, [int(os.environ['YEAR']), os.environ['PLAYER'], os.environ['NFL_ID']]).fetchall()
          print('literal_select_star_null_count=', len(null_rows))
          for values in null_rows:
              print('literal_select_star_null', {k: v for k, v in zip(all_columns, values) if v is not None})
          started = [r for r in rows if int(r.get('is_started') or 0) == 1]
          def truthy(value):
              return str(value).lower() in {'1', '1.0', 'true', 't', 'yes', 'starter'}
          playoff_started = [r for r in started if truthy(r.get('is_playoffs')) or truthy(r.get('is_playoffs_bf'))]
          def clutch_value(row):
              try:
                  value = float(row.get('clutch_equity'))
              except (TypeError, ValueError):
                  return None
              return value if math.isfinite(value) else None
          clutch_values = [value for r in rows if (value := clutch_value(r)) is not None]
          clutch_started = [value for r in started if (value := clutch_value(r)) is not None]
          clutch_playoff_started = [value for r in playoff_started if (value := clutch_value(r)) is not None]
          result = {'player': os.environ['PLAYER'], 'year': int(os.environ['YEAR']), 'rows': rows,
                    'row_count': len(rows), 'started_row_count': len(started),
                    'started_leagues': len({r.get('db_name') for r in started}),
                    'playoff_starts': len(playoff_started),
                    'championship_starts': sum(int(r.get('is_championship') or r.get('championship') or 0) == 1 for r in started),
                    'championship_signal_leagues': len({r.get('db_name') for r in rows if any(r.get(c) is not None for c in ('is_championship','championship','champion'))}),
                    'clutch_nonnull_rows': len(clutch_values),
                    'clutch_nonnull_started_rows': len(clutch_started),
                    'clutch_sum_all_rows': sum(clutch_values),
                    'clutch_sum_started': sum(clutch_started),
                    'clutch_sum_playoff_started': sum(clutch_playoff_started)}
          Path('research_player_audit.json').write_text(json.dumps(result, indent=2, default=str))
          print(json.dumps({k:v for k,v in result.items() if k != 'rows'}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-player-audit-${{ github.run_id }}
          path: research_player_audit.json
          if-no-files-found: error
