name: Research Matchup Direct Cache Release to Fly

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable GitHub cache key for the public research lake
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      publish:
        description: Apply the verified adaptive bundle to Fly production
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1 requests
      - name: Inspect cached CMC availability inputs
        run: |
          python - <<'PY'
          import duckdb
          c=duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          cols={r[0] for r in c.execute("DESCRIBE ops.nfl_historical.nfl_player_stats_all").fetchall()}
          selected=[x for x in ('week','season_type','player_week','fpts_4pt_half','fantasy_points','game_date') if x in cols]
          print('cached_stats_columns=', selected)
          qcols=','.join('"'+x+'"' for x in selected)
          print(c.execute(f"SELECT {qcols} FROM ops.nfl_historical.nfl_player_stats_all WHERE NFL_player_id='00-0033280' AND year=2025 ORDER BY week,player_week").fetchall())
          pcols={r[0] for r in c.execute("DESCRIBE lake.public.player_fantasy").fetchall()}
          selected=[x for x in ('week','is_rostered','is_started','position','fantasy_points','season_games') if x in pcols]
          print('cached_player_columns=', selected)
          qcols=','.join('"'+x+'"' for x in selected)
          print(c.execute(f"SELECT {qcols} FROM lake.public.player_fantasy WHERE NFL_player_id='00-0033280' AND year=2025 ORDER BY week LIMIT 30").fetchall())
          print('cached_cmc_week1_target_counts=', c.execute("""
            WITH target AS (
              SELECT DISTINCT db_name, CAST(year AS INTEGER) AS year
              FROM lake.public.league_settings
              WHERE year=2025 AND num_teams > 11
                AND COALESCE(roster_IDP,0)+COALESCE(roster_DL,0)+COALESCE(roster_LB,0)
                    +COALESCE(roster_DB,0)+COALESCE(roster_DB_LB,0)+COALESCE(roster_DL_LB,0)=0
                AND COALESCE(roster_SUPER_FLEX,0)=0
                AND scoring_rec > 0 AND scoring_rec < 0.75
                AND COALESCE(scoring_pass_td,4) < 5
                AND playoff_teams BETWEEN 6 AND 7
            )
            SELECT COUNT(DISTINCT t.db_name) AS eligible_leagues,
                   COUNT(DISTINCT p.db_name) AS rows_present,
                   COUNT(DISTINCT p.db_name) FILTER (WHERE CAST(p.is_rostered AS INTEGER)=1) AS rostered_leagues,
                   COUNT(DISTINCT p.db_name) FILTER (WHERE CAST(p.is_started AS INTEGER)=1) AS started_leagues,
                   COUNT(*) FILTER (WHERE CAST(p.is_rostered AS INTEGER)=0) AS unrostered_rows
            FROM target t
            LEFT JOIN lake.public.player_fantasy p
              ON p.db_name=t.db_name AND p.year=t.year AND p.week=1 AND p.NFL_player_id='00-0033280'
          """).fetchall())
          PY
      - name: Build the complete adaptive matchup lattice from cache
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/build_direct_matchup_cache.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --ops-cache research_public_lake/ops_cache.duckdb \
            --output out/research_matchup_adaptive.duckdb
      - name: Validate adaptive output contract
        run: |
          python - <<'PY'
          import duckdb
          c=duckdb.connect('out/research_matchup_adaptive.duckdb', read_only=True)
          required={'research_matchup_adaptive','research_matchup_adaptive_weekly','research_matchup_adaptive_career'}
          got={r[0] for r in c.execute("select table_name from information_schema.tables where table_schema='main'").fetchall()}
          assert required <= got, sorted(required-got)
          for t in sorted(required):
              n=c.execute(f'select count(*) from "{t}"').fetchone()[0]
              assert n > 0, (t,n)
              cols={r[0] for r in c.execute(f'describe "{t}"').fetchall()}
              assert {'NFL_player_id','q_teams','q_roster','q_ppr','q_td','q_bracket','q_league_type','q_lineup_mode','n_leagues'} <= cols
              print(t,n,len(cols))
          dims=c.execute("select count(*) from research_matchup_adaptive where q_teams='12t' and q_roster='flx' and q_ppr='half' and q_td='4pt' and q_bracket in ('4po','6po','8po') and q_league_type in ('ALL','dynasty') and q_lineup_mode in ('ALL','best_ball')").fetchone()[0]
          assert dims > 0, dims
          print('PASS: config, bracket, dynasty, and bestball request lanes are populated')
          PY
      - name: Read-only Fly preflight for adaptive tables
        run: |
          python code/scripts/research_cohorts/publish_research_matchup_to_fly.py \
            --bundle out/research_matchup_adaptive.duckdb --adaptive-only --slug 12t_flx_half_4pt
      - name: Publish adaptive tables to Fly
        if: ${{ inputs.publish }}
        run: |
          python code/scripts/research_cohorts/publish_research_matchup_to_fly.py \
            --bundle out/research_matchup_adaptive.duckdb --adaptive-only \
            --slug 12t_flx_half_4pt --apply --i-understand-this-writes-prod
      - uses: actions/upload-artifact@v4
        with:
          name: research-matchup-direct-cache-${{ github.run_id }}
          path: out/research_matchup_adaptive.duckdb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
