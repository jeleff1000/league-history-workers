name: Research matchup five RB week 1 leaf timing

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Week 1 only or all 2025 regular-season weeks
        required: true
        default: week1
        type: choice
        options:
          - week1
          - full_2025

permissions:
  contents: read

jobs:
  leaf_timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Run one read-only five-RB week 1 leaf query
        env:
          PILOT_SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY'
          import duckdb
          import json
          import os
          from time import perf_counter

          con = duckdb.connect()
          con.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          scope = os.environ["PILOT_SCOPE"]
          if scope not in {"week1", "full_2025"}:
              raise ValueError(scope)
          week_predicate = "AND week=1" if scope == "week1" else ""
          query = f"""
          WITH targets(NFL_player_id, player_name) AS (
            VALUES
              ('00-0033280', 'Christian McCaffrey'),
              ('00-0038542', 'Bijan Robinson'),
              ('00-0039139', 'Jahmyr Gibbs'),
              ('00-0032764', 'Derrick Henry'),
              ('00-0037248', 'James Cook')
          ), active_target_weeks AS (
            SELECT DISTINCT a.NFL_player_id, a.year, a.week
            FROM lake.public.player_active_week a
            INNER JOIN targets t USING (NFL_player_id)
            WHERE a.year=2025 AND a.week BETWEEN 1 AND 18
          ), rb AS (
            SELECT db_name, NFL_player_id, week,
              cohort_teams, cohort_roster, cohort_scoring, cohort_pass_td,
              cohort_playoff_teams, cohort_dynasty, cohort_best_ball,
              cohort_position_eligible,
              is_rostered, is_started, win,
              manager, team_key, team_name, team_points, fantasy_points
            FROM lake.public.player_fantasy
            WHERE year=2025 AND week BETWEEN 1 AND 18 {week_predicate} AND position='RB'
          ), inventory AS (
            SELECT week, cohort_teams, cohort_roster, cohort_scoring, cohort_pass_td,
              cohort_playoff_teams, cohort_dynasty, cohort_best_ball,
              COUNT(DISTINCT db_name)::BIGINT AS eligible_leagues
            FROM rb WHERE cohort_position_eligible=1 GROUP BY ALL
          ), player_per_league AS (
            SELECT r.NFL_player_id, r.week, r.db_name,
              r.cohort_teams, r.cohort_roster, r.cohort_scoring, r.cohort_pass_td,
              r.cohort_playoff_teams, r.cohort_dynasty, r.cohort_best_ball,
              MAX(CASE WHEN COALESCE(r.is_rostered,1)<>0 THEN 1 ELSE 0 END) AS rostered,
              MAX(CASE WHEN r.is_started=1 THEN 1 ELSE 0 END) AS started,
              MAX(CASE WHEN r.is_started=1 AND r.win IN (0,1) THEN 1 ELSE 0 END) AS valid_outcome,
              MAX(CASE WHEN r.is_started=1 AND r.win IN (0,1) THEN r.win ELSE NULL END) AS win_value
            FROM rb r
            INNER JOIN targets t USING (NFL_player_id)
            INNER JOIN active_target_weeks a
              ON a.NFL_player_id=r.NFL_player_id AND a.year=2025 AND a.week=r.week
            WHERE NOT (
              r.is_rostered=1 AND COALESCE(r.is_started,0)=0
              AND NULLIF(TRIM(COALESCE(r.manager,'')),'') IS NULL
              AND NULLIF(TRIM(COALESCE(r.team_key,'')),'') IS NULL
              AND NULLIF(TRIM(COALESCE(r.team_name,'')),'') IS NULL
              AND r.team_points IS NULL
              AND (r.fantasy_points IS NULL OR r.fantasy_points=0)
            )
            GROUP BY ALL
          ), player_leaf AS (
            SELECT NFL_player_id, week,
              cohort_teams, cohort_roster, cohort_scoring, cohort_pass_td,
              cohort_playoff_teams, cohort_dynasty, cohort_best_ball,
              SUM(rostered)::BIGINT AS rostered_leagues,
              SUM(started)::BIGINT AS started_leagues,
              SUM(valid_outcome)::BIGINT AS valid_started_outcomes,
              SUM(win_value) AS win_equivalent
            FROM player_per_league GROUP BY ALL
          )
          SELECT t.player_name, t.NFL_player_id, i.week,
            COUNT(*)::BIGINT AS exact_leaf_cells,
            SUM(i.eligible_leagues)::BIGINT AS eligible_leagues,
            SUM(COALESCE(p.rostered_leagues,0))::BIGINT AS rostered_leagues,
            SUM(COALESCE(p.started_leagues,0))::BIGINT AS started_leagues,
            SUM(COALESCE(p.valid_started_outcomes,0))::BIGINT AS valid_started_outcomes,
            SUM(COALESCE(p.win_equivalent,0)) AS win_equivalent
          FROM targets t
          INNER JOIN active_target_weeks a USING (NFL_player_id)
          INNER JOIN inventory i ON i.week=a.week
          LEFT JOIN player_leaf p
            ON p.NFL_player_id=t.NFL_player_id
           AND p.week=i.week
           AND p.cohort_teams IS NOT DISTINCT FROM i.cohort_teams
           AND p.cohort_roster IS NOT DISTINCT FROM i.cohort_roster
           AND p.cohort_scoring IS NOT DISTINCT FROM i.cohort_scoring
           AND p.cohort_pass_td IS NOT DISTINCT FROM i.cohort_pass_td
           AND p.cohort_playoff_teams IS NOT DISTINCT FROM i.cohort_playoff_teams
           AND p.cohort_dynasty IS NOT DISTINCT FROM i.cohort_dynasty
           AND p.cohort_best_ball IS NOT DISTINCT FROM i.cohort_best_ball
          GROUP BY 1, 2, 3 ORDER BY 1, 3
          """
          started = perf_counter()
          rows = con.execute(query).fetchall()
          elapsed = perf_counter() - started
          assert len(rows) == 5 if scope == "week1" else len(rows) >= 80, rows
          assert all(row[4] > 0 and row[5] > 0 for row in rows), rows
          cmc_rows = [row for row in rows if row[1] == "00-0033280"]
          assert len(cmc_rows) == 1 if scope == "week1" else len(cmc_rows) == 17, cmc_rows
          assert cmc_rows[0][4] > 9000 and cmc_rows[0][5] > 9000, cmc_rows
          players = {}
          for row in rows:
              player = players.setdefault(row[0], {"id": row[1], "weekly_rows": 0, "eligible": 0, "rostered": 0, "started": 0, "valid_outcomes": 0, "win_equivalent": 0})
              player["weekly_rows"] += 1
              player["eligible"] += row[4]
              player["rostered"] += row[5]
              player["started"] += row[6]
              player["valid_outcomes"] += row[7]
              player["win_equivalent"] += row[8]
          receipt = {
            "operation": "one_read_only_five_rb_2025_leaf_query",
            "scope": scope,
            "cpu_count": os.cpu_count(),
            "players": players,
            "elapsed_seconds": round(elapsed, 3),
          }
          print(json.dumps(receipt, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("## Five RB week 1 leaf timing\n")
            summary.write(f"- Receipt: `{json.dumps(receipt, sort_keys=True)}`\n")
            summary.write("- Read-only cache restore; no cache save, Fly access, artifact, or publish step.\n")
          PY
