name: Probe Championship Identity Join

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-clutch-championship-v11
      db_name:
        required: true
      year:
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3
      - name: Extract identity rows
        env:
          DB_NAME: ${{ inputs.db_name }}
          YEAR: ${{ inputs.year }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import duckdb
          con=duckdb.connect()
          con.execute("attach 'research_public_lake/corpus_snapshot.duckdb' as lake (read_only)")
          db=os.environ['DB_NAME']; year=int(os.environ['YEAR'])
          p=con.execute('''select week, manager, team_key, team_name, is_rostered, champion,
                                  count(*) as player_rows
                             from lake.public.player_fantasy
                            where db_name=? and cast(year as integer)=? and cast(champion as integer)=1
                            group by all order by week, manager, team_key''',[db,year]).fetchdf()
          m=con.execute('''select week, manager, team_key, team_name, opponent, opponent_team_key,
                                  matchup_key, is_playoffs, is_consolation, champion, is_championship
                             from lake.public.matchup
                            where db_name=? and cast(year as integer)=?
                            order by week, manager, team_key''',[db,year]).fetchdf()
          out={'db_name':db,'year':year,'player_champion_rows':p.to_dict('records'),'matchup_rows':m.to_dict('records')}
          Path('championship_identity_probe.json').write_text(json.dumps(out,default=str,indent=2))
          print(json.dumps({'player_rows':len(p),'matchup_rows':len(m)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-championship-identity-probe-${{ github.run_id }}
          path: championship_identity_probe.json
          if-no-files-found: error
          retention-days: 7
