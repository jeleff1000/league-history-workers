name: Audit every research matchup artifact from one manifest

on:
  workflow_dispatch:
    inputs:
      since:
        description: UTC timestamp; inspect research artifacts created at or after this time
        required: true
        default: '2026-07-30T00:00:00Z'
      shard_count:
        description: Number of read-only artifact inspectors
        required: true
        default: '256'

permissions:
  actions: read
  contents: read

env:
  GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
  SINCE: ${{ inputs.since }}
  SHARD_COUNT: ${{ inputs.shard_count }}

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      manifest_artifact: ${{ steps.manifest.outputs.name }}
      manifest_count: ${{ steps.manifest.outputs.count }}
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          since = os.environ['SINCE']
          items = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  payload = json.load(response)
              batch = payload.get('artifacts', [])
              for item in batch:
                  if item['created_at'] >= since and not item['expired']:
                      items.append({
                          'artifact_id': item['id'],
                          'artifact': item['name'],
                          'created_at': item['created_at'],
                          'size_in_bytes': item['size_in_bytes'],
                          'archive_download_url': item['archive_download_url'],
                          'workflow_run_id': (item.get('workflow_run') or {}).get('id'),
                      })
              if len(batch) < 100:
                  break
              page += 1
          items.sort(key=lambda x: (x['created_at'], x['artifact_id']))
          before_dedupe = len(items)
          deduped = {}
          for item in items:
              deduped.setdefault(item['artifact_id'], item)
          items = sorted(deduped.values(), key=lambda x: (x['created_at'], x['artifact_id']))
          duplicate_count = before_dedupe - len(items)
          Path('out/artifact_manifest.json').write_text(json.dumps({
              'repo': '${{ github.repository }}',
              'since': since,
              'shard_count': int(os.environ['SHARD_COUNT']),
              'artifact_count': len(items),
              'duplicate_artifact_entries_removed': duplicate_count,
              'artifacts': items,
          }, indent=2, sort_keys=True) + '\n')
          print(f'manifest artifacts={len(items)} bytes={sum(x["size_in_bytes"] for x in items)}')
          print(f"name=research-artifact-manifest-${{ github.run_id }}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"name=research-artifact-manifest-${{ github.run_id }}\n")
              out.write(f"count={len(items)}\n")
              out.write(f"matrix={json.dumps(list(range(int(os.environ['SHARD_COUNT']))), separators=(',', ':'))}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-artifact-manifest-${{ github.run_id }}
          path: out/artifact_manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  aggregate:
    needs: [manifest, inspect]
    if: ${{ always() && needs.manifest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: research-artifact-audit-${{ github.run_id }}-*
          path: audit_parts
          merge-multiple: true
      - name: Consolidate and validate complete artifact audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          parts = [json.loads(path.read_text()) for path in sorted(Path('audit_parts').glob('artifact_audit.json'))]
          manifest_count = parts[0]['manifest_artifacts'] if parts else 0
          records = [record for part in parts for record in part['results']]
          ids = [record['artifact_id'] for record in records]
          errors = [record for record in records if record.get('status') != 'inspected']
          duplicate_ids = sorted({artifact_id for artifact_id in ids if ids.count(artifact_id) > 1})
          report = {
              'manifest_artifacts': manifest_count,
              'inspected_records': len(records),
              'inspection_errors': len(errors),
              'duplicate_artifact_ids': duplicate_ids,
              'complete': len(records) == manifest_count and not errors and not duplicate_ids,
              'records': sorted(records, key=lambda record: (record['artifact_id'], record.get('artifact', ''))),
          }
          Path('artifact_audit_complete.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\\n')
          with Path('artifact_checklist.csv').open('w', newline='', encoding='utf-8') as handle:
              fields = ['artifact_id','artifact','workflow_run_id','created_at','artifact_status','file','file_type','kind','rows','column_count','columns','missing_canonical','forbidden_columns']
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for record in report['records']:
                  files = record.get('files') or [{}]
                  for file_record in files:
                      writer.writerow({
                          'artifact_id': record.get('artifact_id'),
                          'artifact': record.get('artifact'),
                          'workflow_run_id': record.get('workflow_run_id'),
                          'created_at': record.get('created_at'),
                          'artifact_status': record.get('status'),
                          'file': file_record.get('file'),
                          'file_type': file_record.get('type'),
                          'kind': file_record.get('kind'),
                          'rows': file_record.get('rows'),
                          'column_count': file_record.get('column_count'),
                          'columns': json.dumps(file_record.get('columns', []), separators=(',', ':')),
                          'missing_canonical': json.dumps(file_record.get('missing_canonical', []), separators=(',', ':')),
                          'forbidden_columns': json.dumps(file_record.get('forbidden_columns', []), separators=(',', ':')),
                      })
          print(json.dumps({k: report[k] for k in ('manifest_artifacts','inspected_records','inspection_errors','complete')}))
          if not report['complete']:
              raise SystemExit('complete artifact audit failed: every artifact was not successfully inspected')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-artifact-audit-complete-${{ github.run_id }}
          path: |
            artifact_audit_complete.json
            artifact_checklist.csv
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  inspect:
    needs: manifest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard_index: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded inspection dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-manifest-${{ github.run_id }}
          path: manifest
      - name: Download and inspect assigned artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import csv, hashlib, json, os, shutil, tempfile, urllib.error, urllib.request, zipfile
          from pathlib import Path
          import duckdb

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          api_opener = urllib.request.build_opener(NoRedirect)

          manifest = json.loads(Path('manifest/artifact_manifest.json').read_text())
          shard = int('${{ matrix.shard_index }}')
          count = int(manifest['shard_count'])
          canonical = [
              'db_name','year','week','NFL_player_id','is_started','is_rostered',
              'fantasy_points','win','champion','clutch_equity','manager_lamar',
              'manager','team_points','final_playoff_seed','is_playoffs',
              'has_po_signal','player','position','fantasy_position','platform',
              'team_key','team_name','nfl_team_api','yahoo_player_id',
              'sleeper_player_id','espn_player_id','fleaflicker_player_id',
              'mfl_player_id','made_playoffs',
          ]
          forbidden = {'loss','tie','opponent_points','is_championship','is_active','is_playoffs_bf','made_po_bf'}
          selected = [a for a in manifest['artifacts'] if int(a['artifact_id']) % count == shard]
          root = Path('work'); root.mkdir(exist_ok=True)
          results = []
          failures = []
          for item in selected:
              rec = {k: item.get(k) for k in ('artifact_id','artifact','created_at','size_in_bytes','workflow_run_id')}
              rec['shard_index'] = shard
              try:
                  with tempfile.NamedTemporaryFile(prefix='artifact-', suffix='.zip', delete=False) as fh:
                      zip_path = Path(fh.name)
                  request = urllib.request.Request(
                      item['archive_download_url'],
                      headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
                  )
                  try:
                      # The API redirects to Azure Blob Storage. Do not forward
                      # the GitHub bearer token to the blob host.
                      try:
                          response = api_opener.open(request, timeout=120)
                      except urllib.error.HTTPError as exc:
                          if exc.code not in (301, 302, 303, 307, 308):
                              raise
                          location = exc.headers.get('Location')
                          if not location:
                              raise RuntimeError('artifact API redirect did not include Location') from exc
                          response = urllib.request.urlopen(urllib.request.Request(location), timeout=120)
                      sha = hashlib.sha256()
                      size = 0
                      with response, zip_path.open('wb') as out_zip:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              out_zip.write(chunk)
                              sha.update(chunk)
                              size += len(chunk)
                      rec['download_bytes'] = size
                      rec['download_sha256'] = sha.hexdigest()
                  finally:
                      pass
                  target = root / str(item['artifact_id'])
                  target.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(zip_path) as archive:
                      for member in archive.infolist():
                          destination = (target / member.filename).resolve()
                          if target.resolve() not in destination.parents:
                              raise RuntimeError(f'unsafe archive member: {member.filename}')
                      archive.extractall(target)
                  files = []
                  con = duckdb.connect()
                  for path in sorted(target.rglob('*')):
                      if not path.is_file():
                          continue
                      suffix = path.suffix.lower()
                      if suffix == '.parquet':
                          cols = [r[0] for r in con.execute('DESCRIBE SELECT * FROM read_parquet(?)', [str(path)]).fetchall()]
                          row_count = con.execute('SELECT COUNT(*) FROM read_parquet(?)', [str(path)]).fetchone()[0]
                          kind = 'exact_canonical_player' if cols == canonical else ('source_team_or_matchup' if {'db_name','year','week','team_key'} <= set(cols) else 'other_parquet')
                          files.append({'file': path.name, 'type': 'parquet', 'rows': row_count, 'columns': cols, 'column_count': len(cols), 'kind': kind, 'missing_canonical': sorted(set(canonical)-set(cols)), 'forbidden_columns': sorted(set(cols)&forbidden)})
                      else:
                          files.append({'file': path.name, 'type': suffix.lstrip('.') or 'no_extension', 'bytes': path.stat().st_size, 'kind': 'non_parquet'})
                  con.close()
                  rec['files'] = files
                  rec['status'] = 'inspected'
              except Exception as exc:
                  rec['status'] = 'inspection_error'
                  rec['error'] = f'{type(exc).__name__}: {exc}'
                  failures.append(rec)
              finally:
                  zip_path.unlink(missing_ok=True)
                  shutil.rmtree(root / str(item['artifact_id']), ignore_errors=True)
              results.append(rec)
          Path('out/artifact_audit.json').write_text(json.dumps({'manifest_artifacts':len(manifest['artifacts']), 'shard_index':shard, 'shard_count':count, 'selected_artifacts':len(selected), 'results':results, 'failures':failures}, indent=2, sort_keys=True)+'\n')
          with open('out/artifact_audit.csv','w',newline='',encoding='utf-8') as fh:
              fields=['artifact_id','artifact','created_at','size_in_bytes','download_bytes','status','error']
              writer=csv.DictWriter(fh, fieldnames=fields); writer.writeheader()
              for rec in results: writer.writerow({k:rec.get(k,'') for k in fields})
          for failure in failures[:25]:
              print(f"artifact_failure id={failure.get('artifact_id')} name={failure.get('artifact')} error={failure.get('error')}", flush=True)
          print(f'inspected={len(results)-len(failures)} errors={len(failures)} artifacts on shard {shard}/{count}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-artifact-audit-${{ github.run_id }}-${{ matrix.shard_index }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
