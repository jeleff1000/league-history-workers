name: Promote exact team-to-player null-fill candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Must equal APPLY_EXACT_TEAM_NULL_CANDIDATE"
        required: true
        default: ""
      candidate_run_id:
        description: Read-only candidate run containing team_promotable_player_delta.parquet
        required: true
        default: "31668497497"

permissions:
  actions: write
  contents: read

concurrency:
  group: canonical-research-cache-replacement
  cancel-in-progress: false

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
  EXPECTED_SOURCE_ARTIFACT_ID: "9016453846|9016485043"
  EXPECTED_DELTA_ROWS: "600"
  EXPECTED_DELTA_UNIQUE_KEYS: "600"

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pytest==8.3.5
      - run: >-
          python -m pytest -q
          scripts/research_cohorts/test_apply_team_signal_delta_in_place.py

  apply:
    needs: tests
    if: ${{ inputs.confirm == 'APPLY_EXACT_TEAM_NULL_CANDIDATE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Record immutable pre-state
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          Path('prestate.json').write_text(json.dumps({
              'schema':[r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()],
              'player_rows':int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
          }, indent=2)+'\n')
          con.close()
          PY
      - name: Download exactly the validated candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate
          gh run download '${{ inputs.candidate_run_id }}' --repo '${{ github.repository }}' \
            --name 'research-raw-signal-cache-readback-${{ inputs.candidate_run_id }}' --dir candidate
          test "$(find candidate -name team_promotable_player_delta.parquet | wc -l)" -eq 1
          test "$(find candidate -name team_signal_candidate_report.json | wc -l)" -eq 1
      - name: Reject a stale, broadened, or unsafe candidate before mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          report=json.loads(next(Path('candidate').rglob('team_signal_candidate_report.json')).read_text())
          required={
              'read_only':True, 'cache_mutated':False, 'new_lineage':False,
              'canonical_schema_unchanged':True,
          }
          for key, expected in required.items():
              if report.get(key) != expected:
                  raise SystemExit(f'candidate invariant {key}={report.get(key)!r}, expected {expected!r}')
          expected={
              'win':0, 'loss':600, 'tie':600, 'team_points':0,
              'is_playoffs':0, 'champion':0, 'final_playoff_seed':0,
              'made_playoffs':0,
          }
          if {k:int(v) for k,v in report.get('improvements_by_field',{}).items()} != expected:
              raise SystemExit(f'candidate improvements differ: {report.get("improvements_by_field")}')
          if int(report.get('matched_player_rows',0)) != 600:
              raise SystemExit(f'candidate matched player rows differ: {report.get("matched_player_rows")}')
          delta=next(Path('candidate').rglob('team_promotable_player_delta.parquet'))
          con=duckdb.connect()
          cols={row[0] for row in con.execute(f"DESCRIBE SELECT * FROM read_parquet('{delta}')").fetchall()}
          required_cols={'db_name','year','week','NFL_player_id','manager','team_key','team_name','platform','source_loss','source_tie'}
          if not required_cols <= cols:
              raise SystemExit(f'candidate delta missing required columns: {sorted(required_cols-cols)}')
          total=int(con.execute(f"SELECT COUNT(*) FROM read_parquet('{delta}')").fetchone()[0])
          unique=int(con.execute(f"SELECT COUNT(*) FROM (SELECT DISTINCT db_name,year,week,NFL_player_id,manager,team_key,team_name,platform FROM read_parquet('{delta}'))").fetchone()[0])
          source_variants=int(con.execute(f"""
            SELECT COUNT(*) FROM (
              SELECT db_name,year,week,NFL_player_id,manager,team_key,team_name,platform
              FROM read_parquet('{delta}')
              GROUP BY ALL
              HAVING COUNT(DISTINCT COALESCE(CAST(source_loss AS VARCHAR), '<NULL>')) > 1
                  OR COUNT(DISTINCT COALESCE(CAST(source_tie AS VARCHAR), '<NULL>')) > 1
            )
          """).fetchone()[0])
          con.close()
          if total != 600 or unique != 600 or source_variants:
              raise SystemExit(f'candidate key gate failed: total={total}, unique={unique}, source_variants={source_variants}')
          PY
      - name: Apply only the existing-player loss and tie null cells
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_cohorts/apply_team_signal_delta_in_place.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --delta "$(find candidate -name team_promotable_player_delta.parquet -print -quit)" \
            --report apply_report.json
      - name: Fail fast before same-key replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          before=json.loads(Path('prestate.json').read_text())
          report=json.loads(Path('apply_report.json').read_text())
          expected={'win':0,'loss':600,'tie':600,'team_points':0,'is_playoffs':0,
                    'champion':0,'final_playoff_seed':0,'made_playoffs':0}
          actual={key:int(report['improvements_by_field'].get(key,0)) for key in expected}
          if actual != expected:
              raise SystemExit(f'only-loss-tie gate failed: {actual}')
          if (report.get('schema_unchanged') is not True or report.get('ops_untouched') is not True
                  or report.get('new_lineage') is not False or int(report.get('inserted_rows',-1)) != 0
                  or int(report.get('matched_rows',-1)) != 600):
              raise SystemExit(f'apply invariant failed: {report}')
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          if [r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()] != before['schema']:
              raise SystemExit('player schema changed')
          if int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]) != before['player_rows']:
              raise SystemExit('player row count changed')
          con.close()
          digest=hashlib.sha256()
          with Path('research_public_lake/ops_cache.duckdb').open('rb') as handle:
              for block in iter(lambda:handle.read(1024*1024),b''): digest.update(block)
          if digest.hexdigest() != Path('ops_before.sha256').read_text().split()[0]:
              raise SystemExit('ops cache changed')
          PY
      - name: Save pre-replacement promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: exact-team-null-promotion-evidence-${{ github.run_id }}
          path: |
            prestate.json
            ops_before.sha256
            apply_report.json
            candidate/**/team_signal_candidate_report.json
            candidate/**/team_promotable_player_delta.parquet
          retention-days: 90
          compression-level: 0
      - name: Replace only the one approved cache object under its same key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CANONICAL_CACHE_KEY}&ref=refs/heads/main" --jq '.actions_caches[].id')
          test "${#ids[@]}" -eq 1
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${ids[0]}"
      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}

  readback:
    needs: apply
    if: ${{ inputs.confirm == 'APPLY_EXACT_TEAM_NULL_CANDIDATE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: exact-team-null-promotion-evidence-${{ github.run_id }}
          path: evidence
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1
      - name: Independently restore and prove every candidate loss/tie cell is filled
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          delta=next(Path('evidence').rglob('team_promotable_player_delta.parquet'))
          before=json.loads(Path('evidence/prestate.json').read_text())
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          quoted=str(delta).replace("'", "''")
          con.execute(f"CREATE TEMP VIEW raw_delta AS SELECT * FROM read_parquet('{quoted}')")
          con.execute('''
            CREATE TEMP TABLE delta_unique AS
            SELECT db_name, year, week, NFL_player_id, manager, team_key, team_name, platform,
                   MAX(source_loss) AS source_loss, MAX(source_tie) AS source_tie
            FROM raw_delta
            GROUP BY ALL
          ''')
          full_join='''
              d.db_name=p.db_name
              AND CAST(d.year AS INTEGER)=CAST(p.year AS INTEGER)
              AND CAST(d.week AS INTEGER)=CAST(p.week AS INTEGER)
              AND d.NFL_player_id IS NOT DISTINCT FROM p.NFL_player_id
              AND d.platform IS NOT DISTINCT FROM p.platform
              AND d.manager IS NOT DISTINCT FROM p.manager
              AND (p.team_key IS NULL OR d.team_key=p.team_key)
              AND (p.team_name IS NULL OR d.team_name=p.team_name)
          '''
          matched=int(con.execute(f'SELECT COUNT(*) FROM public.player_fantasy p JOIN delta_unique d ON {full_join}').fetchone()[0])
          unmatched=int(con.execute(f'SELECT COUNT(*) FROM delta_unique d WHERE NOT EXISTS (SELECT 1 FROM public.player_fantasy p WHERE {full_join})').fetchone()[0])
          remaining_loss=int(con.execute(f'SELECT COUNT(*) FROM public.player_fantasy p JOIN delta_unique d ON {full_join} WHERE d.source_loss IS NOT NULL AND p.loss IS NULL').fetchone()[0])
          remaining_tie=int(con.execute(f'SELECT COUNT(*) FROM public.player_fantasy p JOIN delta_unique d ON {full_join} WHERE d.source_tie IS NOT NULL AND p.tie IS NULL').fetchone()[0])
          schema=[r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()]
          rows=int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0])
          con.close()
          digest=hashlib.sha256()
          with Path('research_public_lake/ops_cache.duckdb').open('rb') as handle:
              for block in iter(lambda:handle.read(1024*1024),b''): digest.update(block)
          result={
              'canonical_cache_key':'research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613',
              'candidate_run_id':'${{ inputs.candidate_run_id }}',
              'source_artifact_id':'9016453846|9016485043',
              'candidate_rows':600,
              'candidate_unique_keys':600,
              'matched_player_rows':matched,
              'unmatched_candidate_keys':unmatched,
              'loss_remaining_null_source_cells':remaining_loss,
              'tie_remaining_null_source_cells':remaining_tie,
              'schema_unchanged':schema == before['schema'],
              'player_rows_unchanged':rows == before['player_rows'],
              'ops_unchanged':digest.hexdigest() == Path('evidence/ops_before.sha256').read_text().split()[0],
              'fresh_restore':True,
              'new_lineage':False,
          }
          if not (matched == 600 and unmatched == 0 and remaining_loss == 0 and remaining_tie == 0
                  and result['schema_unchanged'] and result['player_rows_unchanged'] and result['ops_unchanged']):
              raise SystemExit(json.dumps(result, sort_keys=True))
          Path('exact_team_null_readback.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Verify exactly one approved cache object remains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CANONICAL_CACHE_KEY}&ref=refs/heads/main" --jq '.actions_caches[].id')
          test "${#ids[@]}" -eq 1
          printf '%s\n' "${ids[0]}" > canonical_cache_id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exact-team-null-promotion-readback-${{ github.run_id }}
          path: |
            exact_team_null_readback.json
            canonical_cache_id.txt
          retention-days: 90
