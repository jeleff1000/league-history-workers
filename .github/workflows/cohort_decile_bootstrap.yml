name: Cohort Decile League Bootstrap

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public research lake cache key
        required: true
        default: research-public-lake-v3-Linux-20260730
      years:
        description: JSON array of seasons to pool
        required: true
        default: '[1997,1998,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]'
      confidence:
        description: Two-sided confidence level
        required: true
        default: '0.85'
      reps:
        description: Bootstrap replicates per estimate
        required: true
        default: '400'

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        position: [QB, RB, WR, TE, K, DEF]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4
      - name: Verify public-only cache
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out
      - name: Build decile bootstrap shards
        env:
          PYTHONPATH: ${{ github.workspace }}/code/scripts/research_cohorts
        run: |
          python code/scripts/research_cohorts/build_cohort_decile_bootstrap.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --ops research_public_lake/ops_cache.duckdb \
            --years '${{ inputs.years }}' \
            --position '${{ matrix.position }}' \
            --confidence '${{ inputs.confidence }}' \
            --reps '${{ inputs.reps }}' \
            --memory-mb 10000 \
            --out "out/bootstrap_pooled_${{ matrix.position }}.parquet"
      - name: Upload decile bootstrap shard
        uses: actions/upload-artifact@v4
        with:
          name: decile-bootstrap-${{ matrix.position }}-${{ github.run_id }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 30
