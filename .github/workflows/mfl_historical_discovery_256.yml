Exit code: 0
Wall time: 0.5 seconds
Output:
name: MFL Historical Discovery (250 contiguous ID shards)

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: "Deterministic discovery shards (250 for the reconnaissance pass)"
        required: false
        default: "250"
        type: string
      max_parallel:
        description: "Concurrent runners; kept at 15 for MFL API safety"
        required: false
        default: "15"
        type: string
      start_year:
        description: "Oldest season to probe"
        required: false
        default: "1997"
        type: string
      end_year:
        description: "Newest season to probe"
        required: false
        default: "1998"
        type: string
      chain_next_window:
        description: "Dispatch the next season window after merge"
        required: false
        default: "true"
        type: string
      shard_indices:
        description: "Optional comma-separated shard indices to run; empty means all shards"
        required: false
        default: ""
        type: string
      directory_only:
        description: "Run only the named-directory search; do not run numeric shards"
        required: false
        default: "false"
        type: string
      id_bands:
        description: "Inclusive numeric MFL ID bands"
        required: false
        default: "1-9999,10000-29999,30000-59999,60000-80000"
        type: string
      request_sleep:
        description: "Seconds between MFL requests per runner"
        required: false
        default: "5.0"
        type: string
      id_start:
        description: "First inclusive MFL ID"
        required: false
        default: "0"
        type: string
      id_end:
        description: "Last inclusive MFL ID"
        required: false
        default: "10000"
        type: string
      yahoo_oauth_ref:
        description: "Pipeline code ref"
        required: false
        default: "main"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: mfl-historical-discovery
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = min(max(int("${{ inputs.shard_count || '250' }}"), 1), 250)
          mp = min(max(int("${{ inputs.max_parallel || '15' }}"), 1), 15, n)
          directory_only = "${{ inputs.directory_only || 'false' }}".strip().lower() == "true"
          raw = "${{ inputs.shard_indices || '' }}".strip()
          if directory_only:
              shards = []
          elif raw:
              shards = sorted({int(part.strip()) for part in raw.split(",") if part.strip()})
              if any(shard < 0 or shard >= n for shard in shards):
                  raise SystemExit(f"shard_indices must be within 0..{n - 1}")
          else:
              shards = list(range(n))
          print("shards=" + json.dumps(shards, separators=(",", ":")))
          print("max_parallel=" + str(min(mp, len(shards)) if shards else 1))
          PY

  discover:
    if: ${{ (inputs.directory_only || 'false') != 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.yahoo_oauth_ref || 'main' }}
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/extraplatform_corpus/
            /fantasy_football_data_scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run historical MFL shard
        run: |
          mkdir -p out
          python code/scripts/extraplatform_corpus/discover_mfl_shard.py \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ inputs.shard_count || '250' }}" \
            --start-year "${{ inputs.start_year || '1997' }}" \
            --end-year "${{ inputs.end_year || '1998' }}" \
            --id-start "${{ inputs.id_start || '0' }}" \
            --id-end "${{ inputs.id_end || '10000' }}" \
            --id-bands "${{ inputs.id_bands || '1-9999,10000-29999,30000-59999,60000-80000' }}" \
            --sleep "${{ inputs.request_sleep || '5.0' }}" \
            --out "out/mfl_shard_${{ matrix.shard }}.json"

      - name: Upload shard artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mfl-discovery-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: out/mfl_shard_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  # The numeric matrix finds IDs that have no searchable name.  Run the public
  # directory search as a separate, single runner so named dynasty/keeper/IDP
  # leagues are included without turning every matrix shard into a duplicate
  # keyword crawl.  It starts only after the matrix, keeping total concurrency
  # at the requested maximum of 15 runners.
  directory:
    if: ${{ always() && needs.discover.result != 'cancelled' }}
    needs: [prepare, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.yahoo_oauth_ref || 'main' }}
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/extraplatform_corpus/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Search named public MFL directories
        shell: bash
        run: |
          mkdir -p out /tmp
          YEARS=$(seq -s, "${{ inputs.start_year || '1997' }}" "${{ inputs.end_year || '1998' }}")
          # Keep the named-directory pass within the same ~10-minute runner
          # budget as the numeric shards: 120 requests at the configured 5s
          # throttle, with validation consuming the final 40%.
          MFL_YEARS="$YEARS" \
          MFL_REQ_CAP=120 \
          MFL_TARGET=200 \
          MFL_ALLOW_EXPIRED_CERT=1 \
          MFL_HTTP_TIMEOUT=8 \
          MFL_SLEEP="${{ inputs.request_sleep || '5.0' }}" \
          MFL_SEED_OUT="$PWD/out/mfl_directory_seed.json" \
          MFL_DISCOVERY_PROGRESS="$PWD/out/mfl_directory_progress.txt" \
          python code/scripts/extraplatform_corpus/discover_mfl_leagues.py

      - name: Upload directory artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfl-directory-discovery-${{ github.run_id }}
          path: out/mfl_directory_seed.json
          if-no-files-found: error
          retention-days: 30

  chain-next-window:
    if: ${{ needs.merge.result == 'success' && (inputs.directory_only || 'false') != 'true' && (inputs.chain_next_window || 'true') == 'true' && fromJSON(inputs.end_year || '1998') < 2025 }}
    needs: [merge]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch next two-season window
        shell: bash
        env:
          # The Actions installation token is rate-limited independently and
          # has repeatedly exhausted its dispatch quota.  Prefer the PAT
          # already required for the private pipeline checkout; retain the
          # built-in token as a fallback for installations without that secret.
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: mfl_historical_discovery_256.yml
          CURRENT_END: ${{ inputs.end_year || '1998' }}
          SHARDS: ${{ inputs.shard_count || '250' }}
          MAX_PARALLEL: ${{ inputs.max_parallel || '15' }}
          ID_BANDS: ${{ inputs.id_bands || '1-9999,10000-29999,30000-59999,60000-80000' }}
          SLEEP: ${{ inputs.request_sleep || '5.0' }}
          ID_START: ${{ inputs.id_start || '0' }}
          ID_END: ${{ inputs.id_end || '10000' }}
          CODE_REF: ${{ inputs.yahoo_oauth_ref || 'main' }}
        run: |
          set -euo pipefail
          next_start=$((CURRENT_END + 1))
          next_end=$((next_start + 1))
          if [ "$next_end" -gt 2025 ]; then next_end=2025; fi
          for delay in 30 60 120 240 300; do
            if gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
              -f ref=main \
              -f "inputs[shard_count]=${SHARDS}" \
              -f "inputs[max_parallel]=${MAX_PARALLEL}" \
              -f "inputs[start_year]=${next_start}" \
              -f "inputs[end_year]=${next_end}" \
              -f "inputs[id_bands]=${ID_BANDS}" \
              -f "inputs[request_sleep]=${SLEEP}" \
              -f "inputs[id_start]=${ID_START}" \
              -f "inputs[id_end]=${ID_END}" \
              -f "inputs[yahoo_oauth_ref]=${CODE_REF}"; then
              echo "Dispatched MFL window ${next_start}-${next_end}"
              exit 0
            fi
            echo "MFL window dispatch rate-limited; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          echo "Unable to dispatch MFL window ${next_start}-${next_end} after retries" >&2
          exit 1

  merge:
    if: ${{ always() && needs.discover.result != 'cancelled' && needs.directory.result != 'cancelled' }}
    needs: [prepare, discover, directory]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.yahoo_oauth_ref || 'main' }}
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/extraplatform_corpus/

      - name: Checkout worker seed repository
        uses: actions/checkout@v5
        with:
          path: worker

      - name: Download shard artifacts
        if: ${{ (inputs.directory_only || 'false') != 'true' }}
        uses: actions/download-artifact@v5
        with:
          pattern: mfl-discovery-shard-*
          path: shards
          merge-multiple: true

      - name: Download named directory artifact
        uses: actions/download-artifact@v5
        with:
          name: mfl-directory-discovery-${{ github.run_id }}
          path: directory

      - name: Merge season records and lineages
        run: |
          mkdir -p out
          SEED=""
          if [ -f worker/corpus_seed/mfl_crawl_seed.json ]; then
            SEED="--existing-seed worker/corpus_seed/mfl_crawl_seed.json"
          fi
          # Feed named-directory results through the same season/id dedupe and
          # lineage merge as numeric shards.
          mkdir -p shards
          cp directory/mfl_directory_seed.json shards/mfl_shard_directory.json
          python code/scripts/extraplatform_corpus/merge_mfl_shards.py \
            --input-glob "shards/**/mfl_shard_*.json" \
            $SEED \
            --out out/mfl_discovery_merged.json
          python3 - <<'PY'
          import json
          d=json.load(open("out/mfl_discovery_merged.json"))
          print(f"season_leagues={d['unique_season_leagues']}")
          print(f"draft_records={d['records_with_draft']}")
          print(f"lineages={d['lineage_count']}")
          PY

      - name: Upload merged inventory
        uses: actions/upload-artifact@v4
        with:
          name: mfl-discovery-merged-${{ github.run_id }}
          path: out/mfl_discovery_merged.json
          if-no-files-found: error
          retention-days: 30

