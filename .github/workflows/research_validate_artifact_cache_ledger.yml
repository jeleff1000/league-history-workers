name: Validate research artifact cache ledger

on:
  workflow_dispatch:
  push:
    paths:
      - docs/research_matchup_artifact_cache_ledger.csv
      - docs/research_matchup_artifact_cache_ledger.md
      - scripts/research_cohorts/validate_artifact_cache_ledger.py
      - scripts/research_cohorts/test_validate_artifact_cache_ledger.py
      - scripts/research_cohorts/enrich_artifact_cache_ledger_bridge_evidence.py
      - scripts/research_cohorts/test_enrich_artifact_cache_ledger_bridge_evidence.py
      - scripts/research_cohorts/refresh_artifact_cache_ledger.py
      - scripts/research_cohorts/test_refresh_artifact_cache_ledger.py
      - scripts/research_cohorts/apply_loss_tie_readback_to_ledger.py
      - scripts/research_cohorts/test_apply_loss_tie_readback_to_ledger.py
      - scripts/research_cohorts/append_mfl_batch_artifact_admissions.py
      - scripts/research_cohorts/test_append_mfl_batch_artifact_admissions.py
      - scripts/research_cohorts/artifact_promotion_specmap.py
      - scripts/research_cohorts/test_artifact_promotion_specmap.py
      - scripts/research_cohorts/build_artifact_promotion_specmap.py
      - scripts/research_cohorts/test_build_artifact_promotion_specmap.py
      - scripts/research_cohorts/normalize_artifact_promotion_candidates.py
      - scripts/research_cohorts/test_normalize_artifact_promotion_candidates.py
      - scripts/research_cohorts/materialize_artifact_candidate_cells.py
      - scripts/research_cohorts/test_materialize_artifact_candidate_cells.py
      - scripts/research_cohorts/artifact_candidate_comparison_contract.py
      - scripts/research_cohorts/test_artifact_candidate_comparison_contract.py
      - scripts/research_cohorts/compare_artifact_candidate_cells.py
      - scripts/research_cohorts/test_compare_artifact_candidate_cells.py
      - .github/workflows/research_materialize_artifact_candidate_cells.yml
      - scripts/research_cohorts/validate_mfl_batch_admission_manifest.py
      - tests/research_cohorts/test_validate_mfl_batch_admission_manifest.py
      - .github/workflows/research_validate_artifact_cache_ledger.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest duckdb==1.5.1
      - name: Run ledger validator tests
        run: >-
          pytest -q
          scripts/research_cohorts/test_validate_artifact_cache_ledger.py
          scripts/research_cohorts/test_enrich_artifact_cache_ledger_bridge_evidence.py
          scripts/research_cohorts/test_refresh_artifact_cache_ledger.py
          scripts/research_cohorts/test_apply_loss_tie_readback_to_ledger.py
          scripts/research_cohorts/test_append_mfl_batch_artifact_admissions.py
          scripts/research_cohorts/test_artifact_promotion_specmap.py
          scripts/research_cohorts/test_build_artifact_promotion_specmap.py
          scripts/research_cohorts/test_normalize_artifact_promotion_candidates.py
          scripts/research_cohorts/test_materialize_artifact_candidate_cells.py
          scripts/research_cohorts/test_artifact_candidate_comparison_contract.py
          scripts/research_cohorts/test_compare_artifact_candidate_cells.py
          tests/research_cohorts/test_validate_mfl_batch_admission_manifest.py
      - name: Fail fast on invalid ledger evidence
        run: >-
          python scripts/research_cohorts/validate_artifact_cache_ledger.py
          --ledger docs/research_matchup_artifact_cache_ledger.csv
      - name: Materialize the exact remaining-artifact action queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, sys
          from collections import Counter, defaultdict
          from pathlib import Path
          # The validator is a script with sibling imports, so invoke it using
          # its supported script-module path rather than package-importing it.
          sys.path.insert(0, str(Path('scripts/research_cohorts').resolve()))
          from validate_artifact_cache_ledger import CLOSED_STATUSES

          with Path('docs/research_matchup_artifact_cache_ledger.csv').open(newline='', encoding='utf-8-sig') as handle:
              rows=list(csv.DictReader(handle))
          queue=[row for row in rows if row.get('record_type')=='artifact_inventory' and row.get('final_status') not in CLOSED_STATUSES]
          groups=defaultdict(lambda:{'artifacts':0,'candidate_delta_rows':0,'cache_missing_cells':0,'cache_conflict_cells':0,'unmatched_cache_cells':0,'blocked_schema_cells':0,'artifact_ids':[]})
          for row in queue:
              key=(row.get('final_status',''),row.get('workflow_run_id',''),row.get('artifact',''))
              group=groups[key]; group['artifacts']+=1; group['artifact_ids'].append(int(row['artifact_id']))
              for field in ('candidate_delta_rows','cache_missing_cells','cache_conflict_cells','unmatched_cache_cells','blocked_schema_cells'):
                  group[field]+=int(str(row.get(field,'') or '0'))
          result={
              'raw_open_artifacts':len(queue),
              'by_status':dict(sorted(Counter(row['final_status'] for row in queue).items())),
              'batches':[{'final_status':key[0],'workflow_run_id':key[1],'artifact':key[2],**value} for key,value in sorted(groups.items())],
              'artifacts':queue,
          }
          Path('research_matchup_open_artifact_queue.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'raw_open_artifacts':result['raw_open_artifacts'],'batches':len(result['batches']),'status':result['by_status']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-matchup-open-artifact-queue-${{ github.run_id }}
          path: research_matchup_open_artifact_queue.json
          retention-days: 90
