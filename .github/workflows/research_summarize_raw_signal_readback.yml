name: Research summarize raw signal readback

on:
  workflow_dispatch:
    inputs:
      readback_run_id:
        description: Completed read-only raw-signal cache-readback run.
        required: true
        default: "31759193969"

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: research-raw-signal-cache-readback-${{ inputs.readback_run_id }}
          run-id: ${{ inputs.readback_run_id }}
          path: input
          github-token: ${{ github.token }}
      - name: Emit exact current-cache receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          files = list(Path('input').rglob('final_artifact_cache_receipts.json'))
          if len(files) != 1:
              raise SystemExit(f'expected exactly one readback receipt, found {len(files)}')
          receipt = json.loads(files[0].read_text())
          selected_files = list(Path('input').rglob('selected_artifacts.json'))
          if len(selected_files) != 1:
              raise SystemExit(f'expected exactly one selected-artifacts manifest, found {len(selected_files)}')
          selected = json.loads(selected_files[0].read_text())
          # Artifact IDs are logical receipts, not guaranteed numeric GitHub IDs.
          # Compare their serialized form so source-only bridge receipts remain
          # visible in the selected-artifact report.
          selected_ids = {str(row['artifact_id']) for row in selected}
          profile_files = list(Path('input').rglob('raw_signal_join_key_profile.json'))
          if len(profile_files) != 1:
              raise SystemExit(f'expected exactly one join-key profile, found {len(profile_files)}')
          profile = json.loads(profile_files[0].read_text())
          profile_rows = profile.get('rows', []) if isinstance(profile, dict) else profile
          profile_examples = profile.get('identity_examples', []) if isinstance(profile, dict) else []
          profile_unresolved = profile.get('unresolved_identity_reasons', []) if isinstance(profile, dict) else []
          schema_files = list(Path('input').rglob('raw_source_schemas.json'))
          if len(schema_files) != 1:
              raise SystemExit(f'expected exactly one raw-source schema receipt, found {len(schema_files)}')
          source_schemas = json.loads(schema_files[0].read_text())
          report = {
              'summary': receipt['summary'],
              'selected_artifacts': selected,
              'selected_receipt_rows': [
                  row for row in receipt['rows']
                  if str(row.get('artifact_id', '')) in selected_ids
              ],
            'selected_identity_profile': [
                row for row in profile_rows if str(row.get('artifact_id', '')) in selected_ids
            ],
            'selected_identity_examples': [
                row for row in profile_examples if str(row.get('artifact_id', '')) in selected_ids
            ],
            'selected_unresolved_identity_reasons': [
                row for row in profile_unresolved if str(row.get('artifact_id', '')) in selected_ids
            ],
            'selected_source_schemas': [
                row for row in source_schemas if str(row.get('artifact_id', '')) in selected_ids
            ],
          }
          Path('research_raw_signal_readback_summary.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-raw-signal-readback-summary-${{ github.run_id }}
          path: research_raw_signal_readback_summary.json
