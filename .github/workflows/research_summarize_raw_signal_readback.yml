name: Research summarize raw signal readback

on:
  workflow_dispatch:
    inputs:
      readback_run_id:
        description: Completed read-only raw-signal cache-readback run.
        required: true
        default: "31759193969"

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: research-raw-signal-cache-readback-${{ inputs.readback_run_id }}
          run-id: ${{ inputs.readback_run_id }}
          path: input
          github-token: ${{ github.token }}
      - name: Emit exact current-cache receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          files = list(Path('input').rglob('final_artifact_cache_receipts.json'))
          if len(files) != 1:
              raise SystemExit(f'expected exactly one readback receipt, found {len(files)}')
          receipt = json.loads(files[0].read_text())
          selected_files = list(Path('input').rglob('selected_artifacts.json'))
          if len(selected_files) != 1:
              raise SystemExit(f'expected exactly one selected-artifacts manifest, found {len(selected_files)}')
          selected = json.loads(selected_files[0].read_text())
          selected_ids = {int(row['artifact_id']) for row in selected}
          profile_files = list(Path('input').rglob('raw_signal_join_key_profile.json'))
          if len(profile_files) != 1:
              raise SystemExit(f'expected exactly one join-key profile, found {len(profile_files)}')
          profile = json.loads(profile_files[0].read_text())
          report = {
              'summary': receipt['summary'],
              'selected_artifacts': selected,
              'selected_receipt_rows': [
                  row for row in receipt['rows']
                  if int(row.get('artifact_id', -1)) in selected_ids
              ],
              'selected_identity_profile': [
                  row for row in profile if int(row.get('artifact_id', -1)) in selected_ids
              ],
          }
          Path('research_raw_signal_readback_summary.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-raw-signal-readback-summary-${{ github.run_id }}
          path: research_raw_signal_readback_summary.json
