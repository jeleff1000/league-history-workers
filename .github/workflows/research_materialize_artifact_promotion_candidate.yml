name: Materialize audited artifact promotion candidate

on:
  workflow_dispatch:
    inputs:
      comparison_run_id:
        description: Completed full artifact comparison run
        required: true
      base_cache_key:
        description: Frozen canonical research cache key
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  actions: read
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - name: Download audited candidate deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p comparison
          gh run download '${{ inputs.comparison_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-artifact-complete-audit-${{ inputs.comparison_run_id }}' \
            --dir comparison
          test -s "$(find comparison -name team_promotable_player_delta.parquet -print -quit)"
          test -s "$(find comparison -name exact_promotable_player_delta.parquet -print -quit)"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Materialize and read back every promoted cell
        shell: bash
        run: |
          set -euo pipefail
          TEAM=$(find comparison -name team_promotable_player_delta.parquet -print -quit)
          EXACT=$(find comparison -name exact_promotable_player_delta.parquet -print -quit)
          STRUCTURED=$(find comparison -name structured_promotable_delta.parquet -print -quit)
          python scripts/research_cohorts/materialize_artifact_promotion_candidate.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --team-delta "$TEAM" \
            --exact-delta "$EXACT" \
            --structured-delta "$STRUCTURED" \
            --ops research_public_lake/ops_cache.duckdb \
            --allow-unmatched-structured \
            --report promotion_candidate_report.json
      - name: Upload verified working-copy candidate
        uses: actions/upload-artifact@v4
        with:
          name: research-artifact-promotion-candidate-${{ github.run_id }}
          path: |
            research_public_lake/corpus_snapshot.duckdb
            promotion_candidate_report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload promotion report only
        uses: actions/upload-artifact@v4
        with:
          name: research-artifact-promotion-report-${{ github.run_id }}
          path: promotion_candidate_report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Build file-by-file promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          TEAM=$(find comparison -name team_promotable_player_delta.parquet -print -quit)
          EXACT=$(find comparison -name exact_promotable_player_delta.parquet -print -quit)
          STRUCTURED=$(find comparison -name structured_promotable_delta.parquet -print -quit)
          python scripts/research_cohorts/build_artifact_promotion_ledger.py \
            --file-ledger "$(find comparison -name file_promotion_ledger.json -print -quit)" \
            --team-delta "$TEAM" --exact-delta "$EXACT" --structured-delta "$STRUCTURED" \
            --cache-comparison "$(find comparison -name cache_candidate_comparison.json -print -quit)" \
            --materialization-report promotion_candidate_report.json \
            --out-json artifact_promotion_evidence.json --out-csv artifact_promotion_evidence.csv
      - name: Upload file-by-file promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-artifact-promotion-evidence-${{ github.run_id }}
          path: |
            artifact_promotion_evidence.json
            artifact_promotion_evidence.csv
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
