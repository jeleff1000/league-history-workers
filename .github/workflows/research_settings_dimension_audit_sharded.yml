name: Sharded settings dimension audit

on:
  workflow_dispatch:
    inputs:
      comparison_run_id:
        description: Completed full artifact comparison run containing the file ledger
        required: true
        default: '31441478179'
      base_cache_key:
        description: Frozen canonical research cache key
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  actions: read
  contents: read

jobs:
  download:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download assigned settings artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('audit_manifests/research_matchup_artifact_manifest_20260809.json').read_text())
          settings=[item for item in manifest['artifacts'] if item['artifact'].startswith(('cohort-dimension-fills-','source-settings-rescue-'))]
          ids=sorted({str(item['artifact_id']) for item in settings})
          if len(ids) != 1633:
              raise SystemExit(f'expected 1633 settings artifacts, found {len(ids)}')
          shard=int('${{ matrix.shard }}')
          chosen=[value for value in ids if int(value) % 8 == shard]
          Path('settings_ids.txt').write_text(','.join(chosen)+'\n')
          print(f'shard={shard} settings_artifacts={len(chosen)}')
          PY
          python scripts/research_cohorts/download_workflow_artifacts.py \
            --repo "$GITHUB_REPOSITORY" --run-id 0 --ids "$(cat settings_ids.txt)" \
            --out settings_candidates --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-candidate-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: settings_candidates
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  aggregate:
    needs: download
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - uses: actions/download-artifact@v5
        with:
          pattern: settings-candidate-shard-*-*
          path: settings_candidates
          merge-multiple: false
      - name: Require all eight settings shards
        shell: bash
        run: |
          set -euo pipefail
          count=$(find settings_candidates -type f \( -name 'league_settings_updates.parquet' -o -name 'source_settings_*.parquet' \) | wc -l)
          test "$count" -eq 1633 || { echo "expected 1633 settings files, found $count"; exit 1; }
      - name: Audit settings fields and target tables
        run: |
          set -euo pipefail
          python scripts/research_cohorts/audit_settings_dimension_candidates.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --candidates settings_candidates \
            --out settings_dimension_audit.json \
            --delta-out settings_promotable_delta.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: research-settings-dimension-audit-${{ github.run_id }}
          path: |
            settings_dimension_audit.json
            settings_promotable_delta.parquet
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
