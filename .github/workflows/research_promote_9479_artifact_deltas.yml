name: Promote validated 9,479-artifact deltas to canonical cache

on:
  workflow_dispatch:
    inputs:
      comparison_run_id:
        description: Full artifact comparison run containing player deltas
        required: true
        default: '31441478179'
      settings_audit_run_id:
        description: Sharded settings audit run containing settings delta
        required: true
        default: '31446334849'
      evidence_run_id:
        description: Combined evidence run proving the artifact inventory/readback
        required: true
        default: '31448116124'
      confirm:
        description: Required explicit confirmation for same-key canonical replacement
        required: true
        default: PROMOTE_EXACT_CANONICAL_KEY

permissions:
  actions: write
  contents: read

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

jobs:
  promote:
    if: ${{ inputs.confirm == 'PROMOTE_EXACT_CANONICAL_KEY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Download frozen deltas and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comparison settings_audit evidence
          gh run download '${{ inputs.comparison_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-artifact-complete-audit-${{ inputs.comparison_run_id }}' \
            --dir comparison
          gh run download '${{ inputs.settings_audit_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-settings-dimension-audit-${{ inputs.settings_audit_run_id }}' \
            --dir settings_audit
          gh run download '${{ inputs.evidence_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-artifact-combined-promotion-evidence-${{ inputs.evidence_run_id }}' \
            --dir evidence
          test -s "$(find comparison -name team_promotable_player_delta.parquet -print -quit)"
          test -s "$(find comparison -name exact_promotable_player_delta.parquet -print -quit)"
          test -s "$(find comparison -name structured_promotable_delta.parquet -print -quit)"
          test -s "$(find settings_audit -name settings_promotable_delta.parquet -print -quit)"
          test -s "$(find evidence -name artifact_promotion_evidence_combined.json -print -quit)"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2

      - name: Capture canonical pre-state and validate evidence ledger
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          evidence=json.loads(next(Path('evidence').rglob('artifact_promotion_evidence_combined.json')).read_text())
          required={
              'manifest_artifacts':9479,
              'expected_manifest_artifacts':9479,
              'all_manifest_artifacts_listed':True,
              'working_copy_readback_clean':True,
              'canonical_cache_replaced':False,
              'new_lineage':False,
              'schema_unchanged':True,
              'ops_unchanged':True,
              'settings_readback_proof_clean':True,
          }
          for key,value in required.items():
              if evidence.get(key) != value:
                  raise SystemExit(f'evidence invariant failed: {key}={evidence.get(key)!r}, expected {value!r}')
          if evidence.get('source_artifact_ids_unmapped'):
              raise SystemExit(f'unmapped source artifacts: {evidence["source_artifact_ids_unmapped"][:10]}')
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          out={
              'player_columns':[r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()],
              'settings_columns':[r[0] for r in con.execute('DESCRIBE public.league_settings').fetchall()],
              'player_rows':int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
              'settings_rows':int(con.execute('SELECT COUNT(*) FROM public.league_settings').fetchone()[0]),
          }
          Path('pre_promotion.json').write_text(json.dumps(out,indent=2)+'\n')
          con.close()
          PY

      - name: Apply player deltas by exact canonical key
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_cohorts/materialize_artifact_promotion_candidate.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --team-delta "$(find comparison -name team_promotable_player_delta.parquet -print -quit)" \
            --exact-delta "$(find comparison -name exact_promotable_player_delta.parquet -print -quit)" \
            --structured-delta "$(find comparison -name structured_promotable_delta.parquet -print -quit)" \
            --ops research_public_lake/ops_cache.duckdb \
            --allow-unmatched-structured \
            --report player_apply_report.json

      - name: Apply settings deltas by (db_name, year)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_cohorts/materialize_settings_dimension_candidate.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --ops research_public_lake/ops_cache.duckdb \
            --delta "$(find settings_audit -name settings_promotable_delta.parquet -print -quit)" \
            --report settings_apply_report.json

      - name: Fail-fast post-apply audit before cache replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()
          pre=json.loads(Path('pre_promotion.json').read_text())
          player=json.loads(Path('player_apply_report.json').read_text())
          settings=json.loads(Path('settings_apply_report.json').read_text())
          for report,name in ((player,'player'),(settings,'settings')):
              if report.get('working_copy_only') is not True or report.get('canonical_cache_replaced') is not False or report.get('new_lineage') is not False or report.get('schema_unchanged') is not True or report.get('ops_unchanged') is not True:
                  raise SystemExit(f'{name} apply report failed invariants: {report}')
              if any(int(v) != 0 for v in report.get('readback_remaining_nulls',{}).values()):
                  raise SystemExit(f'{name} readback has remaining nulls: {report["readback_remaining_nulls"]}')
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          pcols=[r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()]
          scols=[r[0] for r in con.execute('DESCRIBE public.league_settings').fetchall()]
          prows=int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0])
          srows=int(con.execute('SELECT COUNT(*) FROM public.league_settings').fetchone()[0])
          if pcols != pre['player_columns'] or scols != pre['settings_columns']:
              raise SystemExit('schema changed during apply')
          if prows != pre['player_rows'] or srows != pre['settings_rows']:
              raise SystemExit('row count changed during apply')
          if sha('research_public_lake/ops_cache.duckdb') != Path('ops_before.sha256').read_text().split()[0]:
              raise SystemExit('ops cache changed during apply')
          post={'player_columns':pcols,'settings_columns':scols,'player_rows':prows,'settings_rows':srows}
          Path('post_promotion.json').write_text(json.dumps(post,indent=2)+'\n')
          con.close()
          PY

      - name: Upload complete pre-replacement promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-9479-promotion-evidence-${{ github.run_id }}
          path: |
            pre_promotion.json
            post_promotion.json
            ops_before.sha256
            player_apply_report.json
            settings_apply_report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Replace only the exact canonical cache key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CANONICAL_CACHE_KEY}&ref=refs/heads/main" --jq '.actions_caches[].id')
          test "${#ids[@]}" -eq 1
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${ids[0]}"

      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}

      - name: Verify one canonical cache remains under the same key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CANONICAL_CACHE_KEY}&ref=refs/heads/main" --jq '.actions_caches[].id')
          test "${#ids[@]}" -eq 1
          echo "canonical_cache_key=${CANONICAL_CACHE_KEY} cache_id=${ids[0]}"
