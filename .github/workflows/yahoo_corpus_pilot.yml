name: Yahoo Corpus Pilot

# Operational owner: jeleff1000/league-history-workers only. This file is mirrored into
# yahoo_oauth for workflow-source parity, but the repository guard below keeps that copy inert.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'cross-era uses distinct grants across four eras; spacing-resume uses four long histories'
        required: true
        type: choice
        options: ['cross-era', 'spacing-resume']
        default: 'cross-era'
      task_limit:
        description: 'League-years in the pilot'
        required: false
        type: string
        default: '12'
      workers:
        description: 'Reserved for scale-up; pilots remain serial to prove dispatch ordering'
        required: false
        type: string
        default: '1'
      plan_only:
        description: 'Discover and report the redacted plan without importing leagues'
        required: false
        type: boolean
        default: false
      yahoo_oauth_ref:
        description: 'Private pipeline ref to check out'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

concurrency:
  group: yahoo-corpus-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: github.repository == 'jeleff1000/league-history-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CORPUS_OUT: ${{ github.workspace }}/corpus/yahoo-pilot
      YAHOO_OAUTH_ROOT: ${{ github.workspace }}/code
      OPS_CACHE_PATH: ${{ github.workspace }}/corpus_dependencies/ops_cache.duckdb
      DRAFT_GLOBAL_SOURCE_PATH: ${{ github.workspace }}/corpus_dependencies/draft_global_source.parquet
      CORPUS_DEPENDENCY_KEY: corpus-dependencies-v1-Linux-20260717
      PYTHONPATH: ${{ github.workspace }}/worker:${{ github.workspace }}/code/fantasy_football_data_scripts
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout worker runner
        uses: actions/checkout@v5
        with:
          path: worker

      - name: Checkout private pipeline
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.yahoo_oauth_ref || 'main' }}
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install private pipeline dependencies
        run: python -m pip install -r code/requirements.txt

      - name: Restore offline corpus dependencies
        id: corpus-dependencies
        uses: actions/cache/restore@v5
        with:
          path: corpus_dependencies
          key: ${{ env.CORPUS_DEPENDENCY_KEY }}

      - name: Fail fast if offline dependencies are missing
        if: steps.corpus-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "::error::corpus dependency miss (${CORPUS_DEPENDENCY_KEY}); run Seed Corpus Dependencies"
          exit 1

      - name: Validate offline dependency bundle
        run: |
          python code/scripts/sleeper_corpus/build_github_dependency_bundle.py \
            --output "${{ github.workspace }}/corpus_dependencies" \
            --validate-only

      - name: Run credential-spaced Yahoo pilot
        env:
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          CREDENTIAL_ENCRYPTION_KEY_NEW: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY_NEW }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'cross-era' }}
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '12' }}
          PLAN_ONLY: ${{ github.event.inputs.plan_only || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$CORPUS_OUT"
          COMMON=(
            --mode "$MODE"
            --task-limit "$TASK_LIMIT"
            --pipeline-root "${{ github.workspace }}/code"
            --output "$CORPUS_OUT"
          )
          if [ -f "${{ github.workspace }}/worker/corpus_seed/yahoo_landed.txt" ]; then
            COMMON+=( --landed-list "${{ github.workspace }}/worker/corpus_seed/yahoo_landed.txt" )
          fi
          if [ "$PLAN_ONLY" = "true" ]; then
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}" --plan-only
          elif [ "$MODE" = "spacing-resume" ]; then
            echo "[pilot] controlled first pass: stop after four successful league-years"
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}" --stop-after 4
            echo "[pilot] resume from persisted scheduler state"
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}" --resume
          else
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}"
          fi

      - name: Report compact slice
        if: always()
        run: |
          if [ -s "$CORPUS_OUT/yahoo_corpus_slice.duckdb" ]; then
            python - <<'PY'
          import duckdb, os
          path = os.environ['CORPUS_OUT'] + '/yahoo_corpus_slice.duckdb'
          con = duckdb.connect(path, read_only=True)
          print('[slice] sources:', con.execute('SELECT COUNT(*) FROM _sources').fetchone()[0])
          for table in ('league_settings', 'draft', 'transactions', 'player_fantasy'):
              print(f'[slice] {table}:', con.execute(f'SELECT COUNT(*) FROM public.{table}').fetchone()[0])
          PY
          else
            echo "[slice] no compact slice produced"
          fi

      - name: Upload compact Yahoo pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-corpus-${{ github.event.inputs.mode || 'cross-era' }}-${{ github.run_id }}
          path: |
            ${{ env.CORPUS_OUT }}/yahoo_corpus_slice.duckdb
            ${{ env.CORPUS_OUT }}/ledger.json
            ${{ env.CORPUS_OUT }}/report.json
            ${{ env.CORPUS_OUT }}/driver.log
          retention-days: 14
          if-no-files-found: warn
