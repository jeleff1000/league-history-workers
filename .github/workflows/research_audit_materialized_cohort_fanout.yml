name: Audit materialized cohort fan-out in canonical cache

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      settings_audit_run_id:
        required: true
        default: '31446334849'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download the already-promoted settings delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir settings_audit
          gh run download '${{ inputs.settings_audit_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-settings-dimension-audit-${{ inputs.settings_audit_run_id }}' \
            --dir settings_audit
          delta=$(find settings_audit -name settings_promotable_delta.parquet -print -quit)
          test -s "$delta"
          echo "SETTINGS_DELTA=$delta" >> "$GITHUB_ENV"
      - name: Audit current materialized player cohorts without mutation
        run: |
          python scripts/research_cohorts/audit_materialized_cohort_fanout.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --settings-delta "$SETTINGS_DELTA" \
            --out materialized_cohort_fanout_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materialized-cohort-fanout-audit-${{ github.run_id }}
          path: materialized_cohort_fanout_audit.json
          if-no-files-found: error
          retention-days: 90
