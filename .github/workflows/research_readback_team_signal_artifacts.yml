name: Read back retained raw signal artifacts

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      artifact_prefix:
        description: Ledger artifact-name prefix to read; blank selects all eligible artifacts.
        required: false
        default: research-source-matchup-rescue-
      artifact_ids:
        description: Optional comma-separated exact ledger artifact IDs; overrides artifact prefix.
        required: false
        default: ''
      download_mode:
        description: Source artifact download strategy; use exact for small selections and source_run only for large retained families.
        required: true
        type: choice
        default: exact
        options:
          - exact
          - source_run
      source_kind:
        description: Raw artifact grain; each choice has one explicit, fail-closed identity rule.
        required: true
        type: choice
        default: team
        options:
          - team
          - structured_player
          - canonical_player_snapshot

permissions:
  actions: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Record immutable-cache prestate
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          Path('prestate.json').write_text(json.dumps({
            'schema':[r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()],
            'rows':int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
          }, indent=2)+'\n')
          con.close()
          PY
      - name: Download retained source artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
          ARTIFACT_IDS: ${{ inputs.artifact_ids }}
          DOWNLOAD_MODE: ${{ inputs.download_mode }}
          SOURCE_KIND: ${{ inputs.source_kind }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          python scripts/research_cohorts/select_retained_artifacts.py \
            --ledger-csv docs/research_matchup_artifact_cache_ledger.csv \
            --source-kind "$SOURCE_KIND" \
            --prefix "$ARTIFACT_PREFIX" \
            --artifact-ids "$ARTIFACT_IDS" \
            --out-json selected_artifacts.json \
            --out-tsv selected_artifacts.tsv
          # Preserve receipt counts for every other artifact but replace (do
          # not add to) the selected artifacts' stale prior readback counts.
          selected_ids="$(cut -f3 selected_artifacts.tsv | paste -sd, -)"
          python scripts/research_cohorts/materialize_ledger_receipt_inputs.py \
            --ledger-csv docs/research_matchup_artifact_cache_ledger.csv \
            --ledger-json ledger_receipt_input.json \
            --prior-receipts prior_receipts_input.json \
            --exclude-artifact-ids "$selected_ids"
          if [ "$DOWNLOAD_MODE" = source_run ]; then
            # For a large retained family, source-run download needs only one
            # workflow invocation per source run. The later manifest remains
            # ledger-exact.
            mkdir -p source_runs
            cut -f1 selected_artifacts.tsv | sort -u | while IFS= read -r run; do
              gh run download "$run" --repo '${{ github.repository }}' --dir "source_runs/$run"
            done
          elif [ "$DOWNLOAD_MODE" = exact ]; then
            # A small selection must not download every artifact from its
            # 256-shard source run. Serialize the exact downloads to respect
            # the shared GitHub Actions installation API quota.
            mkdir -p sources
            while IFS=$'\t' read -r run artifact artifact_id; do
              mkdir -p "sources/$artifact_id"
              gh run download "$run" --repo '${{ github.repository }}' --name "$artifact" --dir "sources/$artifact_id"
            done < selected_artifacts.tsv
          else
            echo "unsupported download mode: $DOWNLOAD_MODE" >&2
            exit 2
          fi
      - name: Build exact raw-source manifest
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
          DOWNLOAD_MODE: ${{ inputs.download_mode }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          selected=json.loads(Path('selected_artifacts.json').read_text())
          manifest=[]
          source_kind=os.environ['SOURCE_KIND']
          download_mode=os.environ['DOWNLOAD_MODE']
          for row in selected:
              artifact_id=row['artifact_id']
              root=(Path('source_runs', str(row['workflow_run_id']), row['artifact'])
                    if download_mode == 'source_run' else Path('sources', artifact_id))
              if source_kind == 'structured_player':
                  # Structured-player artifacts predate the later delta ledger
                  # and their raw filename is not the ledger's delta filename.
                  candidates=list(root.rglob('*.parquet'))
              else:
                  expected=[name for name in row['candidate_files'].split('|') if name.endswith('.parquet')]
                  candidates=[]
                  for name in expected:
                      candidates.extend(root.rglob(name))
              if len(candidates)!=1:
                  raise SystemExit(f"{artifact_id}: expected exactly one raw parquet, found {len(candidates)}")
              manifest.append({'artifact_id':int(artifact_id),'path':str(candidates[0].resolve())})
          if len(manifest)!=len(selected):
              raise SystemExit('manifest did not cover every selected artifact')
          Path('raw_source_manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print(json.dumps({'manifest_rows':len(manifest)}))
          PY
      - name: Profile raw-source identities against canonical player rows
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
        shell: bash
        run: |
          set -euo pipefail
          # Team/week evidence is the large retained family.  Profile every
          # artifact in one exact team-key join instead of scanning the full
          # canonical player table once per artifact/strategy.
          if [ "$SOURCE_KIND" = "team" ]; then
            python scripts/research_cohorts/profile_raw_team_signal_sources.py \
              --base research_public_lake/corpus_snapshot.duckdb \
              --manifest raw_source_manifest.json \
              --out raw_signal_join_key_profile.json
            exit 0
          fi
          if [ "$SOURCE_KIND" = "canonical_player_snapshot" ]; then
            # The canonical snapshot receipt below performs one unioned source
            # to cache join and fails closed on zero/multiple matches.  Do not
            # pre-scan the 269M-row cache once per source file here.
            python -c "import json; from pathlib import Path; Path('raw_signal_join_key_profile.json').write_text(json.dumps({'source_kind':'canonical_player_snapshot','identity_rule':'(db_name, year, week, NFL_player_id) with manager/platform guards','cardinality_evidence':'reported by final receipt unmatched cells after one unioned cache join'}, indent=2)+'\\n')"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          import duckdb
          source_kind=os.environ['SOURCE_KIND']
          manifest=json.loads(Path('raw_source_manifest.json').read_text())
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          strategies={
            'team_key_to_team_key': 'p.team_key IS NOT DISTINCT FROM r.team_key',
            'mfl_manager_guid_to_team_key': "lower(CAST(r.platform AS VARCHAR))='mfl' AND p.team_key IS NOT DISTINCT FROM r.manager_guid",
            'manager_to_manager': 'p.manager IS NOT DISTINCT FROM r.manager',
            'manager_team_name': 'p.manager IS NOT DISTINCT FROM r.manager AND p.team_name IS NOT DISTINCT FROM r.team_name',
          }
          rows=[]
          for item in manifest:
            path=str(Path(item['path']).resolve()).replace("'", "''")
            columns={x[0] for x in con.execute(f"DESCRIBE SELECT * FROM read_parquet('{path}')").fetchall()}
            if source_kind == 'structured_player':
              key=['db_name','year','week','NFL_player_id','manager']
              if not set(key) <= columns:
                raise SystemExit(f"{item['artifact_id']}: missing exact player key columns")
              total=int(con.execute(f"SELECT COUNT(*) FROM read_parquet('{path}')").fetchone()[0])
              matched=int(con.execute(f"""
                SELECT COUNT(*) FROM read_parquet('{path}') r
                WHERE EXISTS (
                  SELECT 1 FROM public.player_fantasy p
                  WHERE p.db_name IS NOT DISTINCT FROM r.db_name
                    AND p.year IS NOT DISTINCT FROM r.year
                    AND p.week IS NOT DISTINCT FROM r.week
                    AND p.NFL_player_id IS NOT DISTINCT FROM r.NFL_player_id
                    AND p.manager IS NOT DISTINCT FROM r.manager
                )
              """).fetchone()[0])
              distinct=int(con.execute(f"SELECT COUNT(*) FROM (SELECT DISTINCT {', '.join(key)} FROM read_parquet('{path}'))").fetchone()[0])
              rows.append({'artifact_id':item['artifact_id'],'source_kind':source_kind,'source_player_rows':total,'distinct_player_keys':distinct,'matched_source_rows':matched})
              continue
            if source_kind == 'canonical_player_snapshot':
              key=['db_name','year','week','NFL_player_id']
              if not set(key) <= columns:
                raise SystemExit(f"{item['artifact_id']}: missing canonical snapshot player key columns")
              total=int(con.execute(f"SELECT COUNT(*) FROM read_parquet('{path}')").fetchone()[0])
              distinct=int(con.execute(f"SELECT COUNT(*) FROM (SELECT DISTINCT {', '.join(key)} FROM read_parquet('{path}'))").fetchone()[0])
              manager_guard=("AND (r.manager IS NULL OR p.manager IS NOT DISTINCT FROM r.manager)" if 'manager' in columns else '')
              platform_guard=("AND (r.platform IS NULL OR LOWER(CAST(p.platform AS VARCHAR)) IS NOT DISTINCT FROM LOWER(CAST(r.platform AS VARCHAR)))" if 'platform' in columns else '')
              profile=con.execute(f"""
                WITH source_rows AS (
                  SELECT *, ROW_NUMBER() OVER () AS source_row_id
                  FROM read_parquet('{path}')
                ), resolution AS (
                  SELECT r.source_row_id, COUNT(p.rowid) AS canonical_matches
                  FROM source_rows r LEFT JOIN public.player_fantasy p
                    ON p.db_name IS NOT DISTINCT FROM r.db_name
                   AND p.year IS NOT DISTINCT FROM r.year
                   AND p.week IS NOT DISTINCT FROM r.week
                   AND p.NFL_player_id IS NOT DISTINCT FROM r.NFL_player_id
                   {manager_guard} {platform_guard}
                  GROUP BY r.source_row_id
                )
                SELECT
                  SUM(CASE WHEN canonical_matches=1 THEN 1 ELSE 0 END),
                  SUM(CASE WHEN canonical_matches=0 THEN 1 ELSE 0 END),
                  SUM(CASE WHEN canonical_matches>1 THEN 1 ELSE 0 END)
                FROM resolution
              """).fetchone()
              rows.append({
                'artifact_id':item['artifact_id'], 'source_kind':source_kind,
                'source_player_rows':total, 'distinct_player_keys':distinct,
                'unique_canonical_matches':int(profile[0] or 0),
                'zero_canonical_matches':int(profile[1] or 0),
                'ambiguous_canonical_matches':int(profile[2] or 0),
              })
              continue
            available={name: clause for name, clause in strategies.items() if (
              (name=='team_key_to_team_key' and {'team_key'} <= columns) or
              (name=='mfl_manager_guid_to_team_key' and {'platform','manager_guid'} <= columns) or
              (name=='manager_to_manager' and {'manager'} <= columns) or
              (name=='manager_team_name' and {'manager','team_name'} <= columns)
            )}
            counts={}
            for name, clause in available.items():
              counts[name]=int(con.execute(f"""
                SELECT COUNT(*)
                FROM read_parquet('{path}') r
                WHERE EXISTS (
                  SELECT 1 FROM public.player_fantasy p
                  WHERE p.db_name IS NOT DISTINCT FROM r.db_name
                    AND p.year IS NOT DISTINCT FROM r.year
                    AND p.week IS NOT DISTINCT FROM r.week
                    AND {clause}
                )
              """).fetchone()[0])
            total=int(con.execute(f"SELECT COUNT(*) FROM read_parquet('{path}')").fetchone()[0])
            rows.append({'artifact_id':item['artifact_id'],'source_team_rows':total,'matched_source_rows':counts})
          con.close()
          Path('raw_signal_join_key_profile.json').write_text(json.dumps(rows, indent=2)+'\n')
          print(json.dumps(rows, sort_keys=True))
          PY
      - name: Read back source cells through canonical identity
        env:
          SOURCE_KIND: ${{ inputs.source_kind }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$SOURCE_KIND" = "team" ]; then
            args+=(--team-signal-manifest raw_source_manifest.json)
          elif [ "$SOURCE_KIND" = "structured_player" ]; then
            args+=(--structured-player-manifest raw_source_manifest.json)
          elif [ "$SOURCE_KIND" = "canonical_player_snapshot" ]; then
            args+=(--canonical-snapshot-manifest raw_source_manifest.json)
          else
            echo "unsupported source kind: $SOURCE_KIND" >&2
            exit 2
          fi
          python scripts/research_cohorts/finalize_artifact_cache_receipts.py \
            --ledger ledger_receipt_input.json \
            --prior-receipts prior_receipts_input.json \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out final_artifact_cache_receipts.json "${args[@]}"
      - name: Fail fast on cache, schema, row, or ops mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          before=json.loads(Path('prestate.json').read_text())
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          assert [r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()] == before['schema']
          assert int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]) == before['rows']
          con.close()
          digest=hashlib.sha256()
          with Path('research_public_lake/ops_cache.duckdb').open('rb') as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b''):
                  digest.update(block)
          assert digest.hexdigest() == Path('ops_before.sha256').read_text().split()[0]
          receipt=json.loads(Path('final_artifact_cache_receipts.json').read_text())
          assert receipt['summary']['ledger_rows']==9479
          assert receipt['summary']['cache_mutated'] is False
          assert receipt['summary']['new_lineage'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-raw-signal-cache-readback-${{ github.run_id }}
          path: |
            final_artifact_cache_receipts.json
            selected_artifacts.json
            raw_source_manifest.json
            raw_signal_join_key_profile.json
            prestate.json
            ops_before.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
