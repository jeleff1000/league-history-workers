name: Materialize fixed artifact promotion candidates

on:
  workflow_dispatch:
    inputs:
      specmap_run_id:
        description: Successful read-only fixed spec-map run
        required: true
        default: '31767522882'
      shard_count:
        description: Deterministic source-artifact download/materialization shards (1-256)
        required: true
        default: '256'

permissions:
  actions: read
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      data_artifacts: ${{ steps.build.outputs.data_artifacts }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-promotion-specmap-${{ inputs.specmap_run_id }}
          path: specmap
          repository: ${{ github.repository }}
          run-id: ${{ inputs.specmap_run_id }}
          github-token: ${{ github.token }}
      - id: build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os
          from pathlib import Path

          shard_count=int('${{ inputs.shard_count }}')
          if not 1 <= shard_count <= 256:
              raise SystemExit(f'invalid shard count: {shard_count}')
          rows=list(csv.DictReader(Path('specmap/artifact_promotion_specmap.csv').open(newline='', encoding='utf-8')))
          ids={int(row['artifact_id']) for row in rows if row['source_grain'] in {
              'player_week','team_week','team_week_manager','league_year_settings'
          } and row['source_to_target_columns']}
          if not ids:
              raise SystemExit('spec map has no data-bearing source artifacts')
          raw=json.loads(Path('audit_manifests/research_matchup_artifact_manifest_20260809.json').read_text())['artifacts']
          sources=[item for item in raw if int(item['artifact_id']) in ids]
          if len(sources) != len(ids):
              missing=sorted(ids-{int(item['artifact_id']) for item in sources})
              raise SystemExit(f'spec-map artifacts missing from frozen manifest: {missing[:10]}')
          buckets=[[] for _ in range(shard_count)]
          sizes=[0]*shard_count
          for item in sorted(sources, key=lambda row: (-int(row.get('size_in_bytes',0)), int(row['artifact_id']))):
              index=min(range(shard_count), key=lambda i:(sizes[i],len(buckets[i]),i))
              buckets[index].append(item)
              sizes[index]+=int(item.get('size_in_bytes',0))
          payload={'specmap_run_id':'${{ inputs.specmap_run_id }}','data_artifact_ids':sorted(ids),'buckets':buckets}
          Path('candidate_manifest.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('matrix='+json.dumps(list(range(shard_count)),separators=(',',':'))+'\n')
              output.write(f'data_artifacts={len(ids)}\n')
          print(json.dumps({'artifact_ids_total':9479,'data_artifacts':len(ids),'shard_count':shard_count,'bucket_sizes':sizes},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-artifact-candidate-manifest-${{ github.run_id }}
          path: |
            candidate_manifest.json
            specmap/artifact_promotion_specmap.csv
            specmap/artifact_promotion_specmap_receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  materialize:
    needs: manifest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard_index: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-candidate-manifest-${{ github.run_id }}
          path: input
      - name: Download frozen source artifacts and materialize source-backed candidate cells
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_INDEX: ${{ matrix.shard_index }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/candidates out/receipts raw
          python - <<'PY'
          import json, os, random, shutil, subprocess, sys, time, urllib.error, urllib.request, zipfile
          from pathlib import Path

          root=Path('raw')
          out=Path('out')
          payload=json.loads(Path('input/candidate_manifest.json').read_text())
          items=payload['buckets'][int(os.environ['SHARD_INDEX'])]
          class NoAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return urllib.request.Request(newurl, headers={'Accept':'application/octet-stream'})
          opener=urllib.request.build_opener(NoAuthRedirect)
          for item in items:
              artifact_id=str(item['artifact_id'])
              target=root/artifact_id
              receipt=out/'receipts'/f'{artifact_id}.json'
              try:
                  target.mkdir(parents=True,exist_ok=True)
                  archive=target/'artifact.zip'
                  request=urllib.request.Request(item['archive_download_url'],headers={
                      'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                  })
                  for attempt in range(8):
                      try:
                          with opener.open(request,timeout=300) as response, archive.open('wb') as handle:
                              shutil.copyfileobj(response,handle)
                          break
                      except urllib.error.HTTPError as exc:
                          if exc.code not in {403,429,500,502,503,504} or attempt == 7:
                              raise
                          retry_after=exc.headers.get('Retry-After')
                          delay=float(retry_after) if retry_after else min(120.0,10.0*(2**attempt))
                          time.sleep(delay+random.uniform(0,3))
                  with zipfile.ZipFile(archive) as bundle:
                      bundle.extractall(target/'unzipped')
                  archive.unlink()
                  subprocess.run([
                      sys.executable,'scripts/research_cohorts/materialize_artifact_candidate_cells.py',
                      '--specmap','input/artifact_promotion_specmap.csv',
                      '--source-root',str(target/'unzipped'),'--artifact-id',artifact_id,
                      '--out-parquet',str(out/'candidates'/f'{artifact_id}.parquet'),
                      '--out-receipt',str(receipt),
                  ],check=True)
              except Exception as exc:
                  receipt.write_text(json.dumps({
                      'artifact_id':artifact_id,'files':[], 'candidate_cells':0,
                      'cache_mutated':False,'new_lineage':False,
                      'materialization_status':'source_artifact_download_or_parse_failed',
                      'reason':f'{type(exc).__name__}: {exc}',
                  },indent=2,sort_keys=True)+'\n')
              finally:
                  shutil.rmtree(target,ignore_errors=True)
          (out/'shard.json').write_text(json.dumps({
              'shard_index':int(os.environ['SHARD_INDEX']),
              'selected_artifacts':len(items),'cache_mutated':False,'new_lineage':False,
          },indent=2,sort_keys=True)+'\n')
          print(json.dumps({'shard_index':int(os.environ['SHARD_INDEX']),'selected_artifacts':len(items),'cache_mutated':False,'new_lineage':False},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-artifact-candidate-cells-${{ github.run_id }}-${{ matrix.shard_index }}
          path: out
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  aggregate:
    needs: [manifest, materialize]
    if: ${{ always() && needs.manifest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - uses: actions/download-artifact@v5
        with:
          pattern: research-artifact-candidate-cells-${{ github.run_id }}-*
          path: shards
          merge-multiple: false
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-candidate-manifest-${{ github.run_id }}
          path: manifest
      - name: Build candidate manifest receipt without opening any cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.research_cohorts.aggregate_artifact_candidate_cells import aggregate_candidate_cells

          manifest=json.loads(Path('manifest/candidate_manifest.json').read_text())
          summary=aggregate_candidate_cells(
              shard_root=Path('shards'),
              expected_artifact_ids=manifest['data_artifact_ids'],
              out_parquet=Path('artifact_candidate_cells.parquet'),
          )
          Path('artifact_candidate_cells_receipt.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          if not summary['receipt_coverage_complete']:
              raise SystemExit(
                  'candidate receipt coverage failed: '
                  f"missing={summary['missing_artifact_ids'][:20]} "
                  f"unexpected={summary['unexpected_artifact_ids'][:20]}"
              )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-artifact-candidate-cells-complete-${{ github.run_id }}
          path: |
            artifact_candidate_cells.parquet
            artifact_candidate_cells_receipt.json
            shards/**/receipts/*.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
