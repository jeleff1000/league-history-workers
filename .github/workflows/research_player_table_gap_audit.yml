name: Audit player-table gaps

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - name: Run player-table-only audit
        run: |
          python code/scripts/research_cohorts/audit_player_table_gaps.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --out player_table_gap_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-player-table-gap-audit
          path: player_table_gap_audit.json
