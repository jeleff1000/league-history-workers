name: Aggregate existing artifact candidate cells

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed candidate-materialization run whose shard artifacts will be assembled
        required: true
        default: '31769208198'

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - name: Download every candidate shard artifact with pagination
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil, urllib.request, zipfile
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          run_id=os.environ['CANDIDATE_RUN_ID']
          prefix=f'research-artifact-candidate-cells-{run_id}-'
          token=os.environ['GH_TOKEN']
          artifacts=[]
          page=1
          while True:
              request=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}',
                  headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request,timeout=120) as response:
                  batch=json.load(response).get('artifacts',[])
              if not batch:
                  break
              artifacts.extend(item for item in batch if item['name'].startswith(prefix))
              page += 1

          class NoAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return urllib.request.Request(newurl, headers={'Accept':'application/octet-stream'})
          opener=urllib.request.build_opener(NoAuthRedirect)
          root=Path('shards')
          root.mkdir()
          failures=[]
          for item in sorted(artifacts,key=lambda value:value['name']):
              target=root/item['name']
              archive=target.with_suffix('.zip')
              try:
                  request=urllib.request.Request(
                      item['archive_download_url'],
                      headers={'Authorization':f'Bearer {token}','Accept':'application/octet-stream'},
                  )
                  with opener.open(request,timeout=300) as response, archive.open('wb') as handle:
                      shutil.copyfileobj(response,handle)
                  target.mkdir()
                  with zipfile.ZipFile(archive) as bundle:
                      bundle.extractall(target)
              except Exception as exc:
                  failures.append({'artifact_id':item['id'],'artifact_name':item['name'],'reason':f'{type(exc).__name__}: {exc}'})
              finally:
                  archive.unlink(missing_ok=True)
          receipt={
              'candidate_run_id':run_id,
              'pages_read':page-1,
              'candidate_shard_artifacts_found':len(artifacts),
              'candidate_shard_artifact_names':[item['name'] for item in sorted(artifacts,key=lambda value:value['name'])],
              'download_failures':failures,
              'cache_mutated':False,
              'new_lineage':False,
          }
          Path('candidate_shard_download_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'candidate_shard_artifacts_found':len(artifacts),'download_failures':len(failures),'cache_mutated':False,'new_lineage':False},sort_keys=True))
          PY
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-candidate-manifest-${{ inputs.candidate_run_id }}
          path: manifest
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Build read-only candidate receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.research_cohorts.aggregate_artifact_candidate_cells import aggregate_candidate_cells

          manifest=json.loads(Path('manifest/candidate_manifest.json').read_text())
          summary=aggregate_candidate_cells(
              shard_root=Path('shards'),
              expected_artifact_ids=manifest['data_artifact_ids'],
              out_parquet=Path('artifact_candidate_cells.parquet'),
          )
          download_receipt=json.loads(Path('candidate_shard_download_receipt.json').read_text())
          summary['candidate_shard_download']=download_receipt
          if download_receipt['download_failures']:
              summary['receipt_coverage_complete']=False
          Path('artifact_candidate_cells_receipt.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-artifact-candidate-cells-complete-${{ github.run_id }}
          path: |
            artifact_candidate_cells.parquet
            artifact_candidate_cells_receipt.json
            candidate_shard_download_receipt.json
            shards/**/receipts/*.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Fail after publishing incomplete coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('artifact_candidate_cells_receipt.json').read_text())
          if not receipt['receipt_coverage_complete']:
              raise SystemExit(
                  'candidate receipt coverage failed: '
                  f"missing={receipt['missing_artifact_ids'][:20]} "
                  f"unexpected={receipt['unexpected_artifact_ids'][:20]}"
              )
          if receipt['cache_mutated'] or receipt['new_lineage']:
              raise SystemExit('immutable candidate aggregate violated cache/lineage guard')
          print('candidate coverage receipt complete; no cache opened or mutated')
          PY
