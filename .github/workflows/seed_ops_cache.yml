name: Seed Ops Cache

# One-off/manual publisher for the shared ___ops DuckDB cache.
# Import workflows are restore-only consumers of this cache.

on:
  workflow_dispatch:
    inputs:
      cache_version:
        description: 'Must match OPS_CACHE_VERSION used by import workflows. Bump to replace immutable caches.'
        required: true
        type: string
        default: 'manual-v1'
      yahoo_oauth_ref:
        description: 'yahoo_oauth branch/ref to check out'
        required: false
        type: string
        default: 'main'

permissions:
  actions: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.yahoo_oauth_ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check existing cache key
        id: existing-cache
        uses: actions/cache/restore@v4
        with:
          path: ops_cache
          key: ops-cache-v4-${{ runner.os }}-${{ inputs.cache_version }}-${{ hashFiles('fantasy_football_data_scripts/build_ops_cache.py') }}
          lookup-only: true

      - name: Stop if cache key already exists
        if: steps.existing-cache.outputs.cache-hit == 'true'
        run: |
          echo "Ops cache already exists for cache_version=${{ inputs.cache_version }}."
          echo "GitHub Actions caches are immutable; bump OPS_CACHE_VERSION and rerun to publish a replacement."

      - name: Build ops cache from Fly
        if: steps.existing-cache.outputs.cache-hit != 'true'
        env:
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          pip install duckdb==1.5.1 pandas
          python fantasy_football_data_scripts/build_ops_cache.py \
            --output ops_cache/ops_cache.duckdb

      - name: Overlay committed ops parquets
        if: steps.existing-cache.outputs.cache-hit != 'true'
        run: |
          python fantasy_football_data_scripts/overlay_ops_cache_from_parquet.py \
            --cache ops_cache/ops_cache.duckdb

      - name: Validate ops cache
        if: steps.existing-cache.outputs.cache-hit != 'true'
        run: |
          test -s ops_cache/ops_cache.duckdb
          python - <<'PYEOF'
          import duckdb

          required = [
              ("nfl_historical", "nfl_player_stats_all"),
              ("nfl_historical", "player_bio"),
              ("public", "yahoo_nfl_player_map"),
              ("public", "sleeper_nfl_player_map"),
              ("public", "espn_nfl_player_map"),
          ]
          conn = duckdb.connect("ops_cache/ops_cache.duckdb", read_only=True)
          try:
              for schema, table in required:
                  count = conn.execute(f"SELECT COUNT(*) FROM {schema}.{table}").fetchone()[0]
                  if count <= 0:
                      raise SystemExit(f"{schema}.{table} is empty")
                  print(f"{schema}.{table}: {count:,} rows")
          finally:
              conn.close()
          PYEOF
          ls -lh ops_cache/ops_cache.duckdb

      - name: Save ops cache
        if: steps.existing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ops_cache
          key: ops-cache-v4-${{ runner.os }}-${{ inputs.cache_version }}-${{ hashFiles('fantasy_football_data_scripts/build_ops_cache.py') }}
