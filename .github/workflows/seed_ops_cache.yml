name: Seed Ops Cache

# One-off/manual publisher for the two-table shared ___ops DuckDB cache.
# Import workflows only download and verify this release asset.

on:
  workflow_dispatch:
    inputs:
      yahoo_oauth_ref:
        description: 'yahoo_oauth branch/ref to check out'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.yahoo_oauth_ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download current ops cache if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ops_cache
          gh release download ops-cache \
            --repo jeleff1000/league-history-workers \
            --pattern ops_cache.duckdb \
            --dir ops_cache \
            --clobber || true

      - name: Upsert ops cache from Fly
        env:
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          pip install duckdb==1.5.1 pandas
          python fantasy_football_data_scripts/build_ops_cache.py \
            --output ops_cache/ops_cache.duckdb \
            --update-existing

      - name: Validate ops cache
        run: |
          test -s ops_cache/ops_cache.duckdb
          python - <<'PYEOF'
          import duckdb

          required = [
              ("nfl_historical", "nfl_player_stats_all"),
              ("nfl_historical", "player_bio"),
          ]
          conn = duckdb.connect("ops_cache/ops_cache.duckdb", read_only=True)
          try:
              for schema, table in required:
                  count = conn.execute(f"SELECT COUNT(*) FROM {schema}.{table}").fetchone()[0]
                  if count <= 0:
                      raise SystemExit(f"{schema}.{table} is empty")
                  print(f"{schema}.{table}: {count:,} rows")
              data_tables = {
                  (schema, table)
                  for schema, table in conn.execute("""
                      SELECT table_schema, table_name
                      FROM information_schema.tables
                      WHERE table_type = 'BASE TABLE'
                        AND table_schema != 'main'
                      ORDER BY table_schema, table_name
                  """).fetchall()
              }
              extra = data_tables - set(required)
              if extra:
                  raise SystemExit(f"Unexpected data tables in ops cache: {sorted(extra)}")
          finally:
              conn.close()
          PYEOF
          ls -lh ops_cache/ops_cache.duckdb

      - name: Publish stable ops cache release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ops-cache --repo jeleff1000/league-history-workers >/dev/null 2>&1 || \
            gh release create ops-cache \
              --repo jeleff1000/league-history-workers \
              --title "Ops Cache" \
              --notes "Stable prebuilt ops_cache.duckdb for import workers."

          gh release upload ops-cache ops_cache/ops_cache.duckdb \
            --repo jeleff1000/league-history-workers \
            --clobber
