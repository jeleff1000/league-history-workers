name: Seed Ops Cache

# Resumable publisher for the two-table ___ops DuckDB cache.
# Checkpoint caches survive failed runs; import workflows consume the newest
# validated immutable generation cache.

on:
  workflow_dispatch:
    inputs:
      yahoo_oauth_ref:
        description: 'yahoo_oauth branch/ref to check out'
        required: false
        type: string
        default: 'main'

permissions:
  actions: write
  contents: read

env:
  CHECKPOINT_CACHE_PREFIX: ops-cache-checkpoint-v3-Linux-

jobs:
  checkpoint:
    name: Checkpoint ${{ matrix.batch_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Two independent checkpoint downloads are safe; higher fan-out caused
      # Fly's DuckDB API to return 503/504s during the previous rebuild.
      max-parallel: 2
      matrix:
        include:
          - batch_id: nfl_player_stats_all-batch-00
          - batch_id: nfl_player_stats_all-batch-01
          - batch_id: nfl_player_stats_all-batch-02
          - batch_id: nfl_player_stats_all-batch-03
          - batch_id: nfl_player_stats_all-batch-04
          - batch_id: nfl_player_stats_all-batch-05
          - batch_id: nfl_player_stats_all-batch-06
          - batch_id: nfl_player_stats_all-batch-07
          - batch_id: nfl_player_stats_all-batch-08
          - batch_id: nfl_player_stats_all-batch-09
          - batch_id: nfl_player_stats_all-batch-10
          - batch_id: nfl_player_stats_all-batch-11
          - batch_id: nfl_player_stats_all-batch-12
          - batch_id: nfl_player_stats_all-batch-13
          - batch_id: nfl_player_stats_all-batch-14
          - batch_id: nfl_player_stats_all-batch-15
          - batch_id: nfl_player_stats_all-batch-16
          - batch_id: nfl_player_stats_all-batch-17
          - batch_id: nfl_player_stats_all-batch-18
          - batch_id: nfl_player_stats_all-batch-19
          - batch_id: nfl_player_stats_all-batch-20
          - batch_id: nfl_player_stats_all-batch-21
          - batch_id: nfl_player_stats_all-batch-22
          - batch_id: nfl_player_stats_all-batch-23
          - batch_id: nfl_player_stats_all-batch-24
          - batch_id: nfl_player_stats_all-batch-25
          - batch_id: nfl_player_stats_all-batch-26
          - batch_id: nfl_player_stats_all-batch-27
          - batch_id: nfl_player_stats_all-batch-28
          - batch_id: nfl_player_stats_all-batch-29
          - batch_id: nfl_player_stats_all-batch-30
          - batch_id: nfl_player_stats_all-batch-31
          - batch_id: nfl_player_stats_all-batch-32
          - batch_id: nfl_player_stats_all-batch-33
          - batch_id: nfl_player_stats_all-batch-34
          - batch_id: nfl_player_stats_all-batch-35
          - batch_id: nfl_player_stats_all-batch-36
          - batch_id: nfl_player_stats_all-batch-37
          - batch_id: nfl_player_stats_all-batch-38
          - batch_id: nfl_player_stats_all-batch-39
          - batch_id: nfl_player_stats_all-batch-40
          - batch_id: nfl_player_stats_all-batch-41
          - batch_id: nfl_player_stats_all-batch-42
          - batch_id: nfl_player_stats_all-batch-43
          - batch_id: nfl_player_stats_all-batch-44
          - batch_id: nfl_player_stats_all-batch-45
          - batch_id: nfl_player_stats_all-batch-46
          - batch_id: nfl_player_stats_all-batch-47
          - batch_id: nfl_player_stats_all-batch-48
          - batch_id: nfl_player_stats_all-batch-49
          - batch_id: nfl_player_stats_all-batch-50
          - batch_id: nfl_player_stats_all-batch-51
          - batch_id: nfl_player_stats_all-batch-52
          - batch_id: nfl_player_stats_all-batch-53
          - batch_id: nfl_player_stats_all-batch-54
          - batch_id: player_bio-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.yahoo_oauth_ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore checkpoint
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ matrix.batch_id }}

      - name: Download or reuse checkpoint
        id: download
        env:
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          pip install duckdb==1.5.1 pandas
          succeeded=false
          for attempt in 1 2 3; do
            echo "[ops-cache] checkpoint attempt $attempt/3"
            if python fantasy_football_data_scripts/build_ops_cache.py \
              --output ops_cache/unused.duckdb \
              --checkpoint-dir ops_cache/checkpoints \
              --batch-id '${{ matrix.batch_id }}' \
              --status-file ops_cache/checkpoints/${{ matrix.batch_id }}.status.json; then
              succeeded=true
              break
            fi
            if [ "$attempt" != 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "$succeeded" != true ]; then
            echo "[ops-cache] checkpoint failed after 3 attempts"
            exit 1
          fi
          reused=$(python -c "import json; print(str(json.load(open('ops_cache/checkpoints/${{ matrix.batch_id }}.status.json'))['reused']).lower())")
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Replace invalid checkpoint cache
        if: steps.download.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: |
          key="${CHECKPOINT_CACHE_PREFIX}${{ matrix.batch_id }}"
          gh cache list --repo jeleff1000/league-history-workers --key "$key" --json id |
            jq -r '.[].id' |
            while read -r id; do
              [ -z "$id" ] || gh api --method DELETE "/repos/jeleff1000/league-history-workers/actions/caches/$id"
            done

      - name: Save checkpoint
        if: steps.download.outputs.reused != 'true'
        uses: actions/cache/save@v5
        with:
          path: ops_cache/checkpoints
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ matrix.batch_id }}

  assemble:
    name: Assemble and publish ops cache
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPS_CACHE_PREFIX: ops-cache-v5-Linux-manual-
      OPS_CACHE_KEY: ops-cache-v5-Linux-manual-${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
