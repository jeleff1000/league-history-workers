name: Seed Ops Cache

# Resumable publisher for the two-table ___ops DuckDB cache.
# Checkpoint caches survive failed runs; import workflows consume the newest
# validated immutable generation cache.

on:
  workflow_dispatch:
    inputs:
      yahoo_oauth_ref:
        description: 'yahoo_oauth branch/ref to check out'
        required: false
        type: string
        default: 'main'

permissions:
  actions: write
  contents: read

env:
  CHECKPOINT_CACHE_PREFIX: ops-cache-checkpoint-v4-Linux-

jobs:
  checkpoint:
    name: Checkpoint ${{ matrix.batch_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The single Fly DuckDB machine can spend 10-30 seconds on metadata
      # scans; serialize cold-cache batches to keep health checks responsive.
      max-parallel: 2
      matrix:
        include:
          - batch_id: nfl_player_stats_all-batch-00
