name: Seed Ops Cache

# Standalone/manual publisher for the two-table ___ops DuckDB cache.
# Import workflows only restore this GitHub Actions cache and read it.

on:
  workflow_dispatch:
    inputs:
      yahoo_oauth_ref:
        description: 'yahoo_oauth branch/ref to check out'
        required: false
        type: string
        default: 'main'

permissions:
  actions: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPS_CACHE_KEY: ops-cache-v4-Linux-manual-v1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.yahoo_oauth_ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore current ops cache
        id: ops-cache
        uses: actions/cache/restore@v5
        with:
          path: ops_cache
          key: ${{ env.OPS_CACHE_KEY }}

      - name: Log seed context
        run: |
          echo "[ops-cache] key=${OPS_CACHE_KEY}"
          echo "[ops-cache] restore-hit=${{ steps.ops-cache.outputs.cache-hit }}"
          echo "[ops-cache] github-run-id=${{ github.run_id }}"
          echo "[ops-cache] yahoo_oauth_ref=${{ github.event.inputs.yahoo_oauth_ref || 'main' }}"
          echo "[ops-cache] yahoo_oauth_sha=$(git rev-parse HEAD)"
          if [ -s ops_cache/ops_cache.duckdb ]; then
            echo "[ops-cache] existing-size-bytes=$(stat -c%s ops_cache/ops_cache.duckdb)"
            echo "[ops-cache] existing-size-human=$(du -h ops_cache/ops_cache.duckdb | cut -f1)"
            python -c 'import duckdb; conn = duckdb.connect("ops_cache/ops_cache.duckdb", read_only=True); print("[ops-cache] existing-cache-readable=true"); conn.close()'
          else
            echo "[ops-cache] existing-cache-file=missing"
          fi

      - name: Upsert ops cache from Fly
        env:
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          pip install duckdb==1.5.1 pandas
          python fantasy_football_data_scripts/build_ops_cache.py \
            --output ops_cache/ops_cache.duckdb \
            --update-existing

      - name: Validate ops cache
        run: |
          test -s ops_cache/ops_cache.duckdb
          python - <<'PYEOF'
          import duckdb

          required = [
              ("nfl_historical", "nfl_player_stats_all"),
              ("nfl_historical", "player_bio"),
          ]
          conn = duckdb.connect("ops_cache/ops_cache.duckdb", read_only=True)
          try:
              for schema, table in required:
                  count = conn.execute(f"SELECT COUNT(*) FROM {schema}.{table}").fetchone()[0]
                  if count <= 0:
                      raise SystemExit(f"{schema}.{table} is empty")
                  print(f"{schema}.{table}: {count:,} rows")
              data_tables = {
                  (schema, table)
                  for schema, table in conn.execute("""
                      SELECT table_schema, table_name
                      FROM information_schema.tables
                      WHERE table_type = 'BASE TABLE'
                        AND table_schema != 'main'
                      ORDER BY table_schema, table_name
                  """).fetchall()
              }
              extra = data_tables - set(required)
              if extra:
                  raise SystemExit(f"Unexpected data tables in ops cache: {sorted(extra)}")
          finally:
              conn.close()
          PYEOF
          echo "[ops-cache] final-size-bytes=$(stat -c%s ops_cache/ops_cache.duckdb)"
          echo "[ops-cache] final-size-human=$(du -h ops_cache/ops_cache.duckdb | cut -f1)"
          echo "[ops-cache] final-sha256=$(sha256sum ops_cache/ops_cache.duckdb | awk '{print $1}')"
          ls -lh ops_cache/ops_cache.duckdb

      - name: Delete previous ops cache key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh cache list \
            --repo jeleff1000/league-history-workers \
            --key "$OPS_CACHE_KEY" \
            --json id \
            --jq '.[].id')"
          if [ -z "$ids" ]; then
            echo "[ops-cache] previous-cache-ids=none"
          fi
          for id in $ids; do
            echo "[ops-cache] deleting-previous-cache-id=${id}"
            gh cache delete "$id" \
              --repo jeleff1000/league-history-workers \
              --confirm
          done

      - name: Save ops cache
        uses: actions/cache/save@v5
        with:
          path: ops_cache
          key: ${{ env.OPS_CACHE_KEY }}

      - name: Log saved ops cache key
        run: |
          echo "[ops-cache] saved-key=${OPS_CACHE_KEY}"
