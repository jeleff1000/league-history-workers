name: Seed Ops Cache

# Resumable publisher for the two-table ___ops DuckDB cache.
# Checkpoint caches survive failed runs; import workflows consume the newest
# validated immutable generation cache.

on:
  workflow_dispatch:
    inputs:
      yahoo_oauth_ref:
        description: 'yahoo_oauth branch/ref to check out'
        required: false
        type: string
        default: 'main'

permissions:
  actions: write
  contents: read

env:
  CHECKPOINT_CACHE_PREFIX: ops-cache-checkpoint-v1-Linux-

jobs:
  checkpoint:
    name: Checkpoint ${{ matrix.batch_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Two independent checkpoint downloads are safe; higher fan-out caused
      # Fly's DuckDB API to return 503/504s during the previous rebuild.
      max-parallel: 2
      matrix:
        include:
          - batch_id: nfl_player_stats_all-batch-00
          - batch_id: nfl_player_stats_all-batch-01
          - batch_id: nfl_player_stats_all-batch-02
          - batch_id: nfl_player_stats_all-batch-03
          - batch_id: nfl_player_stats_all-batch-04
          - batch_id: nfl_player_stats_all-batch-05
          - batch_id: nfl_player_stats_all-batch-06
          - batch_id: nfl_player_stats_all-batch-07
          - batch_id: nfl_player_stats_all-batch-08
          - batch_id: nfl_player_stats_all-batch-09
          - batch_id: nfl_player_stats_all-batch-10
          - batch_id: player_bio-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.yahoo_oauth_ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore checkpoint
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ matrix.batch_id }}

      - name: Download or reuse checkpoint
        id: download
        env:
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          pip install duckdb==1.5.1 pandas
          succeeded=false
          for attempt in 1 2 3; do
            echo "[ops-cache] checkpoint attempt $attempt/3"
            if python fantasy_football_data_scripts/build_ops_cache.py \
              --output ops_cache/unused.duckdb \
              --checkpoint-dir ops_cache/checkpoints \
              --batch-id '${{ matrix.batch_id }}' \
              --status-file ops_cache/checkpoints/${{ matrix.batch_id }}.status.json; then
              succeeded=true
              break
            fi
            if [ "$attempt" != 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "$succeeded" != true ]; then
            echo "[ops-cache] checkpoint failed after 3 attempts"
            exit 1
          fi
          reused=$(python -c "import json; print(str(json.load(open('ops_cache/checkpoints/${{ matrix.batch_id }}.status.json'))['reused']).lower())")
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Replace invalid checkpoint cache
        if: steps.download.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: |
          key="${CHECKPOINT_CACHE_PREFIX}${{ matrix.batch_id }}"
          gh cache list --repo jeleff1000/league-history-workers --key "$key" --json id |
            jq -r '.[].id' |
            while read -r id; do
              [ -z "$id" ] || gh api --method DELETE "/repos/jeleff1000/league-history-workers/actions/caches/$id"
            done

      - name: Save checkpoint
        if: steps.download.outputs.reused != 'true'
        uses: actions/cache/save@v5
        with:
          path: ops_cache/checkpoints
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ matrix.batch_id }}

  assemble:
    name: Assemble and publish ops cache
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPS_CACHE_PREFIX: ops-cache-v5-Linux-manual-
      OPS_CACHE_KEY: ops-cache-v5-Linux-manual-${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ github.event.inputs.yahoo_oauth_ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore stats checkpoint 00
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-00
      - name: Restore stats checkpoint 01
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-01
      - name: Restore stats checkpoint 02
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-02
      - name: Restore stats checkpoint 03
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-03
      - name: Restore stats checkpoint 04
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-04
      - name: Restore stats checkpoint 05
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-05
      - name: Restore stats checkpoint 06
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-06
      - name: Restore stats checkpoint 07
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-07
      - name: Restore stats checkpoint 08
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-08
      - name: Restore stats checkpoint 09
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-09
      - name: Restore stats checkpoint 10
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-nfl_player_stats_all-batch-10
      - name: Restore player bio checkpoint
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v1-Linux-player_bio-all

      - name: Assemble checkpoints
        run: |
          pip install duckdb==1.5.1 pandas
          python fantasy_football_data_scripts/build_ops_cache.py \
            --output ops_cache/ops_cache.duckdb \
            --checkpoint-dir ops_cache/checkpoints \
            --assemble

      - name: Validate assembled cache
        run: |
          test -s ops_cache/ops_cache.duckdb
          python - <<'PYEOF'
          import duckdb
          conn = duckdb.connect("ops_cache/ops_cache.duckdb", read_only=True)
          try:
              for schema, table in (("nfl_historical", "nfl_player_stats_all"), ("nfl_historical", "player_bio")):
                  count = conn.execute(f"SELECT COUNT(*) FROM {schema}.{table}").fetchone()[0]
                  if count <= 0:
                      raise SystemExit(f"{schema}.{table} is empty")
                  print(f"{schema}.{table}: {count:,} rows")
          finally:
              conn.close()
          PYEOF
          echo "[ops-cache] final-size=$(du -h ops_cache/ops_cache.duckdb | cut -f1)"
          echo "[ops-cache] final-sha256=$(sha256sum ops_cache/ops_cache.duckdb | awk '{print $1}')"

      - name: Save immutable canonical generation
        uses: actions/cache/save@v5
        with:
          path: ops_cache/ops_cache.duckdb
          key: ${{ env.OPS_CACHE_KEY }}

      - name: Remove superseded canonical generations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: |
          gh cache list --repo jeleff1000/league-history-workers --key "$OPS_CACHE_PREFIX" --json id,key |
            jq -r --arg keep "$OPS_CACHE_KEY" '.[] | select(.key != $keep) | .id' |
            while read -r id; do
              [ -z "$id" ] || gh api --method DELETE "/repos/jeleff1000/league-history-workers/actions/caches/$id"
            done
          echo "[ops-cache] published=$OPS_CACHE_KEY"
