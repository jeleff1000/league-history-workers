name: MFL Sequential Quota Campaign

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: mfl-sequential-quota-campaign
  cancel-in-progress: false

# Reusable-workflow jobs hold no runner while waiting on `needs`. Each child
# discovery workflow still runs 256 shards with max-parallel=15.
jobs:
  window_2018_24000:
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "256"
      max_parallel: "15"
      start_year: "2018"
      end_year: "2018"
      id_start: "24000"
      id_end: "24999"
      request_sleep: "5.0"
    secrets: inherit

  window_2017_00000:
    needs: window_2018_24000
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "256"
      max_parallel: "15"
      start_year: "2017"
      end_year: "2017"
      id_start: "0"
      id_end: "9999"
      request_sleep: "5.0"
    secrets: inherit

  window_2018_25600:
    needs: window_2017_00000
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "256"
      max_parallel: "15"
      start_year: "2018"
      end_year: "2018"
      id_start: "25600"
      id_end: "29999"
      request_sleep: "5.0"
    secrets: inherit

  window_2015_2016_00000:
    needs: window_2018_25600
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "256"
      max_parallel: "15"
      start_year: "2015"
      end_year: "2016"
      id_start: "0"
      id_end: "9999"
      request_sleep: "5.0"
    secrets: inherit

