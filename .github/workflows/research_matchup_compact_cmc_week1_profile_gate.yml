name: Research matchup compact CMC cache pilot

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      mode:
        description: Immutable cache-only pilot scope
        required: true
        type: choice
        default: cmc_week1
        options:
          - cmc_week1
          - cmc_2025_all_grains
          - myles_2025_season
          - rb_2025_lane
          - rb_2025_week1_inventory
          - rb_2025_week1_distribution
          - local_cache_export

permissions:
  contents: read

jobs:
  cmc_cache_pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
          ref: 2d98750e59fa7f454ffb32170a532cccb4dfed06
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Build and validate exactly CMC 2025 week 1
        env:
          PYTHONPATH: ${{ github.workspace }}/code
          CACHE_KEY: ${{ inputs.cache_key }}
          PILOT_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import duckdb
          import os
          import resource
          from time import perf_counter
          from scripts.research_cohorts.compact_matchup_cells import (
              materialize_career_cohort_grade_cells,
              materialize_career_core_cohort_cells,
              materialize_season_bracket_grade_cells,
              materialize_season_bracket_grade_position_batch,
              materialize_season_core_cohort_cells,
              materialize_season_core_cohort_position_batch,
              materialize_weekly_core_cohort_cells,
          )

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          c.execute("""
            CREATE TEMP VIEW cached_regular_player_weeks AS
            SELECT DISTINCT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
              CAST(year AS INTEGER) AS year, CAST(week AS INTEGER) AS week
            FROM ops.nfl_historical.nfl_player_stats_all
            WHERE COALESCE(season_type, 'REG') = 'REG' AND week IS NOT NULL
          """)
          mode = os.environ['PILOT_MODE']
          if mode not in {'cmc_week1', 'cmc_2025_all_grains', 'myles_2025_season', 'rb_2025_lane', 'rb_2025_week1_inventory', 'rb_2025_week1_distribution', 'local_cache_export'}:
            raise ValueError(f'unsupported pilot mode: {mode}')
          if mode == 'local_cache_export':
              receipt = {
                'mode': mode,
                'cache_key': os.environ['CACHE_KEY'],
                'cache_path': 'research_public_lake',
                'operation': 'read_only_restore_then_single_transfer_bundle',
              }
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Immutable cache local diagnostic export\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- No cache save, source mutation, Fly access, API request, aggregation output, or publish step.\n')
              raise SystemExit(0)
          source_rows = c.execute("SELECT COUNT(*) FROM lake.public.player_fantasy WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1").fetchone()[0]
          if mode == 'rb_2025_week1_inventory':
              inventory = c.execute("""
                WITH rb AS (
                  SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                    CASE WHEN is_rostered IS NULL OR CAST(is_rostered AS INTEGER) <> 0 THEN 1 ELSE 0 END AS rostered
                  FROM lake.public.player_fantasy
                  WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
                    AND UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                )
                SELECT COUNT(DISTINCT NFL_player_id) AS distinct_rb_players,
                  COUNT(DISTINCT NFL_player_id) FILTER (WHERE rostered=1) AS rostered_rb_players,
                  COUNT(DISTINCT NFL_player_id) FILTER (WHERE rostered=0) AS explicitly_unrostered_rb_players
                FROM rb
              """).fetchone()
              receipt = {
                'mode': mode, 'source_rows_read': source_rows,
                'distinct_rb_players': inventory[0],
                'rostered_rb_players': inventory[1],
                'explicitly_unrostered_rb_players': inventory[2],
              }
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## RB 2025 week 1 immutable-cache inventory\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- Cache-only count; no aggregation table, cache save, Fly access, API request, artifact, or publish step.\n')
              raise SystemExit(0)
          if mode == 'rb_2025_week1_distribution':
              c.execute("""
                CREATE TEMP TABLE rb_week1_exposure AS
                SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                  COUNT(DISTINCT db_name) FILTER (
                    WHERE is_rostered IS NULL OR CAST(is_rostered AS INTEGER) <> 0
                  )::BIGINT AS rostered_leagues
                FROM lake.public.player_fantasy
                WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
                  AND UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                GROUP BY 1
              """)
              distribution = c.execute("""
                SELECT COUNT(*) AS distinct_rb_players,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 1) AS ge_1,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 5) AS ge_5,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 10) AS ge_10,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 25) AS ge_25,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 50) AS ge_50,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 100) AS ge_100,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 150) AS ge_150,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 500) AS ge_500,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 1000) AS ge_1000,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 5000) AS ge_5000,
                  MIN(rostered_leagues) AS min_leagues,
                  MAX(rostered_leagues) AS max_leagues
                FROM rb_week1_exposure
              """).fetchone()
              player_directory = """
                SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                  ANY_VALUE(CAST(player AS VARCHAR)) AS player,
                  ANY_VALUE(CAST(position AS VARCHAR)) AS stats_position
                FROM ops.nfl_historical.nfl_player_stats_all
                WHERE CAST(year AS INTEGER)=2025
                GROUP BY 1
              """
              lowest = c.execute(f"""
                SELECT e.NFL_player_id, d.player, d.stats_position, e.rostered_leagues
                FROM rb_week1_exposure e
                LEFT JOIN ({player_directory}) d USING (NFL_player_id)
                ORDER BY e.rostered_leagues, e.NFL_player_id
                LIMIT 20
              """).fetchall()
              highest = c.execute(f"""
                SELECT e.NFL_player_id, d.player, d.stats_position, e.rostered_leagues
                FROM rb_week1_exposure e
                LEFT JOIN ({player_directory}) d USING (NFL_player_id)
                ORDER BY e.rostered_leagues DESC, e.NFL_player_id
                LIMIT 20
              """).fetchall()
              receipt = {
                'mode': mode, 'distribution': distribution,
                'lowest_exposure': lowest, 'highest_exposure': highest,
              }
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## RB 2025 week 1 immutable-cache exposure distribution\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- Cache-only diagnostic; no aggregation output, cache save, Fly access, API request, artifact, or publish step.\n')
              raise SystemExit(0)
          started_at = perf_counter()
          materialize_weekly_core_cohort_cells(
              c,
              source_table='lake.public.player_fantasy',
              valid_player_weeks_table='cached_regular_player_weeks',
              output_table='cmc_week1',
              year=2025,
              week=1,
              player_id='00-0033280',
              split_threshold=150,
          )
          assert c.execute('SELECT COUNT(*) FROM cmc_week1').fetchone()[0] == 1
          full = c.execute("""
            SELECT cell.eligible_leagues, cell.rostered_leagues,
              cell.started_leagues, cell.valid_started_outcomes, cell.win_equivalent
            FROM cmc_week1, UNNEST(cohort_cells) AS u(cell)
            WHERE cell.q_teams='ALL' AND cell.q_roster='ALL'
              AND cell.q_scoring='ALL' AND cell.q_pass_td='ALL'
              AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'
          """).fetchone()
          raw_outcomes = c.execute("""
            SELECT CAST(win AS DOUBLE) AS win_value,
              COUNT(*) AS source_rows, COUNT(DISTINCT CAST(db_name AS VARCHAR)) AS leagues
            FROM lake.public.player_fantasy
            WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
              AND CAST(NFL_player_id AS VARCHAR)='00-0033280'
              AND CAST(is_started AS INTEGER)=1
            GROUP BY 1 ORDER BY 1
          """).fetchall()
          # Cache receipt: after league-level dedupe there are 9,600 starts,
          # 21 NULL outcomes, and therefore 9,579 valid [0,1] outcomes.
          assert full == (9838, 9768, 9600, 9579, 6019.0), (full, raw_outcomes)
          selected = c.execute("""
            WITH resolved AS (
              SELECT
                CASE WHEN cohort_profile.teams_12t_split=1 THEN '12t' ELSE 'ALL' END AS q_teams,
                CASE WHEN cohort_profile.roster_flx_split=1 THEN 'flx' ELSE 'ALL' END AS q_roster,
                CASE WHEN cohort_profile.scoring_half_split=1 THEN 'half' ELSE 'ALL' END AS q_scoring,
                CASE WHEN cohort_profile.pass_td_4pt_split=1 THEN '4pt' ELSE 'ALL' END AS q_pass_td,
                CASE WHEN cohort_profile.dynasty_redraft_split=1 THEN 'redraft' ELSE 'ALL' END AS q_dynasty,
                CASE WHEN cohort_profile.best_ball_managed_split=1 THEN 'managed' ELSE 'ALL' END AS q_best_ball,
                cohort_cells
              FROM cmc_week1
            )
            SELECT cell.eligible_leagues, cell.rostered_leagues, cell.started_leagues
            FROM resolved, UNNEST(cohort_cells) AS u(cell)
            WHERE cell.q_teams=resolved.q_teams AND cell.q_roster=resolved.q_roster
              AND cell.q_scoring=resolved.q_scoring AND cell.q_pass_td=resolved.q_pass_td
              AND cell.q_dynasty=resolved.q_dynasty AND cell.q_best_ball=resolved.q_best_ball
          """).fetchall()
          assert len(selected) == 1, selected
          assert selected[0][0] >= 150, selected
          elapsed_s = perf_counter() - started_at
          outer_rows = c.execute('SELECT COUNT(*) FROM cmc_week1').fetchone()[0]
          cell_count = c.execute('SELECT SUM(list_count(cohort_cells)) FROM cmc_week1').fetchone()[0]
          assert cell_count <= 145, cell_count
          peak_rss_kb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          receipt = {'source_rows_read': source_rows, 'outer_rows': outer_rows, 'nested_cells': cell_count, 'wall_seconds': round(elapsed_s, 3), 'peak_rss_kb': peak_rss_kb, 'cmc_2025_week_1_all': full, 'cmc_2025_week_1_selected': selected[0]}
          print(receipt)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## CMC W1 compact cache truth gate\n')
              summary.write(f'- Cache: `{os.environ.get("CACHE_KEY", "immutable input")}`\n')
              summary.write('- Source commit: `2d98750e59fa7f454ffb32170a532cccb4dfed06`\n')
              summary.write(f'- ALL cell: `{full}`\n- Selected cell: `{selected[0]}`\n')
              summary.write(f'- Source rows read: `{source_rows}`; outer rows: `{outer_rows}`; nested cells: `{cell_count}`\n')
              summary.write(f'- Build wall time: `{elapsed_s:.3f}s`; peak RSS: `{peak_rss_kb} KB`\n')

          if mode == 'cmc_2025_all_grains':
              stats = 'ops.nfl_historical.nfl_player_stats_all'
              source_rows_2025 = c.execute("""
                SELECT COUNT(*) FROM lake.public.player_fantasy
                WHERE CAST(year AS INTEGER)=2025
                  AND CAST(NFL_player_id AS VARCHAR)='00-0033280'
              """).fetchone()[0]
              full_started = perf_counter()
              materialize_weekly_core_cohort_cells(
                  c, source_table='lake.public.player_fantasy', output_table='cmc_2025_weekly',
                  valid_player_weeks_table='cached_regular_player_weeks',
                  year=2025, week=None, player_id='00-0033280', split_threshold=150,
              )
              weekly_weeks = [r[0] for r in c.execute(
                  'SELECT week FROM cmc_2025_weekly ORDER BY week'
              ).fetchall()]
              assert weekly_weeks == list(range(1, 14)) + list(range(15, 19)), weekly_weeks
              weekly_selected = c.execute("""
                SELECT COUNT(*)
                FROM cmc_2025_weekly, UNNEST(cohort_cells) AS u(cell)
                WHERE cell.q_teams=CASE WHEN cohort_profile.teams_12t_split=1 THEN '12t' ELSE 'ALL' END
                  AND cell.q_roster=CASE WHEN cohort_profile.roster_flx_split=1 THEN 'flx' ELSE 'ALL' END
                  AND cell.q_scoring=CASE WHEN cohort_profile.scoring_half_split=1 THEN 'half' ELSE 'ALL' END
                  AND cell.q_pass_td=CASE WHEN cohort_profile.pass_td_4pt_split=1 THEN '4pt' ELSE 'ALL' END
                  AND cell.q_dynasty=CASE WHEN cohort_profile.dynasty_redraft_split=1 THEN 'redraft' ELSE 'ALL' END
                  AND cell.q_best_ball=CASE WHEN cohort_profile.best_ball_managed_split=1 THEN 'managed' ELSE 'ALL' END
              """).fetchone()[0]
              weekly_cells = c.execute(
                  'SELECT COALESCE(SUM(list_count(cohort_cells)), 0) FROM cmc_2025_weekly'
              ).fetchone()[0]
              assert weekly_selected == 17, weekly_selected
              assert weekly_cells <= 17 * 145, weekly_cells

              materialize_season_core_cohort_cells(
                  c, source_table='lake.public.player_fantasy', nfl_stats_table=stats,
                  output_table='cmc_2025_season_core', year=2025, player_id='00-0033280',
                  split_threshold=50,
              )
              materialize_season_bracket_grade_cells(
                  c, source_table='lake.public.player_fantasy', nfl_stats_table=stats,
                  output_table='cmc_2025_season_grade', year=2025, player_id='00-0033280',
                  split_threshold=50,
              )
              c.execute("""
                CREATE OR REPLACE TABLE cmc_2025_season AS
                SELECT core.*, grades.grade_cells
                FROM cmc_2025_season_core AS core
                INNER JOIN cmc_2025_season_grade AS grades USING (NFL_player_id, year, position)
              """)
              assert c.execute('SELECT COUNT(*) FROM cmc_2025_season').fetchone()[0] == 1
              season_selected = c.execute("""
                SELECT cell.active_weeks, cell.inactive_weeks, cell.expected_starts,
                  cell.started_league_weeks, cell.eligible_league_weeks
                FROM cmc_2025_season, UNNEST(cohort_cells) AS u(cell)
                WHERE cell.q_teams=CASE WHEN cohort_profile.teams_12t_split=1 THEN '12t' ELSE 'ALL' END
                  AND cell.q_roster=CASE WHEN cohort_profile.roster_flx_split=1 THEN 'flx' ELSE 'ALL' END
                  AND cell.q_scoring=CASE WHEN cohort_profile.scoring_half_split=1 THEN 'half' ELSE 'ALL' END
                  AND cell.q_pass_td=CASE WHEN cohort_profile.pass_td_4pt_split=1 THEN '4pt' ELSE 'ALL' END
                  AND cell.q_dynasty=CASE WHEN cohort_profile.dynasty_redraft_split=1 THEN 'redraft' ELSE 'ALL' END
                  AND cell.q_best_ball=CASE WHEN cohort_profile.best_ball_managed_split=1 THEN 'managed' ELSE 'ALL' END
              """).fetchone()
              assert season_selected is not None
              active, inactive, expected_starts, started, eligible = season_selected
              assert (active, inactive) == (17, 0), season_selected
              assert abs(expected_starts - (started / eligible * active)) < 1e-9, season_selected
              season_core_cells, season_grade_cells = c.execute("""
                SELECT list_count(cohort_cells), list_count(grade_cells) FROM cmc_2025_season
              """).fetchone()
              assert season_core_cells <= 145, season_core_cells
              assert season_grade_cells <= 577, season_grade_cells

              c.execute('CREATE OR REPLACE TABLE cmc_career_seasons AS SELECT * FROM cmc_2025_season WHERE FALSE')
              for season_year in range(2017, 2026):
                  materialize_season_core_cohort_cells(
                      c, source_table='lake.public.player_fantasy', nfl_stats_table=stats,
                      output_table='cmc_one_season_core', year=season_year, player_id='00-0033280',
                      split_threshold=50,
                  )
                  materialize_season_bracket_grade_cells(
                      c, source_table='lake.public.player_fantasy', nfl_stats_table=stats,
                      output_table='cmc_one_season_grade', year=season_year, player_id='00-0033280',
                      split_threshold=50,
                  )
                  c.execute("""
                    INSERT INTO cmc_career_seasons
                    SELECT core.*, grades.grade_cells
                    FROM cmc_one_season_core AS core
                    INNER JOIN cmc_one_season_grade AS grades USING (NFL_player_id, year, position)
                  """)
              assert c.execute('SELECT COUNT(*) FROM cmc_career_seasons').fetchone()[0] == 9
              materialize_career_core_cohort_cells(
                  c, season_outer_table='cmc_career_seasons', output_table='cmc_career_core',
                  player_id='00-0033280',
              )
              materialize_career_cohort_grade_cells(
                  c, season_outer_table='cmc_career_seasons', output_table='cmc_career_grade',
                  player_id='00-0033280',
              )
              c.execute("""
                CREATE OR REPLACE TABLE cmc_career AS
                SELECT core.*, grades.grade_cells
                FROM cmc_career_core AS core
                INNER JOIN cmc_career_grade AS grades USING (NFL_player_id, position)
              """)
              assert c.execute('SELECT COUNT(*) FROM cmc_career').fetchone()[0] == 1
              career_selected = c.execute("""
                SELECT cell.qualifying_seasons
                FROM cmc_career, UNNEST(cohort_cells) AS u(cell)
                WHERE cell.q_teams='12t' AND cell.q_roster='flx' AND cell.q_scoring='half'
                  AND cell.q_pass_td='4pt' AND cell.q_dynasty='redraft' AND cell.q_best_ball='managed'
              """).fetchone()
              assert career_selected == (9,), career_selected
              career_core_cells, career_grade_cells = c.execute("""
                SELECT list_count(cohort_cells), list_count(grade_cells) FROM cmc_career
              """).fetchone()
              assert career_core_cells == 144, career_core_cells
              assert career_grade_cells == 576, career_grade_cells
              career_invalid = c.execute("""
                SELECT COUNT(*) FROM cmc_career, UNNEST(grade_cells) AS u(cell)
                WHERE cell.champ_credits > cell.playoff_credits
                   OR cell.champ_rate_pct > cell.playoff_rate_pct
              """).fetchone()[0]
              assert career_invalid == 0, career_invalid
              full_elapsed = perf_counter() - full_started
              full_receipt = {
                  'mode': mode, 'cmc_2025_source_rows': source_rows_2025,
                  'weekly_outer_rows': len(weekly_weeks), 'weekly_selected_cells': weekly_selected,
                  'weekly_nested_cells': weekly_cells, 'season_outer_rows': 1,
                  'season_selected': season_selected, 'season_core_cells': season_core_cells,
                  'season_grade_cells': season_grade_cells, 'career_outer_rows': 1,
                  'career_qualifying_seasons': career_selected[0],
                  'career_core_cells': career_core_cells, 'career_grade_cells': career_grade_cells,
                  'wall_seconds': round(full_elapsed, 3),
              }
              print(full_receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## CMC 2025 all-grain compact cache pilot\n')
                  summary.write(f'- Receipt: `{full_receipt}`\n')
                  summary.write('- Cache-only computation; no Fly read/write, settings join, API request, artifact, or publish step.\n')

          if mode in {'myles_2025_season', 'rb_2025_lane'}:
              player_name, lane_position = (
                  ('myles garrett', 'DL') if mode == 'myles_2025_season'
                  else ('christian mccaffrey', 'RB')
              )
              myles_ids = c.execute("""
                SELECT DISTINCT CAST(NFL_player_id AS VARCHAR)
                FROM ops.nfl_historical.nfl_player_stats_all
                WHERE CAST(year AS INTEGER)=2025
                  AND LOWER(TRIM(CAST(player AS VARCHAR)))=?
              """, [player_name]).fetchall()
              assert len(myles_ids) == 1, myles_ids
              myles_id = myles_ids[0][0]
              cache_positions = c.execute("""
                SELECT DISTINCT CAST(position AS VARCHAR)
                FROM lake.public.player_fantasy
                WHERE CAST(year AS INTEGER)=2025 AND CAST(NFL_player_id AS VARCHAR)=?
              """, [myles_id]).fetchall()
              if lane_position == 'DL':
                  assert set(cache_positions).issubset({('DL',), ('DE',), ('DT',), ('NT',), ('EDGE',)}), cache_positions
              else:
                  assert (lane_position,) in set(cache_positions), cache_positions
              weekly_started = perf_counter()
              materialize_weekly_core_cohort_cells(
                  c, source_table='lake.public.player_fantasy',
                  valid_player_weeks_table='cached_regular_player_weeks', output_table='weekly_2025_dl',
                  year=2025, week=None, player_id=None, position=lane_position, split_threshold=150,
              )
              weekly_seconds = perf_counter() - weekly_started
              weekly_batch_rows = c.execute('SELECT COUNT(*) FROM weekly_2025_dl').fetchone()[0]
              c.execute('CREATE OR REPLACE TABLE myles_2025_weekly AS SELECT * FROM weekly_2025_dl WHERE NFL_player_id=?', [myles_id])
              core_started = perf_counter()
              materialize_season_core_cohort_position_batch(
                  c, source_table='lake.public.player_fantasy', nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
                  output_table='myles_2025_season_core', year=2025, position=lane_position, split_threshold=50,
              )
              core_seconds = perf_counter() - core_started
              grade_started = perf_counter()
              materialize_season_bracket_grade_position_batch(
                  c, source_table='lake.public.player_fantasy', nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
                  output_table='myles_2025_season_grade', year=2025, position=lane_position, split_threshold=50,
              )
              grade_seconds = perf_counter() - grade_started
              c.execute("""
                CREATE OR REPLACE TABLE myles_2025_season AS
                SELECT core.*, grades.grade_cells
                FROM myles_2025_season_core AS core
                INNER JOIN myles_2025_season_grade AS grades USING (NFL_player_id, year, position)
                WHERE core.NFL_player_id = ?
              """, [myles_id])
              batch_core_rows, batch_grade_rows = c.execute("""
                SELECT
                  (SELECT COUNT(*) FROM myles_2025_season_core),
                  (SELECT COUNT(*) FROM myles_2025_season_grade)
              """).fetchone()
              weekly_rows, weekly_min, weekly_max, weekly_cells = c.execute("""
                SELECT COUNT(*), MIN(week), MAX(week), COALESCE(SUM(list_count(cohort_cells)), 0)
                FROM myles_2025_weekly
              """).fetchone()
              assert weekly_rows > 0 and weekly_min >= 1 and weekly_max <= 18, (weekly_rows, weekly_min, weekly_max)
              if mode == 'rb_2025_lane':
                  assert weekly_rows == 17 and (weekly_min, weekly_max) == (1, 18), (weekly_rows, weekly_min, weekly_max)
              assert weekly_cells <= weekly_rows * 145, weekly_cells
              assert c.execute('SELECT COUNT(*) FROM myles_2025_season').fetchone()[0] == 1
              season_position, season_core_cells, season_grade_cells = c.execute("""
                SELECT position, list_count(cohort_cells), list_count(grade_cells) FROM myles_2025_season
              """).fetchone()
              assert season_position == lane_position, season_position
              assert season_core_cells <= 145 and season_grade_cells <= 577
              core_invalid = c.execute("""
                SELECT COUNT(*) FROM myles_2025_season, UNNEST(cohort_cells) AS u(cell)
                WHERE cell.eligible_league_weeks < 0 OR cell.rostered_league_weeks < 0
                   OR cell.started_league_weeks < 0 OR cell.started_league_weeks > cell.eligible_league_weeks
                   OR cell.healthy_started_league_weeks > cell.healthy_eligible_league_weeks
                   OR cell.valid_started_outcomes > cell.started_league_weeks
              """).fetchone()[0]
              grade_invalid = c.execute("""
                SELECT COUNT(*) FROM myles_2025_season, UNNEST(grade_cells) AS u(cell)
                WHERE cell.eligible_leagues < 0 OR cell.playoff_leagues < 0 OR cell.champ_leagues < 0
                   OR cell.champ_leagues > cell.playoff_leagues OR cell.playoff_leagues > cell.eligible_leagues
              """).fetchone()[0]
              assert core_invalid == 0 and grade_invalid == 0, (core_invalid, grade_invalid)
              myles_receipt = {
                  'mode': mode, 'player_name': player_name, 'player_id': myles_id, 'canonical_position': season_position,
                  'weekly_seconds': round(weekly_seconds, 3), 'weekly_batch_outer_rows': weekly_batch_rows,
                  'core_seconds': round(core_seconds, 3), 'grade_seconds': round(grade_seconds, 3),
                  'batch_core_outer_rows': batch_core_rows, 'batch_grade_outer_rows': batch_grade_rows,
                  'weekly_outer_rows': weekly_rows, 'weekly_week_range': (weekly_min, weekly_max),
                  'weekly_nested_cells': weekly_cells, 'season_core_cells': season_core_cells,
                  'season_grade_cells': season_grade_cells,
              }
              print(myles_receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Myles Garrett 2025 compact IDP cache pilot\n')
                  summary.write(f'- Receipt: `{myles_receipt}`\n')
                  summary.write('- Cache-only computation; no Fly read/write, settings join, API request, artifact, or publish step.\n')
          PY
      - name: Export restored cache for local read-only diagnostics
        if: ${{ inputs.mode == 'local_cache_export' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-public-lake-readonly-${{ github.run_id }}
          path: research_public_lake
          compression-level: 0
          retention-days: 1

