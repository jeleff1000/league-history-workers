name: Combine Targeted Source Matchup Rescue

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed targeted source rescue run
        required: true
        default: "31061989974"

permissions:
  contents: read
  actions: read

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          repository: jeleff1000/yahoo_oauth
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download rescue artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download '${{ inputs.source_run_id }}' \
            --repo '${{ github.repository }}' \
            --pattern 'research-source-matchup-rescue-*' \
            --dir input
      - name: Combine and validate
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/combine_source_matchup_rescue_sidecar.py \
            --input-dir input \
            --out out/source_matchup_rescue.parquet \
            --status-out out/source_matchup_rescue_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-source-matchup-rescue-combined-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
