name: Finalize MFL Register Waves

on:
  workflow_dispatch:
    inputs:
      wave_run_ids:
        description: 'Comma-separated MFL campaign run IDs; raw league artifacts are unioned across original and repair runs'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download validated wave artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.wave_run_ids }}
        run: |
          mkdir -p waves
          IFS=',' read -ra IDS <<< "$RUN_IDS"
          for id in "${IDS[@]}"; do
            page=1
            while :; do
              payload=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100&page=$page")
              count=$(jq '.artifacts | length' <<< "$payload")
              while IFS=$'\t' read -r artifact_id artifact_name; do
                [ -n "$artifact_id" ] || continue
                case "$artifact_name" in
                  mfl-register-*) ;;
                  *) continue ;;
                esac
                dest="waves/$id/$artifact_id"
                mkdir -p "$dest"
                printf '%s\n' "$artifact_name" > "$dest/artifact_name.txt"
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$dest/artifact.zip"
                unzip -q "$dest/artifact.zip" -d "$dest"
                rm -f "$dest/artifact.zip"
              done < <(jq -r '.artifacts[] | [.id, .name] | @tsv' <<< "$payload")
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done
          done
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install DuckDB
        run: pip install duckdb
      - name: Validate and merge both waves
        run: |
          python3 - <<'PY'
          import json, pathlib, duckdb
          root = pathlib.Path('waves')
          receipt_paths = sorted(root.rglob('receipt.json'))
          missing_receipts = sorted(
              p.parent.joinpath('artifact_name.txt').read_text(encoding='utf-8').strip()
              for p in root.rglob('artifact_name.txt')
              if not p.parent.joinpath('receipt.json').exists()
          )
          if missing_receipts:
              print('artifacts without validated receipts:')
              print('\n'.join(missing_receipts))
          rows = [json.loads(p.read_text(encoding='utf-8')) for p in receipt_paths]
          keys = {(int(r['season']), str(r['league_id'])) for r in rows}
          if len(rows) != 330 or len(keys) != 330: raise SystemExit(f'expected 330 unique rows, got {len(rows)} rows/{len(keys)} keys')
          from collections import Counter
          counts = Counter(int(r['season']) for r in rows)
          bad = {y: n for y, n in counts.items() if n != 10}
          if bad or set(counts) != set(range(1993, 2026)): raise SystemExit(f'per-year counts invalid: {bad}')
          for r in rows:
              if r['seed'] != f"{r['season']}:{r['league_id']}": raise SystemExit(f"YEAR:ID mismatch: {r['seed']}")
              if any(int(v or 0) <= 0 for v in r.get('non_null_counts',{}).values()): raise SystemExit(f"empty signal: {r['seed']}")
          out = duckdb.connect('mfl_register_snapshot.duckdb')
          seen_keys = set()
          for src_path in sorted(root.rglob('league.duckdb')):
              # A repair run may contain an artifact for a key already present in
              # an original run. The receipt set is the authority; duplicate raw
              # artifacts are ignored rather than double-inserting rows.
              receipt_path = src_path.parent / 'receipt.json'
              if not receipt_path.exists(): continue
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              key = (int(receipt['season']), str(receipt['league_id']))
              if key not in keys: continue
              if key in seen_keys: continue
              seen_keys.add(key)
              out.execute(f"ATTACH '{src_path.as_posix()}' AS src (READ_ONLY)")
              for t in ('league_settings','matchup','player_fantasy'):
                  if not out.execute("select count(*) from information_schema.tables where table_catalog='src' and table_schema='main' and table_name=?",[t]).fetchone()[0]: continue
                  if not out.execute("select count(*) from information_schema.tables where table_schema='main' and table_name=?",[t]).fetchone()[0]: out.execute(f'create table "{t}" as select * from src.main."{t}"')
                  else: out.execute(f'insert into "{t}" select * from src.main."{t}"')
              out.execute('detach src')
          if len(seen_keys) != 330: raise SystemExit(f'expected 330 source databases, found {len(seen_keys)}')
          out.close()
          pathlib.Path('mfl_register_all_runs.json').write_text(json.dumps({'schema_version':'mfl_register_results_v1','start_year':1993,'end_year':2025,'per_year':10,'league_count':330,'leagues':sorted(rows,key=lambda r:(int(r['season']),str(r['league_id'])))},indent=2,sort_keys=True),encoding='utf-8')
          print('validated and merged 330 MFL season-league results')
          PY
      - name: Upload final 330-league register
        uses: actions/upload-artifact@v4
        with:
          name: mfl-register-all-runs-${{ github.run_id }}
          retention-days: 90
          path: |
            mfl_register_all_runs.json
            mfl_register_snapshot.duckdb
